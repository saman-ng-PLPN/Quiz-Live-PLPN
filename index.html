<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10283a">
<title>Quiz Live PLPN</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="avatars.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --paper:#f6f3ec; --card:#fff; --ink:#18222d; --muted:#5f6c78; --line:#e2dccf;
  --navy:#10283a; --navy2:#183b54; --navy3:#22506f; --sun:#ffc63d; --sun2:#ffdb7d;
  --c0:#e44d57; --c1:#2c7bd6; --c2:#ec9a26; --c3:#2a9d63;
  --good:#1f8a54; --bad:#b4373e;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Kanit','Prompt',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;min-height:100dvh;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}
.c0{background:var(--c0)} .c1{background:var(--c1)} .c2{background:var(--c2)} .c3{background:var(--c3)}

.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:600;background:var(--navy);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;
  transition:transform .1s, opacity .2s}
.btn:active{transform:translateY(1px)}
.btn.sun{background:var(--sun);color:var(--navy)}
.btn.ghost{background:transparent;border:1.5px solid currentColor;color:inherit}
.btn.light{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid #e8c3c3}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.lg{padding:16px 26px;font-size:20px;border-radius:14px}
.btn:disabled{opacity:.4;cursor:default;transform:none}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,150%);
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;transition:transform .3s;z-index:99;
  max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:15px}
#toast.show{transform:translate(-50%,0)}
#toast.err{background:var(--bad)}
.center-msg{min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center}
.center-msg .box{max-width:460px}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid rgba(127,127,127,.25);border-top-color:currentColor;
  animation:spin .8s linear infinite;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- ผู้เล่น ---------- */
body.player{background:var(--navy);color:#fff}
body.player.good{background:var(--good)} body.player.bad{background:var(--bad)}
.brand{font-weight:800;letter-spacing:-.5px;line-height:1}
.brand span{color:var(--sun)}
.join{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:22px;
  padding:24px 16px calc(24px + env(safe-area-inset-bottom));max-width:440px;margin:auto}
.join .brand{font-size:44px;text-align:center}
.join .tag{text-align:center;margin:-12px 0 0;opacity:.75}
.jcard{background:#fff;color:var(--ink);border-radius:20px;padding:20px;display:grid;gap:12px;
  box-shadow:0 12px 40px rgba(0,0,0,.25)}
.jcard label{font-size:14px;color:var(--muted);margin-bottom:-6px}
.jcard input{width:100%;padding:13px;border:2px solid var(--line);border-radius:12px;font-size:20px;text-align:center;outline:none}
.jcard input:focus{border-color:var(--navy3)}
#pin{font-size:32px;letter-spacing:10px;font-weight:700}
.jcard .btn{padding:15px;font-size:19px}
.host-link{text-align:center;opacity:.7;font-size:14px}
.jcard .prebox{display:grid;gap:12px}
.jcard .prebox[hidden],.jcard #nickbox[hidden]{display:none}
.jcard .prebox .seg{flex-wrap:wrap}
.jcard .prebox .seg label{margin:0;color:var(--ink);font-size:15px;min-width:40%}
.jcard .prebox .inp{font-size:17px;text-align:left}
.prenote{background:#eef4f9;border:1px solid #c9def5;border-radius:12px;padding:10px 12px;font-size:14px;color:var(--ink);line-height:1.5}
.roomline{font-size:15px;opacity:.9}

.pscreen{min-height:100dvh;display:flex;flex-direction:column;gap:14px;max-width:560px;margin:auto;
  padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.pbar{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:8px}
.pbar .me{background:rgba(255,255,255,.14);padding:4px 12px;border-radius:99px;max-width:50%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbar{height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--sun);width:100%;transition:width .2s linear}
.pq{font-size:21px;font-weight:600;margin:0}
.pimg{max-width:100%;max-height:28vh;object-fit:contain;border-radius:12px;align-self:center;background:#fff}
.pchoices{display:grid;gap:10px}
.pc{display:flex;align-items:center;gap:12px;border:0;border-radius:16px;padding:14px;color:#fff;font-size:18px;
  text-align:left;min-height:66px;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .08s,opacity .2s}
.pc b{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.24);display:grid;place-items:center;
  font-size:22px;flex:none}
.pc:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.pc:disabled{cursor:default}
.pc.dim{opacity:.3}
.pmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.pmid h1{font-size:34px;margin:0;line-height:1.15}
.pmid p{margin:0;opacity:.85;font-size:17px}
.bignum{font-size:56px;font-weight:800;line-height:1}
.chosen{display:flex;align-items:center;gap:12px;padding:16px 20px;border-radius:16px;font-size:20px;max-width:100%}
.chosen b{font-size:26px}
.stat{display:flex;gap:10px;width:100%}
.stat div{flex:1;background:rgba(0,0,0,.18);border-radius:14px;padding:12px}
.stat small{display:block;opacity:.8;font-size:13px}
.stat strong{font-size:26px}
.dots span{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--sun);margin:0 4px;
  animation:bounce 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s} .dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-10px);opacity:1}}
.namechip{font-size:26px;font-weight:700;background:#fff;color:var(--navy);padding:8px 22px;border-radius:99px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis}
.linkbtn{background:none;border:0;opacity:.7;text-decoration:underline;font-size:14px;padding:8px}

/* ---------- ผู้จัด ---------- */
.topbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
.topbar .in{max-width:980px;margin:auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.topbar .brand{font-size:24px;text-decoration:none;white-space:nowrap}
.hlogo{display:inline-flex;align-items:center;background:#fff;border-radius:10px;padding:4px 8px;flex:none}
.hlogo img{height:30px;width:auto;display:block}
.tst-head .hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tst-head .hlogo img{height:26px}
@media (max-width:640px){.topbar .who{display:none}.topbar #logout{margin-left:auto}.hlogo img{height:24px}.topbar .brand{font-size:20px}}
@media (max-width:480px){.topbar .in{flex-wrap:wrap;row-gap:6px;padding:10px 16px}.topbar .hlogo{order:3}}
.topbar .who{margin-left:auto;font-size:13px;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
.wrap{max-width:980px;margin:auto;padding:20px 16px 120px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
h2.sec{font-size:22px;margin:0}
.tabs{display:flex;gap:6px;background:#ebe5d8;padding:4px;border-radius:12px;width:max-content;max-width:100%}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:500;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.search{padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;min-width:0;width:100%;max-width:280px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:16px}
.qz{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.qz h3{margin:0;font-size:18px;line-height:1.3}
.qz .meta{font-size:13px;color:var(--muted)}
.qz .acts{display:flex;gap:8px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.dept{display:inline-block;font-size:12px;background:#fff4d4;color:#7a5600;padding:2px 9px;border-radius:99px;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:40px 16px;border:2px dashed var(--line);border-radius:16px;margin-top:16px}
.live{background:#fff8e3;border:1px solid #f3dc9a;border-radius:14px;padding:12px 14px;margin-top:16px}
.live .it{display:flex;align-items:center;gap:10px;padding:6px 0;flex-wrap:wrap}
.live .it + .it{border-top:1px dashed #ecd9a4}

.fld{display:grid;gap:6px}
.fld label{font-size:14px;color:var(--muted);font-weight:500}
.inp{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;background:#fff;outline:none}
.inp:focus{border-color:var(--navy3)}
textarea.inp{resize:vertical;min-height:62px}
.meta-grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:16px;margin-top:14px}
.meta-grid .full{grid-column:1/-1}
.qcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px;display:grid;gap:10px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qnum{font-weight:700;background:var(--navy);color:#fff;border-radius:9px;padding:3px 11px}
.qhead select{padding:6px 8px;border:1.5px solid var(--line);border-radius:9px;background:#fff}
.icon-btn{border:1.5px solid var(--line);background:#fff;border-radius:9px;width:34px;height:34px;display:grid;place-items:center;font-size:15px}
.icon-btn:disabled{opacity:.35}
.qimg{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qimg img{max-height:120px;max-width:220px;border-radius:10px;border:1px solid var(--line)}
.upl{font-size:14px;color:var(--navy3);border:1.5px dashed #b8c7d3;border-radius:10px;padding:7px 12px;cursor:pointer}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:5px 6px 5px 5px;background:#fff}
.opt.on{border-color:var(--good);background:#eefaf3}
.opt .mark{position:relative;flex:none;cursor:pointer}
.opt .mark input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt .mark b{width:36px;height:36px;border-radius:9px;color:#fff;display:grid;place-items:center;font-size:18px}
.opt.on .mark b::after{content:'✓';position:absolute;right:-5px;top:-6px;background:var(--good);color:#fff;
  width:18px;height:18px;border-radius:50%;font-size:11px;display:grid;place-items:center;border:2px solid #fff}
.opt input[type=text]{border:0;outline:none;flex:1;min-width:0;padding:6px;background:transparent}
.hint{font-size:13px;color:var(--muted);margin:0}
.savebar{position:fixed;left:0;right:0;bottom:0;background:rgba(246,243,236,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);z-index:6}
.savebar .in{max-width:980px;margin:auto;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));align-items:center}
.savebar .st{font-size:13px;color:var(--muted)}
/* v6: Pre/Post Test */
body.test{background:#eef2f6;color:var(--ink)}
.tst{max-width:640px;margin:auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom))}
.tst-head{background:var(--navy);color:#fff;border-radius:18px;padding:18px;display:grid;gap:8px}
.tst-head .brand{font-size:22px}
.tst-head h1{margin:0;font-size:22px;line-height:1.3}
.tst-head img{width:100%;max-height:180px;object-fit:cover;border-radius:12px}
.phase{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:#e9eef3;color:var(--muted)}
.phase.open{background:#dff3e8;color:#1b6b42}
.phase.pre{background:#e3efff;color:#1f5ea8} .phase.post{background:#fff1d6;color:#8a5a00}
.phase.warn{background:#fde8e8;color:#a32020} .phase.late{background:#f3e8ff;color:#6b21a8}
.dk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.dk>div{border-radius:14px;padding:12px;text-align:center;border:1px solid transparent}
.dk b{display:block;font-size:26px;line-height:1.2}.dk span{font-size:13px}.dk small{display:block;font-size:11.5px;opacity:.8}
.dk .b{background:#eef4ff;border-color:#dbe7fb;color:#1e3a8a}.dk .g{background:#e9f8ef;border-color:#cdeedb;color:#1b6b42}.dk .r{background:#fdeeee;border-color:#f6d3d3;color:#a32020}
.dk .y{background:#fff7e3;border-color:#f5e3b5;color:#8a5a00}.dk .v{background:#eff0fe;border-color:#d9dcfb;color:#3f3cbb}.dk .n{background:#f4f6f9;border-color:#e2e8f0;color:#0f172a}
@media (max-width:560px){.dk{grid-template-columns:repeat(2,1fr)}.dk b{font-size:22px}}
.dsec{margin-top:18px}.dsec>h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:17px}.dsec>h3 .grow{flex:1}
details.dl{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:10px 14px;margin-top:8px}details.dl summary{cursor:pointer;font-weight:600;font-size:14px}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tiles3>div{background:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tiles3 b{display:block;font-size:24px;color:var(--navy)}.tiles3 span{font-size:13px;color:var(--muted)}
.pmodal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.pmodal .box{background:#fff;border-radius:16px;padding:20px;max-height:92vh;overflow:auto}
.tcard{background:#fff;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:grid;gap:10px}
.tcard .fld label{color:var(--muted)}
.seg{display:flex;gap:8px}
.seg label{flex:1;border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-weight:600;cursor:pointer}
.seg input{display:none}
.seg label:has(input:checked){border-color:var(--navy3);background:#eef4f9}
.seg label:has(input:disabled){opacity:.4;cursor:default}
.tq{background:#fff;border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:grid;gap:10px;scroll-margin-top:70px}
.tq .qn{font-size:13px;color:var(--muted);font-weight:600}
.tq h3{margin:0;font-size:18px;line-height:1.4}
.tq .qimg{max-width:100%;max-height:240px;border-radius:10px;justify-self:center;object-fit:contain}
.tq .opts2{display:grid;gap:8px}
.tq .opts2.imgs{grid-template-columns:1fr 1fr}
.tq textarea.ans{width:100%;min-height:96px;border:2px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:16px;resize:vertical}
.tq textarea.ans:focus{outline:none;border-color:var(--ink)}
.tq .wtag,.kindsw .wtag{display:inline-block;background:#eef3ff;color:#2a4fa0;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600}
.kindsw{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;user-select:none}
.qcard.textq .pal,.qcard.textq .opts,.qcard.textq .choicehint,.qcard.textq select[data-f=time_limit]{display:none}
.wans{display:grid;gap:6px}.wans .wa{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;white-space:pre-wrap}
.wans .wa small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.tch{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;padding:8px;background:#fff;text-align:left;font-size:16px;width:100%}
.tch b{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:17px}
.tch .cbody{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.tch .cimg{max-height:120px;border-radius:8px;align-self:flex-start}
.tch.on{border-color:var(--navy3);background:#eaf2fa;box-shadow:inset 0 0 0 1px var(--navy3)}
.tch.right{border-color:var(--good);background:#eaf8f0}
.tch.wrong{border-color:var(--bad);background:#fdecec}
.tch .mk{margin-left:auto;font-weight:700}
.tbar2{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:6}
.tbar2 .in{max-width:640px;margin:auto;display:flex;gap:10px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.tbar2 .prog{flex:1;font-size:14px;color:var(--muted)}
.tbar2 .prog i{display:block;height:6px;border-radius:99px;background:#e3e8ee;margin-top:5px;overflow:hidden}
.tbar2 .prog i span{display:block;height:100%;background:var(--good);transition:width .2s}
.score-big{font-size:64px;font-weight:800;line-height:1;text-align:center}
.score-big small{font-size:24px;color:var(--muted);font-weight:600}
.passbadge{justify-self:center;padding:6px 18px;border-radius:99px;font-weight:700}
.passbadge.ok{background:#dff3e8;color:#1b6b42} .passbadge.no{background:#fde4e4;color:#9b2c2c}
/* v7: สอบซ้ำ / แบบประเมิน */
.tq.wrongq{box-shadow:0 0 0 2px var(--bad)}
.anon{background:#eef6ff;border:1px solid #c9def5;border-radius:12px;padding:10px 12px;font-size:14px;color:#1f4e79}
.svsec{margin:20px 4px 0;font-size:17px;color:var(--navy3)}
.stars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stars button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 0;display:grid;place-items:center;gap:0;color:#c3cad2}
.stars button span{font-size:28px;line-height:1.1}
.stars button small{font-size:12px;color:var(--muted)}
.stars button.on{border-color:#f0b400;background:#fff8e0;color:#f0b400}
.starlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-4px}
.svq.miss{box-shadow:0 0 0 2px var(--bad)}
.cmts{margin:6px 0 0;padding-left:20px;display:grid;gap:6px}
.svitem.section{background:#f3f6fa}
.qroverlay.review{justify-content:flex-start;align-items:stretch;gap:2vh;padding:3vh 4vw;overflow:auto}
.qroverlay.review .rvtop{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qroverlay.review .qtext{text-align:left}
.qroverlay.review .tiles{margin-top:0}
.qroverlay.review .btn.ghost{color:#fff;border-color:rgba(255,255,255,.4)}
/* จัดการรอบ + รายงาน */
.trow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.linkbox{display:flex;align-items:center;gap:8px;background:#f3f6f9;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:600;word-break:break-all}
.tiles4{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.stile small{display:block;color:var(--muted);font-size:13px}
.stile strong{font-size:26px}
.stile em{font-style:normal;font-size:13px;color:var(--muted)}
.tblwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
table.rep{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
table.rep th,table.rep td{padding:8px 10px;border-bottom:1px solid #eef0f3;text-align:left;white-space:nowrap}
table.rep th{background:#f6f8fa;font-weight:600;position:sticky;top:0}
table.rep td.num,table.rep th.num{text-align:right}
table.rep tr.low td{background:#fff5f5}
.up{color:var(--good);font-weight:700} .down{color:var(--bad);font-weight:700}
.xbtn{border:0;background:none;color:#b9c1ca;padding:0 4px;font-size:13px}
.xbtn:hover{color:var(--bad)}
.qroverlay{position:fixed;inset:0;background:var(--navy);color:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:3vh}
.qroverlay .qrbox{width:min(70vh,90vw)}
.qroverlay h1{margin:0;font-size:clamp(24px,3.4vw,52px);text-align:center}
.qroverlay .url{font-size:clamp(22px,3vw,44px);font-weight:700;color:var(--sun2)}
.qroverlay .code{font-size:clamp(18px,2vw,30px);opacity:.85}
/* v5: รูปประจำตัว */
.avwrap{position:relative;display:inline-block;line-height:0}
.avwrap .av.xl{width:132px;height:132px}
.avwrap .medal{position:absolute;right:-10px;bottom:-8px;font-size:48px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.av{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;line-height:0;
  background:var(--navy3);color:#fff;font-weight:700;font-size:16px;vertical-align:middle}
.av svg{width:100%;height:100%;display:block}
.av.lg{width:96px;height:96px;font-size:36px;box-shadow:0 0 0 4px #fff}
.av.xl{width:clamp(72px,9vw,130px);height:clamp(72px,9vw,130px);font-size:40px;box-shadow:0 0 0 5px #fff}
.av.sm{width:26px;height:26px;font-size:12px}
.avpick{display:flex;align-items:center;gap:10px}
.avpick .av{width:52px;height:52px;box-shadow:0 0 0 3px var(--sun)}
.avpick input{flex:1;min-width:0}
.avtabs{display:flex;gap:6px}
.avtabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px;font-size:14px;color:var(--muted)}
.avtabs button.on{border-color:var(--navy3);color:var(--ink);font-weight:600;background:#eef4f9}
.avgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:236px;overflow-y:auto;padding:4px}
.avgrid button{border:0;background:none;padding:0;border-radius:50%;aspect-ratio:1;transition:transform .1s}
.avgrid button .av{width:100%;height:100%}
.avgrid button.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--good);transform:scale(.92)}
.pbar .me{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 3px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 16px 5px 5px}
.chip .av{width:clamp(30px,2.6vw,40px);height:clamp(30px,2.6vw,40px)}
.lbrow .nm{display:flex;align-items:center;gap:10px;left:8px}
.lbrow .nm .av{width:calc(var(--row) - 18px);height:calc(var(--row) - 18px)}
.lbrow .nm span{overflow:hidden;text-overflow:ellipsis}
.rest span{display:inline-flex;align-items:center;gap:6px;padding:3px 14px 3px 3px}
/* v4: แถบเฉลยบนหน้าสรุปคะแนน */
.ansbar{display:flex;align-items:center;justify-content:center;gap:clamp(10px,1.4vw,20px);flex-wrap:wrap;
  font-size:clamp(16px,1.6vw,24px);animation:pop .4s ease-out}
.ansbar .lbl{opacity:.85} .ansbar .lbl b{color:var(--sun);font-size:1.2em}
.anschip{display:inline-flex;align-items:center;gap:12px;border-radius:14px;padding:8px 18px 8px 8px;font-weight:700;
  font-size:clamp(18px,2vw,30px);box-shadow:0 0 0 4px #fff}
.anschip b{width:1.6em;height:1.6em;border-radius:10px;background:rgba(255,255,255,.25);display:grid;place-items:center}
.anschip img{height:clamp(44px,7vh,80px);border-radius:8px;background:#fff}
/* v3: แชร์ / ผู้ดูแล */
.vis{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;font-weight:600;background:#eef1f4;color:var(--muted)}
.vis.shared{background:#e3f4ea;color:#1b6b42}
.edpanel{border:2px solid #c9def5;background:#f4f9ff;border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.edpanel h3{margin:0;font-size:17px}
.mdl{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.mdl .box{background:#fff;border-radius:16px;max-width:540px;width:100%;padding:18px;display:grid;gap:10px;max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:500}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:99px;background:#cfd6dc;position:relative;
  transition:background .2s;flex:none;cursor:pointer;margin:0}
.switch input::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
  transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked{background:var(--good)}
.switch input:checked::after{transform:translateX(20px)}
.notice{background:#fff4d4;border:1px solid #f0d78c;border-radius:12px;padding:10px 14px;font-size:14px;margin-top:12px}
.notice.ok{background:#e3f4ea;border-color:#a9dcbd;color:#17583a;margin-top:6px}
.notice.warn{background:#fff1e6;border-color:#f3b98c;color:#8a3d0a;margin-top:6px}
.adminbox{margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:4px 16px}
.adminbox summary{cursor:pointer;font-weight:600;padding:12px 0}
.adminbox .it{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
/* v2: หน้าปก / สี / รูปคำตอบ */
.qz .cover{margin:-16px -16px 4px;aspect-ratio:16/7;border-radius:16px 16px 0 0;object-fit:cover;width:calc(100% + 32px);
  display:block;background:linear-gradient(135deg,var(--navy3),var(--navy));color:rgba(255,255,255,.85);
  font-size:40px;font-weight:800;display:grid;place-items:center}
.coverfld{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.coverfld img{width:180px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.pal{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.palbtn{display:flex;border:1.5px solid var(--line);border-radius:8px;padding:3px;background:#fff;gap:2px}
.palbtn i{width:12px;height:18px;border-radius:3px;display:block}
.opt .ocol{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.othumb{position:relative;align-self:flex-start;margin:0 6px 4px}
.othumb img{height:64px;max-width:120px;border-radius:8px;border:1px solid var(--line);display:block;object-fit:cover}
.othumb button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);
  color:#fff;font-size:12px;display:grid;place-items:center;padding:0}
.obtn{flex:none;width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);display:grid;place-items:center;
  cursor:pointer;font-size:16px;position:relative;overflow:hidden;background:#fff}
.obtn.swatch{border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.obtn.swatch input{position:absolute;inset:-8px;width:60px;height:60px;opacity:0;cursor:pointer}
.cimg{display:block;max-width:100%;border-radius:10px;background:#fff;object-fit:contain}
.pchoices.imgs{grid-template-columns:1fr 1fr}
.pchoices.imgs .pc{flex-direction:column;align-items:stretch;text-align:center;padding:10px}
.pchoices.imgs .pc b{position:absolute;top:8px;left:8px;width:32px;height:32px;font-size:18px;z-index:1}
.pc{position:relative}
.pc .cbody{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.pc .cimg{max-height:22vh;margin:auto}
.chosen{flex-direction:column}
.chosen .cimg{max-height:26vh}
.chosen .cb{display:flex;align-items:center;gap:12px}
.tile .cbody{position:relative;flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile .cimg{max-height:20vh;align-self:flex-start}
.tiles.imgs .tile{align-items:flex-start}
.lobby-cover{width:100%;max-height:24vh;object-fit:cover;border-radius:18px;margin-bottom:clamp(10px,1.5vw,20px)}
.pcover{width:100%;max-height:30vh;object-fit:cover;border-radius:16px}
@media (max-width:640px){
  .meta-grid{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .savebar .st{display:none}
  .savebar .btn{flex:1;padding:12px 10px}
}

/* ---------- จอใหญ่ ---------- */
body.stage{background:radial-gradient(1200px 700px at 85% -10%, #21506f 0%, transparent 60%),
  radial-gradient(900px 600px at -10% 110%, #1b4560 0%, transparent 55%), var(--navy);color:#fff;
  overflow-x:hidden}
.stg{min-height:100dvh;display:flex;flex-direction:column;padding:clamp(14px,2.2vw,32px);gap:clamp(12px,1.8vw,24px)}
.stg-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.12);border-radius:99px;padding:6px 14px;font-size:clamp(14px,1.2vw,18px);font-weight:500}
.pill.sun{background:var(--sun);color:var(--navy);font-weight:700}
.stg-top .brand{font-size:clamp(20px,1.8vw,28px);margin-right:6px}
.stg-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-left:auto}
.stg .btn.ghost{border-color:rgba(255,255,255,.35)}

.lobby{flex:1;display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(16px,3vw,48px);align-items:center}
.joininfo p{margin:0;font-size:clamp(16px,1.6vw,24px);opacity:.8}
.joininfo .url{font-size:clamp(20px,2.2vw,34px);font-weight:600;margin:4px 0 clamp(14px,2vw,28px);word-break:break-all;color:var(--sun2)}
.joininfo .pin{font-size:clamp(64px,10vw,150px);font-weight:800;letter-spacing:.06em;line-height:1}
.qrbox{background:#fff;border-radius:22px;padding:clamp(10px,1.2vw,20px);justify-self:center;
  width:max(240px,min(100%,calc(100dvh - 360px)));aspect-ratio:1}
.qrcell{display:flex;flex-direction:column;align-items:center;min-width:0}
.qrcap{text-align:center;margin-top:10px;font-size:clamp(14px,1.3vw,20px);opacity:.8}
.qrbox img,.qrbox canvas{width:100%!important;height:100%!important;image-rendering:pixelated}
.lobby-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.15);padding-top:14px}
.lobby-bar .count{font-size:clamp(20px,2vw,30px)} .lobby-bar .count b{font-size:1.4em;color:var(--sun)}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;min-height:60px;max-height:22vh;overflow-y:auto}
.chip{background:#fff;color:var(--navy);font-weight:600;padding:8px 16px;border-radius:99px;font-size:clamp(15px,1.4vw,21px);
  border:0;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.chip:hover{text-decoration:line-through;background:#ffe1e1}
/* หน้ารอคนเข้า: พอดี 1 จอเสมอ — QR ย่อตามพื้นที่ที่เหลือ รายชื่อเลื่อนในกล่องของตัวเอง */
.stg.lobbyv{height:100dvh;min-height:0;overflow:hidden}
.stg.lobbyv .lobby{flex:1 1 0;min-height:0;align-items:stretch}
.stg.lobbyv .joininfo{align-self:center;min-height:0}
.stg.lobbyv .joininfo .pin{font-size:clamp(56px,min(10vw,15vh),150px)}
.stg.lobbyv .lobby-cover{max-height:18vh}
.stg.lobbyv .qrcell{min-height:0;justify-content:center}
.stg.lobbyv .qrbox{flex:none;aspect-ratio:auto}
.stg.lobbyv .lobby-bar{flex:0 0 auto;padding-top:10px}
.stg.lobbyv .chips{flex:0 1 auto;max-height:26vh;min-height:44px;padding-bottom:4px}
.chips.many .chip{font-size:clamp(13px,1.05vw,17px);padding:4px 12px 4px 4px}
.chips.many .chip .av{width:26px;height:26px}
.chips.lots .chip{font-size:clamp(12px,.9vw,15px);padding:2px 10px 2px 3px}
.chips.lots .chip .av{width:22px;height:22px}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}

.qwrap{flex:1;display:flex;flex-direction:column;gap:clamp(12px,1.6vw,22px)}
.qline{display:flex;align-items:center;gap:clamp(12px,2vw,28px)}
.timer{flex:none;width:clamp(70px,8vw,120px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font-size:clamp(28px,3.4vw,52px);font-weight:800;background:conic-gradient(var(--sun) var(--p,100%), rgba(255,255,255,.14) 0);
  position:relative}
.timer::before{content:'';position:absolute;inset:8%;border-radius:50%;background:var(--navy2)}
.timer span{position:relative}
.timer.low{animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
.qtext{font-size:clamp(24px,3.2vw,54px);font-weight:700;margin:0;line-height:1.25}
.qimgbig{align-self:center;max-width:min(100%,900px);max-height:34vh;border-radius:16px;background:#fff;object-fit:contain}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.4vw,18px);margin-top:auto}
.tile{border-radius:18px;padding:clamp(12px,1.6vw,24px);display:flex;align-items:center;gap:clamp(10px,1.4vw,20px);
  font-size:clamp(18px,2.2vw,36px);font-weight:600;min-height:clamp(70px,9vh,130px);position:relative;overflow:hidden;
  transition:opacity .4s, transform .4s;box-shadow:0 6px 0 rgba(0,0,0,.22)}
.tile b{flex:none;width:clamp(44px,4.5vw,72px);aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.24);
  display:grid;place-items:center;font-size:1.1em}
.tile .t{position:relative;flex:1}
.tile .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.18);width:0;transition:width 1s ease-out}
.tile .cnt{position:relative;font-size:.85em;font-weight:800;background:rgba(0,0,0,.22);border-radius:12px;padding:4px 14px}
.tile.dim{opacity:.28;transform:scale(.97)}
.tile.correct{outline:5px solid #fff;outline-offset:-5px}
.tile.correct b::after{content:'✓'}
.tile.correct b span{display:none}
.sumline{font-size:clamp(18px,1.8vw,28px);text-align:center}
.sumline b{color:var(--sun)}

.board{flex:1;display:flex;flex-direction:column;gap:14px;max-width:1100px;width:100%;margin:0 auto}
/* จอใหญ่ทุกหน้าพอดี 1 จอ: ปุ่มถัดไปอยู่ในจอเสมอ ไม่ต้องเลื่อน */
.stg.fitv{height:100dvh;min-height:0;overflow:hidden}
.stg.fitv .board,.stg.fitv .qwrap{min-height:0}
.lbwrap{flex:1 1 0;min-height:0}
.stg.fitv .qimgbig{min-height:0;flex:0 1 auto;max-height:30vh}
.stg.fitv .tile{min-height:clamp(52px,8vh,130px)}
.stg.fitv .podium{min-height:0;flex:1 1 0;overflow:hidden;padding-top:6px}
.stg.fitv .pod{gap:6px}
.stg.fitv .pod .av.xl{width:clamp(48px,min(9vw,11vh),130px);height:clamp(48px,min(9vw,11vh),130px)}
.stg.fitv .pod .nm{font-size:clamp(16px,min(2.2vw,3.6vh),34px)}
.stg.fitv .pod .block{font-size:clamp(24px,min(5vw,6vh),90px)}
.stg.fitv .rest{flex:0 1 auto;max-height:20vh;overflow-y:auto;min-height:0}
.stg.fitv .board h1{font-size:clamp(24px,min(3.4vw,5.5vh),52px)}
.stg.fitv .board .sumline{margin:0}
.stg.fitv .pod.p1 .block{height:clamp(70px,17vh,320px)} .stg.fitv .pod.p2 .block{height:clamp(54px,12vh,240px)} .stg.fitv .pod.p3 .block{height:clamp(40px,8vh,180px)}
.board h1{margin:0;font-size:clamp(28px,3.4vw,52px);text-align:center}
.lb{position:relative;--row:clamp(48px,6.6vh,72px)}
.lbrow{position:absolute;left:0;right:0;height:calc(var(--row) - 8px);display:flex;align-items:center;gap:14px;
  transition:transform .9s cubic-bezier(.5,0,.2,1), opacity .6s}
.lbrow .rk{width:clamp(36px,3.4vw,52px);text-align:right;font-size:min(clamp(20px,2.2vw,32px),calc(var(--row) * .5));font-weight:800;opacity:.85;flex:none}
.lbrow .bar{position:relative;flex:1;height:100%;border-radius:14px;background:rgba(255,255,255,.08);overflow:hidden}
.lbrow .bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--navy3),#2f6e95);border-radius:14px;
  transition:width .9s cubic-bezier(.5,0,.2,1)}
.lbrow.top1 .bar i{background:linear-gradient(90deg,#c48a00,var(--sun))}
.lbrow.top2 .bar i{background:linear-gradient(90deg,#7c8b97,#c8d3dc)}
.lbrow.top3 .bar i{background:linear-gradient(90deg,#8a4b1f,#d3884b)}
.lbrow .nm{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:min(clamp(18px,2vw,30px),calc(var(--row) * .45));font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.lbrow .sc{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:min(clamp(18px,2vw,30px),calc(var(--row) * .45));font-weight:800}
.lbrow .plus{font-size:.6em;font-weight:700;color:var(--sun);margin-right:10px;opacity:0;transition:opacity .4s .6s}
.lbrow.go .plus{opacity:1}

.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,2vw,28px);flex:1;padding-top:10px}
.pod{display:flex;flex-direction:column;align-items:center;gap:10px;width:clamp(120px,18vw,260px);
  animation:rise .9s cubic-bezier(.3,1.3,.5,1) both}
.pod .nm{font-size:clamp(18px,2.2vw,34px);font-weight:700;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .sc{opacity:.85;font-size:clamp(14px,1.5vw,22px)}
.pod .block{width:100%;border-radius:16px 16px 0 0;display:grid;place-items:center;font-size:clamp(40px,6vw,90px);font-weight:800}
.pod.p1 .block{height:clamp(160px,30vh,320px);background:linear-gradient(var(--sun),#d39b0c);color:var(--navy)}
.pod.p2 .block{height:clamp(120px,22vh,240px);background:linear-gradient(#dbe3ea,#98a7b3);color:var(--navy)}
.pod.p3 .block{height:clamp(90px,16vh,180px);background:linear-gradient(#e2a06b,#9b5728)}
.pod.p2{animation-delay:.4s} .pod.p3{animation-delay:.2s} .pod.p1{animation-delay:.9s}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.rest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.rest span{background:rgba(255,255,255,.1);border-radius:99px;padding:5px 14px;font-size:15px}

@media (max-width:760px){
  .lobby{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr}
}

/* ---------- v14 ธีมขาว-ฟ้า-น้ำเงิน (หน้าผู้จัด / แบบทดสอบ / จอง / ลงทะเบียน) · หน้าเกมคงกรมท่า-เหลือง ---------- */
body.admin, body.test{--paper:#f4f7fb; --line:#dbe4f0; --navy:#1e3a8a; --navy2:#1d4ed8; --navy3:#2563eb;
  --sun:#2563eb; --sun2:#93c5fd; --blue:#2563eb; --blue-soft:#eff6ff; --blue-line:#bfdbfe}
body.admin{background:var(--paper)}
body.test{background:#eef3fa}
body.admin .brand span, body.test .brand span{color:#93c5fd}

<body>
<div id="app"><div class="center-msg"><div class="spinner"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const CFG = window.QUIZ_CONFIG || {};
const APP = CFG.APP_NAME || 'Quiz Live PLPN';
const LETTERS = ['ก', 'ข', 'ค', 'ง'];
const isText = q => !!q && q.kind === 'text';
// ตัดคำนำหน้าชื่อ (นาย/นาง/นางสาว/น.ส.) และช่องว่างซ้ำ — ชื่อในรายงานจะได้รูปแบบเดียวกัน
const noPrefix = n => String(n || '').trim().replace(/^(นางสาว|นาง|นาย|น\.ส\.)\s*(?=[ก-ฮเแโใไ])/, '').replace(/\s+/g, ' ');   // ข้อเขียน (ไม่คิดคะแนน)
const TIMES = [10, 15, 20, 30, 45, 60, 90, 120];
const DEF_COLORS = ['#e44d57', '#2c7bd6', '#ec9a26', '#2a9d63'];
const PALETTES = [
  { name: 'มาตรฐาน', c: DEF_COLORS },
  { name: 'พาสเทล', c: ['#f4a3a8', '#9cc5ee', '#f7d08a', '#9fd8b8'] },
  { name: 'ฟ้า-เขียว', c: ['#0e7490', '#0891b2', '#14b8a6', '#65a30d'] },
  { name: 'สดใส', c: ['#d946ef', '#f43f5e', '#f97316', '#eab308'] },
  { name: 'เข้ม', c: ['#7f1d1d', '#1e3a8a', '#78350f', '#14532d'] },
  { name: 'ธรรมชาติ', c: ['#b45309', '#4d7c0f', '#0f766e', '#9a3412'] }
];
const HEX = /^#[0-9a-f]{6}$/i;
const colorAt = (colors, i) => (colors && HEX.test(colors[i] || '')) ? colors[i] : DEF_COLORS[i];
const inkFor = hex => { const n = parseInt(hex.slice(1), 16);
  return (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) > 170 ? '#18222d' : '#fff'; };
const chipStyle = (colors, i) => { const c = colorAt(colors, i); return `background:${c};color:${inkFor(c)}`; };
const imgAt = (images, i) => (images && typeof images[i] === 'string' && images[i]) || '';
const hasImgs = images => !!(images && images.some(Boolean));
const choiceBody = (text, img) =>
  `<span class="cbody">${img ? `<img class="cimg" src="${esc(img)}" alt="">` : ''}${text ? `<span>${esc(text)}</span>` : ''}</span>`;
const chosenHTML = (s, i) => `<div class="chosen" style="${chipStyle(s.colors, i)}">
  <div class="cb"><b>${LETTERS[i]}</b>${s.choices[i] ? `<span>${esc(s.choices[i])}</span>` : ''}</div>
  ${imgAt(s.images, i) ? `<img class="cimg" src="${esc(imgAt(s.images, i))}" alt="">` : ''}</div>`;
const app = document.getElementById('app');
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Number(n || 0).toLocaleString('th-TH');
// โลโก้ระบบ: '' = ตั้งต้น (2 รพ.) · 'none' = ไม่แสดง · ลิงก์ = ผู้ดูแลอัปโหลดเอง (⚙ ผู้ดูแลระบบ › โลโก้ระบบ)
let BRAND_LOGO = (() => { try { return localStorage.getItem('quizlive.logo') || ''; } catch (e) { return ''; } })();
const logoSrc = () => BRAND_LOGO === 'none' ? '' : BRAND_LOGO || 'logo-hospitals.png';
const logoAbs = () => logoSrc() ? new URL(logoSrc(), location.href).href : '';
const logoHTML = () => logoSrc() ? `<span class="hlogo"><img src="${esc(logoSrc())}" alt="โลโก้โรงพยาบาล" height="29"></span>` : '';
function setBrandLogo(v) {
  BRAND_LOGO = v || ''; try { localStorage.setItem('quizlive.logo', BRAND_LOGO); } catch (e) {}
  document.querySelectorAll('.hlogo').forEach(el => { if (el.closest('#lgprev')) return; if (!logoSrc()) el.remove(); else el.querySelector('img').src = logoSrc(); });
  const tb = document.querySelector('.topbar .brand');
  if (logoSrc() && tb && !document.querySelector('.topbar .hlogo')) tb.insertAdjacentHTML('afterend', logoHTML());
}
const brandHTML = () => { const p = APP.split(' '); return p.length > 1 ? `${esc(p[0])} <span>${esc(p[1])}</span>${p.length > 2 ? ' <b class="pl">' + esc(p.slice(2).join(' ')) + '</b>' : ''}` : esc(APP); };
const avatarHTML = (id, name, cls = '') => {
  const a = window.AVATARS && id ? window.AVATARS.byId(id) : null;
  return a ? `<span class="av ${cls}" role="img" aria-label="${esc(a.name)}">${a.svg}</span>`
           : `<span class="av ${cls}">${esc([...(name || '?')][0])}</span>`;
};
let sb = null;

function toast(msg, isErr) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = isErr ? 'err' : ''; }, 3200);
}
const errMsg = e => (e && (e.message || e.error_description)) || 'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง';
function save(k, v) { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
async function rpc(name, args) { const { data, error } = await sb.rpc(name, args || {}); if (error) throw error; return data; }
function setBody(cls) { document.body.className = cls; }

// ---- ล้างสิ่งที่หน้าเดิมเปิดไว้ (timer / realtime) เมื่อเปลี่ยนหน้า ----
let cleanups = [];
const onLeave = fn => cleanups.push(fn);
function resetView() { cleanups.forEach(f => { try { f(); } catch (e) {} }); cleanups = []; }

function route() {
  resetView();
  const [page, arg] = location.hash.replace(/^#\/?/, '').split('/');
  if (page === 'admin') return Admin.list();
  if (page === 'edit') return Admin.edit(arg);
  if (page === 'play') return Admin.playPage(arg);
  if (page === 'host') return Host.open(arg);
  if (page === 'training') return Training.open(arg);
  if (page === 'course') return Course.open(arg);
  if (page === 'report') return Report.open(arg);
  if (page === 'newtraining') return NewTraining.open(arg);
  if (page === 'survey') return SurveyAdmin.open(arg);
  return Player.start();
}

// =====================================================================
// การเข้าสู่ระบบ (ผู้จัดเท่านั้น)
// =====================================================================
async function requireStaff() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { renderLogin(); return null; }
  const email = (session.user.email || '').toLowerCase();
  const dom = (CFG.ALLOWED_DOMAIN || '').toLowerCase();
  if (dom && !email.endsWith('@' + dom)) { renderWrongAccount(email); return null; }
  return session.user;
}
function loginShell(inner) {
  setBody('admin');
  return `<main class="lgin"><section class="lgban"><div class="lgtop"><span class="brand">${brandHTML()}</span>${logoHTML()}</div>
      <p class="lgtag">ระบบงานอบรม · จอง · ลงชื่อ · แบบทดสอบ · เกม<br><small>สำหรับผู้จัด: สร้างงานอบรม ชุดคำถาม และเปิดห้องเกม</small></p></section>
    <div class="lgcard">${inner}</div>
    <a class="lgback" href="./">← กลับหน้าเข้าร่วมเกม</a></main>`;
}
function renderLogin() {
  app.innerHTML = loginShell(`<button class="btn sun lg" id="gbtn">เข้าสู่ระบบด้วย Google</button>
      <p class="hint" style="text-align:center;margin:0">ใช้อีเมล @${esc(CFG.ALLOWED_DOMAIN || '')} เท่านั้น</p>`);
  $('#gbtn').onclick = login;
}
function renderWrongAccount(email) {

async function login() {
  try { sessionStorage.setItem('quizlive.returnTo', location.hash || '#admin'); } catch (e) {}

    provider: 'google',
    options: { redirectTo: location.origin + location.pathname,
               queryParams: { hd: CFG.ALLOWED_DOMAIN || '', prompt: 'select_account' } }
  });
  if (error) toast(errMsg(error), true);
}
function adminShell(user, inner) {

// =====================================================================
// ผู้เล่น (มือถือ ไม่ต้องล็อกอิน)
// =====================================================================
const Player = {
  KEY: 'quizlive.player',
  start() {
    setBody('player');
    const tcode = (new URLSearchParams(location.search).get('t') || '').replace(/\D/g, '').slice(0, 6);
    if (tcode) return Test.start(tcode);
    const ccode = (new URLSearchParams(location.search).get('c') || '').replace(/\D/g, '').slice(0, 6);
    if (ccode) return Entry.start(ccode);
    const late = (new URLSearchParams(location.search).get('late') || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 20);
    if (late) return Entry.start('', late);
    const scode = (new URLSearchParams(location.search).get('s') || '').replace(/\D/g, '').slice(0, 6);
    if (scode) return OpenSurvey.start(scode);
    const pin = (new URLSearchParams(location.search).get('pin') || '').replace(/\D/g, '').slice(0, 6);
    const saved = load(this.KEY);
    if (saved && saved.player_id && (!pin || pin === saved.pin)) return this.enter(saved);
    if (saved && pin && pin !== saved.pin) save(this.KEY);
    this.joinForm(pin);
  },
  joinForm(pin) {
    setBody('player');
    app.innerHTML = `<main class="join">
      <div class="brand">${brandHTML()}</div>
      <p class="tag">เกมตอบคำถาม เล่นพร้อมกันทั้งห้อง</p>
      <form class="jcard" id="jf" autocomplete="off">
        <label for="pin">รหัสห้อง (PIN)</label>
        <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" value="${esc(pin || '')}">
        <div id="nickbox" style="display:grid;gap:12px"><label for="nick">ชื่อที่จะแสดงบนจอ</label>

        <div class="prebox" id="prebox" hidden></div>
        <label>เลือกรูปประจำตัว</label>
        <div class="avtabs"><button type="button" data-g="สัตว์น่ารัก">🐾 สัตว์น่ารัก</button><button type="button" data-g="บุคลากร รพ.">🏥 บุคลากร รพ.</button></div>
        <div class="avgrid" id="avgrid"></div>
        <button class="btn sun" id="jbtn">เข้าร่วมเกม</button>
      </form>
      <a class="host-link" href="#admin">สำหรับผู้จัด: สร้างและเปิดเกม →</a></main>`;
    const pinEl = $('#pin'), nickEl = $('#nick');
    try { nickEl.value = localStorage.getItem('quizlive.nick') || ''; } catch (e) {}
    (pin ? nickEl : pinEl).focus();
    // รูปประจำตัว: ใช้รูปเดิมที่เคยเลือก หรือสุ่มให้ 1 รูป
    const AVL = (window.AVATARS && window.AVATARS.list) || [];
    let avatar = null; try { avatar = localStorage.getItem('quizlive.avatar'); } catch (e) {}
    if (!AVL.some(a => a.id === avatar)) avatar = AVL.length ? AVL[Math.floor(Math.random() * AVL.length)].id : null;
    let group = (AVL.find(a => a.id === avatar) || {}).group || 'สัตว์น่ารัก';
    const drawAv = () => {
      $('#avprev').innerHTML = avatarHTML(avatar, nickEl.value);
      $$('.avtabs button').forEach(b => b.classList.toggle('on', b.dataset.g === group));
      $('#avgrid').innerHTML = AVL.filter(a => a.group === group).map(a =>
        `<button type="button" data-av="${a.id}" class="${a.id === avatar ? 'on' : ''}" title="${esc(a.name)}">${avatarHTML(a.id)}</button>`).join('');
    };
    $$('.avtabs button').forEach(b => b.onclick = () => { group = b.dataset.g; drawAv(); });
    $('#avgrid').onclick = e => { const b = e.target.closest('[data-av]'); if (b) { avatar = b.dataset.av; drawAv(); } };
    if (!AVL.length) $$('.avtabs, #avgrid').forEach(el => el.hidden = true);
    drawAv();
    // ห้อง Pre-test: เปลี่ยนช่องชื่อเป็น รหัสพนักงาน + ชื่อ + รพ. + แผนก
    let info = null, infoPin = '';
    const checkPin = async () => {
      const p = pinEl.value.trim();
      if (p.length !== 6) { info = null; infoPin = ''; return showMode(); }

      infoPin = p;
      try { const r = await rpc('game_info', { p_pin: p }); if (pinEl.value.trim() === p) info = r; }
      catch (e) { if (pinEl.value.trim() === p) info = null; }
      showMode();
    };
    const showMode = () => {

      $('#nickbox').hidden = pre; box.hidden = !pre;
      $('#jbtn').textContent = pre ? 'เข้าร่วม Pre-test' : 'เข้าร่วมเกม';
      if (!pre) { box.innerHTML = ''; return; }
      if (box.dataset.pin === infoPin) return;
      box.dataset.pin = infoPin;
      const me = load('quizlive.tester') || {}, depts = info.departments || [], hosps = info.hospitals || [];
      box.innerHTML = `<div class="prenote">📝 <b>${esc(info.title)}</b><br>เกมนี้เป็น <b>Pre-test</b> ผลบันทึกด้วยรหัสพนักงาน · ระหว่างเกมไม่เฉลยข้อที่ถูก</div>
        <div class="fld"><label for="j-emp">รหัสพนักงาน *</label><input class="inp" id="j-emp" maxlength="30" value="${esc(me.emp_id || '')}" autocapitalize="characters"></div>
        <div class="fld"><label for="j-name">ชื่อ-นามสกุล * <small class="hint">(ไม่ต้องใส่คำนำหน้า)</small></label><input class="inp" id="j-name" maxlength="120" placeholder="เช่น สมชาย ใจดี" value="${esc(me.name || '')}"></div>
        ${hosps.length ? `<div class="fld"><label>โรงพยาบาล *</label><div class="seg">${hosps.map(h =>
          `<label><input type="radio" name="jhosp" value="${esc(h)}" ${h === me.hospital || hosps.length === 1 ? 'checked' : ''}>${esc(h)}</label>`).join('')}</div></div>` : ''}
        <div class="fld"><label for="j-dept">แผนก *</label>${depts.length
          ? `<select class="inp" id="j-dept"><option value="">— เลือกแผนก —</option>${depts.map(d => `<option ${d === me.dept ? 'selected' : ''}>${esc(d)}</option>`).join('')}
               <option value="__other" ${me.dept && !depts.includes(me.dept) ? 'selected' : ''}>อื่นๆ (พิมพ์เอง)</option></select>
             <input class="inp" id="j-dept-other" maxlength="120" placeholder="พิมพ์ชื่อแผนก" value="${esc(me.dept && !depts.includes(me.dept) ? me.dept : '')}">`
          : `<input class="inp" id="j-dept" maxlength="120" value="${esc(me.dept || '')}">`}</div>`;
      const sel = $('#j-dept'), other = $('#j-dept-other');
      if (other) { const sync = () => { other.hidden = sel.value !== '__other'; }; sel.onchange = () => { sync(); if (!other.hidden) other.focus(); }; sync(); }
    };
    pinEl.oninput = () => { pinEl.value = pinEl.value.replace(/\D/g, '').slice(0, 6); checkPin(); };
    if (pin) checkPin();
    $('#jf').onsubmit = async ev => {
      ev.preventDefault();
      const p = pinEl.value.trim();
      if (p.length !== 6) return toast('รหัสห้องต้องเป็นตัวเลข 6 หลัก', true);
      const btn = $('#jbtn'), label = btn.textContent;
      if (infoPin !== p) await checkPin();
      const pre = !!(info && info.mode === 'pre');
      let who = null;
      if (pre) {
        const sel = $('#j-dept'), other = $('#j-dept-other'), h = $('input[name=jhosp]:checked');
        who = { emp_id: $('#j-emp').value.trim().toUpperCase(), name: noPrefix($('#j-name').value),
                dept: sel.value === '__other' ? other.value.trim() : sel.value.trim(), hospital: h ? h.value : '' };
        if (!who.emp_id || !who.name || !who.dept || ((info.hospitals || []).length && !who.hospital)) return toast('กรุณากรอกข้อมูลให้ครบทุกช่องที่มี *', true);
      } else if (!nickEl.value.trim()) return toast('กรุณาใส่ชื่อ', true);
      btn.disabled = true; btn.textContent = 'กำลังเข้าห้อง…';
      try {
        let r;
        if (pre) {
          r = await rpc('join_pre_game', { p_pin: p, p_emp_id: who.emp_id, p_name: who.name, p_hospital: who.hospital, p_dept: who.dept, p_avatar: avatar });
          save('quizlive.tester', { ...(load('quizlive.tester') || {}), ...who });
        } else {
          const n = nickEl.value.trim();
          r = await rpc('join_game', { p_pin: p, p_nickname: n, p_avatar: avatar });
          try { localStorage.setItem('quizlive.nick', n); } catch (e) {}
        }
        try { if (avatar) localStorage.setItem('quizlive.avatar', avatar); } catch (e) {}
        const st = { ...r, pin: p }; save(this.KEY, st); this.enter(st);
      } catch (e) {
        toast(errMsg(e), true); btn.disabled = false; btn.textContent = label;
        if (/Pre-test ต้องเข้าด้วยรหัสพนักงาน/.test(errMsg(e))) { infoPin = ''; checkPin(); }
      }
    };
  },
  enter(st) {
    resetView();
    this.st = st; this.key = ''; this.busy = false; this.s = null;
    app.innerHTML = `<div class="center-msg"><div class="spinner"></div></div>`;
    const ch = sb.channel('game-' + st.session_id)
      .on('broadcast', { event: 'state' }, () => setTimeout(() => this.refresh(), Math.random() * 500))
      .subscribe();
    const poll = setInterval(() => this.refresh(), 4000);
    const tick = setInterval(() => this.tick(), 200);
    const vis = () => { if (!document.hidden) this.refresh(); };
    document.addEventListener('visibilitychange', vis);
    onLeave(() => { clearInterval(poll); clearInterval(tick); sb.removeChannel(ch); document.removeEventListener('visibilitychange', vis); });
    this.refresh();
  },
  async refresh() {
    if (this.busy || !this.st) return;
    this.busy = true;
    try { this.render(await rpc('player_state', { p_player: this.st.player_id, p_token: this.st.token })); }
    catch (e) { /* เน็ตสะดุด รอรอบถัดไป */ }
    finally { this.busy = false; }
  },
  leave() { save(this.KEY); resetView(); this.joinForm(''); },
  render(s) {
    this.s = s;
    if (s.status === 'question') this.deadline = Date.now() + Number(s.remaining) * 1000;
    const key = [s.status, s.index, s.answered ? 1 : 0].join('|');
    if (key === this.key) return;
    this.key = key;
    setBody('player');
    const bar = `<div class="pbar"><span>${s.index >= 0 ? `ข้อ ${s.index + 1}/${s.total}` : esc(s.title || '')}</span>
      <span class="me">${avatarHTML(s.avatar, s.nickname, 'sm')}${esc(s.nickname || '')}</span></div>`;

    if (s.status === 'kicked') {
      save(this.KEY);
      app.innerHTML = `<main class="pscreen"><div class="pmid"><h1>ออกจากห้องแล้ว</h1>
        <p>ผู้จัดนำชื่อนี้ออกจากห้อง หรือห้องถูกลบ</p>
        <button class="btn sun lg" id="again">เข้าร่วมใหม่</button></div></main>`;
      $('#again').onclick = () => this.leave();
      resetView();
      return;
    }
    if (s.status === 'lobby') {
      app.innerHTML = `<main class="pscreen">${bar}<div class="pmid">
        ${s.cover_url ? `<img class="pcover" src="${esc(s.cover_url)}" alt="">` : ''}
        <p>เข้าห้องเรียบร้อย ✓</p>${avatarHTML(s.avatar, s.nickname, 'lg')}<div class="namechip">${esc(s.nickname)}</div>
        <h1 style="font-size:24px">${esc(s.title)}</h1>
        ${s.mode === 'pre' ? '<p class="roomline">📝 Pre-test แบบเกม · ระหว่างเกมไม่เฉลยข้อที่ถูก</p>' : ''}
        <div class="dots"><span></span><span></span><span></span></div>
        <p>ดูชื่อตัวเองบนจอ แล้วรอผู้จัดเริ่มเกม</p></div>
        <button class="linkbtn" id="quit">ออกจากห้อง</button></main>`;
      $('#quit').onclick = () => { if (confirm('ออกจากห้องนี้?')) this.leave(); };
      return;
    }
    if (s.status === 'question' && !s.answered) {
      const img = s.image_url ? `<img class="pimg" src="${esc(s.image_url)}" alt="">` : '';
      app.innerHTML = `<main class="pscreen">${bar}<div class="tbar"><i id="tfill"></i></div>
        <h2 class="pq">${esc(s.question)}</h2>${img}
        <div class="pchoices ${hasImgs(s.images) ? 'imgs' : ''}">${s.choices.map((c, i) =>
          `<button class="pc" style="${chipStyle(s.colors, i)}" data-i="${i}"><b>${LETTERS[i]}</b>${choiceBody(c, imgAt(s.images, i))}</button>`).join('')}</div>
        <p class="hint" id="tleft" style="color:inherit;opacity:.8;text-align:center"></p></main>`;
      $$('.pc').forEach(b => b.onclick = () => this.answer(+b.dataset.i));
      this.tick();
      return;
    }
    if (s.status === 'question' && s.answered) {
      const i = s.my_choice;
      app.innerHTML = `<main class="pscreen">${bar}<div class="pmid">
        <p>ส่งคำตอบแล้ว</p>${chosenHTML(s, i)}
        <div class="dots"><span></span><span></span><span></span></div><p>รอดูเฉลยบนจอ</p></div></main>`;
      return;
    }
    if (s.status === 'reveal') {
      const ok = s.is_correct;
      setBody('player ' + (ok ? 'good' : 'bad'));
      const pre = s.mode === 'pre';   // Pre-test: ไม่บอกข้อที่ถูก บอกแค่จำนวนคนตอบถูก
      const head = ok ? `<h1>ถูกต้อง! 🎉</h1><div class="bignum">+${fmt(s.points)}</div>`
                      : `<h1>${s.answered ? 'ยังไม่ถูก' : 'ไม่ทันตอบ'}</h1>${pre ? '' : `<p>คำตอบที่ถูกคือ</p>${chosenHTML(s, s.correct)}`}`;
      const room = pre ? `<p class="roomline">ทั้งห้องตอบถูก <b>${s.room_right}</b> จาก ${s.players} คน<br><small>เฉลยหลังอบรม</small></p>` : '';
      app.innerHTML = `<main class="pscreen">${bar}<div class="pmid">${avatarHTML(s.avatar, s.nickname, 'lg')}${head}${room}
        <div class="stat"><div><small>คะแนนรวม</small><strong>${fmt(s.score)}</strong></div>
        <div><small>อันดับ</small><strong>${s.rank}</strong> / ${s.players}</div></div>
        <p>รอข้อถัดไป…</p></div></main>`;
      return;
    }
    if (s.status === 'ended') {
      const medal = ['🥇', '🥈', '🥉'][s.rank - 1] || '🎯';
      app.innerHTML = `<main class="pscreen">${bar}<div class="pmid">
        <p>จบเกมแล้ว</p><div class="avwrap">${avatarHTML(s.avatar, s.nickname, 'xl')}<span class="medal">${medal}</span></div>
        <h1>อันดับ ${s.rank} จาก ${s.players} คน</h1>
        <div class="stat"><div><small>คะแนนรวม</small><strong>${fmt(s.score)}</strong></div>
          ${s.mode === 'pre' && s.my_right != null ? `<div><small>ตอบถูก</small><strong>${s.my_right}</strong> / ${s.total}</div>` : ''}</div>
        ${s.mode !== 'pre' ? '<p>ขอบคุณที่ร่วมสนุกครับ</p>' : s.my_answered
          ? '<p>✓ บันทึกผล Pre-test แล้ว<br><small>หลังอบรมสแกน QR ทำ Post-test ด้วยรหัสพนักงานเดิม</small></p>'
          : '<p>ท่านยังไม่ได้ตอบข้อใดเลย จึงยังไม่มีผล Pre-test<br><small>แจ้งผู้จัดเพื่อทำ Pre-test แบบทำเอง</small></p>'}
        <button class="btn sun lg" id="again">เข้าเกมใหม่</button></div></main>`;
      $('#again').onclick = () => this.leave();
    }
  },
  tick() {
    const s = this.s; if (!s || s.status !== 'question' || s.answered) return;
    const left = Math.max(0, (this.deadline - Date.now()) / 1000);
    const f = $('#tfill'); if (f) f.style.width = (100 * left / s.time) + '%';
    const t = $('#tleft');
    if (left <= 0) {
      $$('.pc').forEach(b => { b.disabled = true; b.classList.add('dim'); });
      if (t) t.textContent = 'หมดเวลา รอดูเฉลย';
    } else if (t) t.textContent = `เหลือ ${Math.ceil(left)} วินาที`;
  },
  async answer(i) {
    $$('.pc').forEach(b => { b.disabled = true; if (+b.dataset.i !== i) b.classList.add('dim'); });
    try {
      await rpc('submit_answer', { p_player: this.st.player_id, p_token: this.st.token, p_choice: i });
      this.render({ ...this.s, answered: true, my_choice: i });
    } catch (e) { toast(errMsg(e), true); this.key = ''; this.refresh(); }
  }
};

// =====================================================================
// ผู้จัด: รายการชุดคำถาม + ตัวแก้ไข
// =====================================================================
// ✏ ผู้ร่วมแก้ไขชุดคำถาม — ใช้ทั้งในหน้าแก้ไขและหน้าต่างจากการ์ด
function mountEditors(root, q, canOwn, onChange) {
  const draw = () => {
    const list = q.editors || [];
    root.innerHTML = `<h3>✏ ผู้ร่วมแก้ไข <span class="hint" style="font-weight:400">(${list.length ? list.length + ' คน' : 'ยังไม่มี'})</span></h3>
      <p class="hint" style="margin:0">ผู้ร่วมแก้ไขเห็นชุดนี้ในแท็บ “ของฉัน” · แก้ไขคำถาม เปิดเกม และสร้างรอบ Pre/Post ได้ แม้ชุดเป็นแบบส่วนตัว (คนอื่นไม่เห็นเฉลย)
        <br>ลบชุด เปลี่ยนการแชร์ และแก้รายชื่อผู้ร่วมแก้ไขไม่ได้</p>
      <div style="display:grid;gap:6px">${list.map(e => `<div class="it" style="border-color:var(--line);background:#fff"><span class="grow">${esc(e)}</span>
        ${canOwn ? `<button class="btn danger sm" type="button" data-edrm="${esc(e)}">นำออก</button>` : ''}</div>`).join('')}</div>
      ${canOwn ? (q.id ? `<div class="row" style="gap:8px"><input class="inp grow" data-edin placeholder="อีเมล หรือชื่อหน้า @ (เช่น somchai.j)" style="min-width:0">
          <button class="btn sm" type="button" data-edadd>+ เพิ่มผู้ร่วมแก้ไข</button></div>` : '<p class="hint" style="margin:0">บันทึกชุดคำถามก่อน จึงเพิ่มผู้ร่วมแก้ไขได้</p>')
        : `<p class="hint" style="margin:0">เจ้าของชุด: ${esc(q.owner_email || '')}</p>`}`;
    $$('[data-edrm]', root).forEach(b => b.onclick = () => { if (confirm(`นำ ${b.dataset.edrm} ออกจากผู้ร่วมแก้ไข?`)) put(list.filter(x => x !== b.dataset.edrm)); });
    const inp = $('[data-edin]', root), add = $('[data-edadd]', root);
    if (!add) return;
    const go = async () => {
      let e = inp.value.trim().toLowerCase(); if (!e) return inp.focus();
      if (!e.includes('@')) e += '@' + (CFG.ALLOWED_DOMAIN || '').toLowerCase();
      if (e === (q.owner_email || '').toLowerCase()) return toast('อีเมลนี้เป็นเจ้าของชุดอยู่แล้ว', true);
      if (list.includes(e)) return toast('มีในรายชื่อแล้ว', true);
      if (await put([...list, e])) $('[data-edin]', root).focus();
    };
    add.onclick = go;
    inp.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); go(); } };
  };
  const put = async emails => {

function editorsDialog(q, canOwn, onChange) {
  const el = document.createElement('div'); el.className = 'mdl';
  el.innerHTML = `<div class="box"><div class="row"><b class="grow">${esc(q.title)}</b><button class="btn light sm" data-x>ปิด ✕</button></div>
    <div class="edpanel" data-ed></div></div>`;
  const close = () => { el.remove(); document.removeEventListener('keydown', key); if (onChange) onChange(); };
  const key = e => { if (e.key === 'Escape') close(); };
  el.onclick = e => { if (e.target === el || e.target.closest('[data-x]')) close(); };
  document.addEventListener('keydown', key);
  document.body.appendChild(el);
  mountEditors($('[data-ed]', el), q, canOwn);
  const i = $('[data-edin]', el); if (i) i.focus();
  onLeave(() => el.remove());
}

  // ลิงก์ตรงสำหรับเริ่มเกม (เช่น ใส่ในสไลด์): #play/<รหัสชุดคำถาม> → หน้ายืนยัน → จอใหญ่
  async playPage(id) {
    setBody('admin');
    const user = await requireStaff(); if (!user) return;
    app.innerHTML = adminShell(user, `<div class="center-msg" style="min-height:40vh"><div class="spinner"></div></div>`); bindShell();
    const { data: q } = await sb.from('quizzes').select('id,title,department,cover_url').eq('id', id).single();
    if (!q) { toast('ไม่พบชุดคำถาม หรือไม่มีสิทธิ์', true); location.hash = '#admin'; return; }
    const g = await sb.from('sessions').select('id,pin,training_id').eq('quiz_id', id).neq('status', 'ended').order('created_at', { ascending: false }).limit(5);
    const open = (g.data || []).find(x => !x.training_id);
    app.innerHTML = adminShell(user, `<div class="tcard" style="max-width:560px;margin:24px auto;text-align:center">
      ${q.cover_url ? `<img src="${esc(q.cover_url)}" alt="" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px">` : ''}
      <h2 style="margin:0">${esc(q.title)}</h2>
      <p class="hint" style="margin:0">${q.department ? esc(q.department) + ' · ' : ''}เกมสด · จอใหญ่จะขึ้น QR และ PIN ให้ผู้เล่นสแกน</p>
      ${open ? `<a class="btn lg" href="#host/${open.id}">กลับไปที่ห้องเดิม (PIN ${esc(open.pin)})</a>` : ''}
      <button class="btn sun lg" id="go">▶ เริ่มเกม${open ? 'ใหม่' : ''}</button>
      <a class="btn light sm" href="#admin">ไปหน้าผู้จัด</a></div>`);
    bindShell();
    $('#go').onclick = e => this.play(id, e.currentTarget);
  },
  async play(quizId, btn, force) {
    if (btn) btn.disabled = true;
    // ชุดคำถามที่ใช้เป็นข้อสอบ Pre/Post: เตือนก่อน เพราะเกมปกติจะเฉลยทุกข้อและไม่บันทึกผล
    if (!force) {
      const { data: rounds } = await sb.from('trainings').select('id,title,round_no,created_at')
        .eq('quiz_id', quizId).order('created_at', { ascending: false }).limit(40);
      if (rounds && rounds.length) { if (btn) btn.disabled = false; return this.examWarn(quizId, rounds, btn); }
    }
    try { const r = await rpc('create_session', { p_quiz_id: quizId }); location.hash = '#host/' + r.session_id; }
    catch (e) { toast(errMsg(e), true); if (btn) btn.disabled = false; }
  },
  examWarn(quizId, rounds, btn) {
    const el = document.createElement('div'); el.className = 'mdl';
    const list = [...rounds].sort((a, b) => (a.round_no ?? 999) - (b.round_no ?? 999) || a.created_at.localeCompare(b.created_at));
    el.innerHTML = `<div class="box" style="color:var(--ink)">
      <h3 style="margin:0">⚠️ ชุดนี้ใช้เป็นข้อสอบ Pre/Post (${rounds.length} รอบ)</h3>
      <p style="margin:0">ถ้าเริ่มเป็น<b>เกมปกติ</b> ระบบจะ<b>เฉลยทุกข้อ</b>บนจอ และ<b>ไม่บันทึกผลเป็น Pre-test</b>
        ผู้เข้าอบรมจะเห็นคำตอบก่อนทำ Post-test</p>
      <b>ต้องการเกม Pre-test? เลือกรุ่น (ไม่เฉลย · บันทึกผล)</b>
      <div style="display:grid;gap:6px;max-height:42vh;overflow:auto">${list.map(t =>
        `<button class="btn sun" data-pg="${t.id}" style="justify-content:flex-start;text-align:left">🎮 ${esc(t.title)}</button>`).join('')}</div>
      <div class="row" style="justify-content:space-between;margin-top:6px">
        <button class="btn light sm" data-x>ยกเลิก</button>
        <button class="btn danger sm" data-normal>เล่นเป็นเกมปกติ (เฉลยทุกข้อ)</button></div></div>`;
    const close = () => el.remove();
    el.onclick = async e => {
      if (e.target === el || e.target.closest('[data-x]')) return close();
      const pg = e.target.closest('[data-pg]');
      if (pg) {
        $$('button', el).forEach(b => b.disabled = true);
        try { const r = await rpc('create_pre_game', { p_training: pg.dataset.pg }); close(); location.hash = '#host/' + r.session_id; }
        catch (err) { toast(errMsg(err), true); $$('button', el).forEach(b => b.disabled = false); }
        return;
      }
      if (e.target.closest('[data-normal]')) {
        if (!confirm('ยืนยันเล่นเป็นเกมปกติ?\nจะเฉลยคำตอบทุกข้อ และไม่บันทึกผลเป็น Pre-test')) return;
        close(); this.play(quizId, btn, true);
      }
    };
    document.body.appendChild(el);
    onLeave(close);
  },

  // ---------- ตัวแก้ไข ----------
  blankQ() {
    const last = this.qs && this.qs[this.qs.length - 1];   // ข้อใหม่ใช้ชุดสีเดียวกับข้อก่อนหน้า
    return { kind: 'choice', text: '', image_url: '', choices: ['', '', '', ''], images: ['', '', '', ''],
             colors: last ? [...last.colors] : [...DEF_COLORS], correct_index: 0, time_limit: last ? last.time_limit : 20 };
  },
  async edit(id) {
    setBody('admin');
    const user = await requireStaff(); if (!user) return;
    this.user = user;
    app.innerHTML = adminShell(user, `<div class="center-msg" style="min-height:40vh"><div class="spinner"></div></div>`);
    bindShell();
    let quiz = { id: null, title: '', department: '', description: '', shared: false }, qs = [];
    const adm = await sb.rpc('is_admin'); this.isAdmin = adm.data === true;
    if (id && id !== 'new') {
      const [a, b] = await Promise.all([
        sb.from('quizzes').select('*').eq('id', id).single(),
        sb.from('questions').select('*').eq('quiz_id', id).order('position')
      ]);
      if (a.error || !a.data) { toast('ไม่พบชุดคำถาม', true); location.hash = '#admin'; return; }
      const isEd = (a.data.editors || []).includes((user.email || '').toLowerCase());
      if (a.data.owner_id !== user.id && !this.isAdmin && !isEd) { toast('แก้ไขได้เฉพาะชุดคำถามของตัวเอง กด “คัดลอกมาแก้” แทน', true); location.hash = '#admin'; return; }
      quiz = a.data;
      qs = (b.data || []).map(q => ({ kind: q.kind === 'text' ? 'text' : 'choice', text: q.text, image_url: q.image_url || '', time_limit: q.time_limit,
        correct_index: q.correct_index ?? 0, choices: [0, 1, 2, 3].map(i => q.choices[i] || ''),
        colors: [0, 1, 2, 3].map(i => colorAt(q.colors, i)), images: [0, 1, 2, 3].map(i => imgAt(q.choice_images, i)) }));
    }
    this.qs = null;
    if (!qs.length) qs.push(this.blankQ());
    this.quiz = quiz; this.qs = qs; this.dirty = false;
    this.canOwn = !quiz.id || quiz.owner_id === user.id || this.isAdmin;   // ผู้ร่วมแก้ไขเปลี่ยนการแชร์/ผู้ร่วมแก้ไขไม่ได้
    const depts = [...new Set((await sb.from('quizzes').select('department')).data?.map(d => d.department).filter(Boolean) || [])];
    const guard = e => { if (this.dirty) { e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', guard);
    onLeave(() => window.removeEventListener('beforeunload', guard));

    app.innerHTML = adminShell(user, `
      <div class="row"><button class="btn light sm" id="back">← กลับ</button>
        <h2 class="sec grow">${quiz.id ? 'แก้ไขชุดคำถาม' : 'สร้างชุดคำถามใหม่'}</h2></div>
      ${quiz.id && quiz.owner_id !== user.id ? `<div class="notice">${this.canOwn ? '⚙ กำลังแก้ไขในฐานะผู้ดูแลระบบ' : '✏ คุณเป็นผู้ร่วมแก้ไขชุดนี้'} · เจ้าของ: <b>${esc(quiz.owner_email)}</b></div>` : ''}
      <div class="meta-grid">
        <div class="fld"><label for="f-title">ชื่อเกม *</label>
          <input class="inp" id="f-title" maxlength="200" value="${esc(quiz.title)}" placeholder="เช่น ทดสอบความรู้ Code Gray"></div>
        <div class="fld"><label for="f-dept">แผนก</label>
          <input class="inp" id="f-dept" list="dl-dept" maxlength="80" value="${esc(quiz.department)}" placeholder="เช่น IT, IC, HR">
          <datalist id="dl-dept">${depts.map(d => `<option value="${esc(d)}">`).join('')}</datalist></div>
        <div class="fld full"><label for="f-desc">คำอธิบาย (ไม่บังคับ)</label>
          <input class="inp" id="f-desc" maxlength="300" value="${esc(quiz.description)}"></div>
        <div class="fld full"><label>รูปหน้าปก (ไม่บังคับ · แนวนอนจะสวยที่สุด)</label><div class="coverfld" id="coverfld"></div></div>
        <div class="fld full"><label class="switch"><input type="checkbox" id="f-shared" ${quiz.shared ? 'checked' : ''} ${this.canOwn ? '' : 'disabled'}>
          แชร์ให้ทุกแผนกเห็นและนำไปเล่นได้</label>
          <p class="hint" id="sharehint"></p></div>
        <div class="fld full edpanel" id="edbox"></div>
      </div>
      <div id="qlist"></div>
      <button class="btn light" id="addq" style="margin-top:14px;width:100%">+ เพิ่มคำถาม</button>`) + `
      <div class="savebar"><div class="in"><span class="st grow" id="st"></span>
        <button class="btn light" id="save">บันทึก</button>
        <button class="btn sun" id="saveplay">บันทึกแล้วเริ่มเกม ▶</button></div></div>`;
    bindShell();
    $('#back').onclick = () => { if (!this.dirty || confirm('ยังไม่ได้บันทึก ออกจากหน้านี้?')) { this.dirty = false; location.hash = '#admin'; } };
    ['title', 'dept', 'desc'].forEach(f => $('#f-' + f).oninput = () => this.touch());
    const sh = () => { $('#sharehint').textContent = $('#f-shared').checked
      ? 'พนักงานทุกคนที่ล็อกอินจะเห็นชุดนี้ (รวมคำตอบ) และกดเริ่มเกมหรือคัดลอกไปแก้ได้'
      : 'ส่วนตัว: เห็นเฉพาะคุณ ผู้ร่วมแก้ไข และผู้ดูแลระบบ เหมาะกับแบบทดสอบที่ไม่อยากให้เห็นคำตอบก่อน'; };
    $('#f-shared').onchange = () => { sh(); this.touch(); }; sh();
    this.bindEditors();
    $('#addq').onclick = () => { this.qs.push(this.blankQ()); this.touch(); this.renderQs();
      const cards = $$('.qcard'); cards[cards.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
      $('textarea', cards[cards.length - 1]).focus(); };
    $('#save').onclick = () => this.saveQuiz(false);
    $('#saveplay').onclick = () => this.saveQuiz(true);
    const ql = $('#qlist');
    ql.addEventListener('input', e => this.onInput(e));
    ql.addEventListener('change', e => this.onInput(e));
    ql.addEventListener('click', e => this.onClick(e));
    this.renderCover(); this.renderQs(); this.status();
  },
  bindEditors() { mountEditors($('#edbox'), this.quiz, this.canOwn); },
  renderCover() {
    const box = $('#coverfld'), url = this.quiz.cover_url;
    box.innerHTML = url
      ? `<img src="${esc(url)}" alt=""><label class="upl">เปลี่ยนรูป<input type="file" accept="image/*" hidden></label>
         <button class="btn danger sm" id="rmcover">ลบรูปปก</button>`
      : `<label class="upl">🖼 ใส่รูปหน้าปก<input type="file" accept="image/*" hidden></label>`;
    const inp = $('input', box);
    inp.onchange = async () => {
      if (!inp.files[0]) return;
      const url2 = await this.upload(inp.files[0], inp, 1600);
      if (url2) { this.quiz.cover_url = url2; this.touch(); }
      this.renderCover();
    };
    const rm = $('#rmcover'); if (rm) rm.onclick = () => { this.quiz.cover_url = ''; this.touch(); this.renderCover(); };
  },
  touch() { this.dirty = true; this.status(); },
  status() { const s = $('#st'), w = this.qs.filter(isText).length;
    if (s) s.textContent = `${this.qs.length} ข้อ` + (w ? ` (ข้อเขียน ${w})` : '') + (this.dirty ? ' · ยังไม่ได้บันทึก' : ''); },
  renderQs() {

    $('#qlist').innerHTML = this.qs.map((q, qi) => `
      <section class="qcard ${isText(q) ? 'textq' : ''}" data-qi="${qi}">

          <label class="kindsw" title="ผู้ตอบพิมพ์คำตอบเอง เก็บไว้ในรายงาน ไม่นำมาคิดคะแนน"><input type="checkbox" data-f="kind" ${isText(q) ? 'checked' : ''}> ข้อเขียน <span class="wtag">ไม่คิดคะแนน</span></label>
          <select data-f="time_limit" aria-label="เวลา">${TIMES.map(t => `<option value="${t}" ${t === +q.time_limit ? 'selected' : ''}>${t} วินาที</option>`).join('')}</select>
          <span class="grow"></span>

          <button class="icon-btn" data-act="down" title="เลื่อนลง" ${qi === n - 1 ? 'disabled' : ''}>↓</button>
          <button class="icon-btn" data-act="del" title="ลบข้อนี้" style="color:var(--bad)">✕</button></div>
        <textarea class="inp" data-f="text" maxlength="500" rows="2" placeholder="พิมพ์คำถาม…">${esc(q.text)}</textarea>
        <div class="qimg">${q.image_url
          ? `<img src="${esc(q.image_url)}" alt=""><button class="btn danger sm" data-act="rmimg">ลบรูป</button>`
          : `<label class="upl">🖼 ใส่รูปประกอบ<input type="file" accept="image/*" data-act="img" hidden></label>`}</div>
        <div class="pal"><span>ชุดสี</span>${PALETTES.map((p, pi) =>

              <b style="${chipStyle(q.colors, i)}">${LETTERS[i]}</b></label>
            <div class="ocol">
              <input type="text" data-f="choice" data-ci="${i}" maxlength="150" value="${esc(q.choices[i])}"
                placeholder="${q.images[i] ? 'คำบรรยายใต้รูป (ไม่บังคับ)' : `ตัวเลือก ${LETTERS[i]}${i >= 2 ? ' (ไม่บังคับ)' : ''}`}">
