    const ro = !this.canEdit, n = this.items.length, TYPE = { section: 'หัวข้อส่วน', scale: 'คะแนน 1–5', text: 'เขียนตอบ' };
    let no = 0;
    $('#svitems').innerHTML = this.items.map((it, i) => `<div class="qcard svitem ${it.type}" data-i="${i}"><div class="qhead">
        <span class="${it.type === 'section' ? 'phase' : 'qnum'}">${it.type === 'section' ? TYPE.section : `${++no}. ${TYPE[it.type]}`}</span><span class="grow"></span>
        ${it.type === 'section' || ro ? '' : `<label class="hint" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-f="req" ${it.required ? 'checked' : ''}> บังคับตอบ</label>`}
        ${ro ? '' : `<button class="icon-btn" data-act="up" ${i === 0 ? 'disabled' : ''}>↑</button><button class="icon-btn" data-act="down" ${i === n - 1 ? 'disabled' : ''}>↓</button>
        <button class="icon-btn" data-act="del" style="color:var(--bad)">✕</button>`}</div>
        <input class="inp" data-f="text" maxlength="300" value="${esc(it.text)}" placeholder="${it.type === 'section' ? 'เช่น ส่วนที่ 1: การประเมินหลักสูตร' : 'พิมพ์ข้อคำถาม…'}" ${ro ? 'disabled' : ''}></div>`).join('')
      || '<div class="empty">ยังไม่มีข้อคำถาม กด “ใช้แม่แบบประเมินหลังอบรม” เพื่อเริ่มเร็ว</div>';
  },
  respFiltered() { const f = this.filter; return this.resp.filter(r => f === 'all' || (f === 'open' ? !r.training_id : r.training_id === f)); },
  renderRep() { $('#svrep').innerHTML = surveyReportHTML(this.sv.items || [], this.respFiltered()); },
  async save() {
    const title = $('#sv-title').value.trim(); if (!title) return toast('กรุณาใส่ชื่อแบบประเมิน', true);
    const items = this.items.map(i => ({ ...i, text: i.text.trim() }));
    const blank = items.findIndex(i => !i.text); if (blank >= 0) return toast(`ข้อที่ ${blank + 1} ยังไม่มีข้อความ`, true);
    if (!items.some(i => i.type !== 'section')) return toast('ต้องมีข้อคำถามอย่างน้อย 1 ข้อ', true);
    const patch = { title, description: $('#sv-desc').value.trim(), shared: $('#sv-shared').checked, items, updated_at: new Date().toISOString() };
    const { error } = await sb.from('surveys').update(patch).eq('id', this.id);
    if (error) return toast(errMsg(error), true);
    Object.assign(this.sv, patch); this.dirty = false; this.status(); this.renderRep(); toast('บันทึกแล้ว');
  },
  async excel() {
    try { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); }
    catch (e) { return toast('โหลดตัวสร้าง Excel ไม่สำเร็จ', true); }
    const X = window.XLSX, wb = X.utils.book_new();
    const add = (name, rows) => { const ws = X.utils.aoa_to_sheet(rows); ws['!cols'] = (rows[0] || []).map(() => ({ wch: 18 })); X.utils.book_append_sheet(wb, ws, name); };
    surveySheets(X, wb, this.sv.items || [], this.respFiltered(), add);
    X.writeFile(wb, `แบบประเมิน-${this.sv.title}-${new Date().toISOString().slice(0, 10)}.xlsx`.replace(/[\\/:*?"<>|]/g, '_'));
  }
};

function loadScript(src) {
  return new Promise((res, rej) => {
    if ([...document.scripts].some(s => s.src === src)) return res();
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
}

function countUp(el) {
  if (!el) return;
  const from = +el.dataset.from, to = +el.dataset.to, t0 = performance.now(), dur = 900;
  const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(Math.round(from + (to - from) * e)); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

// =====================================================================
// เริ่มต้น
// =====================================================================
(async function init() {
  if (!CFG.SUPABASE_URL || /x{6}/.test(CFG.SUPABASE_URL) || !window.supabase) {
    setBody('player');
    app.innerHTML = `<div class="center-msg"><div class="box"><div class="brand" style="font-size:40px">${brandHTML()}</div>
      <p>${window.supabase ? 'ยังไม่ได้ตั้งค่า — แก้ไฟล์ <b>config.js</b> ใส่ SUPABASE_URL และ SUPABASE_ANON_KEY'
                           : 'โหลดไลบรารีไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรช'}</p></div></div>`;
    return;
  }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY,
    { auth: { persistSession: true, detectSessionInUrl: true, flowType: 'pkce' } });
  const { data: { session } } = await sb.auth.getSession();
  let back = null; try { back = sessionStorage.getItem('quizlive.returnTo'); } catch (e) {}
  if (session && back) {
    try { sessionStorage.removeItem('quizlive.returnTo'); } catch (e) {}
    history.replaceState(null, '', location.pathname + back);
  }
  window.addEventListener('hashchange', route);
  route();
  sb.rpc('app_branding').then(({ data }) => { if (data && (data.logo_url || '') !== BRAND_LOGO) setBrandLogo(data.logo_url || ''); }, () => {});
})();

// ลิงก์ทดลอง (preview.*) — แสดงแถบเตือนว่าเป็นเวอร์ชันทดลอง ใช้ฐานข้อมูลจริง
if (/^preview\./.test(location.hostname)) {
  const b = document.createElement('div');
  b.textContent = 'เวอร์ชันทดลอง · ใช้ข้อมูลจริง';
  b.style.cssText = 'position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:100;background:#2563eb;color:#fff;font:600 12px/1.6 system-ui,sans-serif;padding:2px 12px;border-radius:8px 8px 0 0;pointer-events:none';
  document.body.appendChild(b);
}
