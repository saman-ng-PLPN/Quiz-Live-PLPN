            </div>
            ${q.images[i] ? '' : `<label class="obtn" title="ใช้รูปเป็นคำตอบ">🖼<input type="file" accept="image/*" data-act="cimg" data-ci="${i}" hidden></label>`}
            <label class="obtn swatch" title="เปลี่ยนสี" style="background:${colorAt(q.colors, i)}"><input type="color" data-f="color" data-ci="${i}" value="${colorAt(q.colors, i)}"></label>
          </div>`).join('')}</div>
        <p class="hint choicehint">แตะตัวอักษรสีเพื่อเลือกคำตอบที่ถูก · 🖼 ใช้รูปเป็นคำตอบ · วงกลมสีขวาสุดใช้เปลี่ยนสี</p>
        ${isText(q) ? '<p class="hint">✍ ข้อเขียน: ผู้ทำแบบทดสอบ Pre/Post พิมพ์คำตอบเอง · ดูคำตอบได้ในรายงานแท็บรายข้อและไฟล์ Excel · ไม่นับคะแนน · ไม่แสดงในเกม</p>' : ''}
      </section>`).join('');
  },
  onInput(e) {
    const el = e.target, card = el.closest('.qcard'); if (!card) return;
    const q = this.qs[+card.dataset.qi];
    if (el.dataset.act === 'img' || el.dataset.act === 'cimg') {
      if (e.type === 'change' && el.files[0]) this.upload(el.files[0], el).then(url => {
        if (url) { if (el.dataset.act === 'img') q.image_url = url; else q.images[+el.dataset.ci] = url; this.touch(); }
        this.renderQs();
      });
      return;
    }
    if (!el.dataset.f) return;
    const f = el.dataset.f;
    if (f === 'color') {
      const i = +el.dataset.ci, c = HEX.test(el.value) ? el.value : DEF_COLORS[i];
      q.colors[i] = c;
      const opt = $$('.opt', card)[i];
      $('.mark b', opt).style.cssText = chipStyle(q.colors, i);
      el.parentElement.style.background = c;
    }
    else if (f === 'kind') { q.kind = el.checked ? 'text' : 'choice'; this.touch(); this.renderQs(); return; }
    else if (f === 'text') q.text = el.value;
    else if (f === 'time_limit') q.time_limit = +el.value;
    else if (f === 'choice') q.choices[+el.dataset.ci] = el.value;
    else if (f === 'correct') {
      q.correct_index = +el.value;
      $$('.opt', card).forEach((o, i) => o.classList.toggle('on', i === q.correct_index));
    }
    this.touch();
  },
  onClick(e) {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const qi = +b.closest('.qcard').dataset.qi, a = b.dataset.act, qs = this.qs;
    if (a === 'up' && qi > 0) [qs[qi - 1], qs[qi]] = [qs[qi], qs[qi - 1]];
    else if (a === 'down' && qi < qs.length - 1) [qs[qi + 1], qs[qi]] = [qs[qi], qs[qi + 1]];
    else if (a === 'del') { if ((qs[qi].text || qs[qi].choices.some(Boolean)) && !confirm(`ลบข้อ ${qi + 1}?`)) return;
      qs.splice(qi, 1); if (!qs.length) qs.push(this.blankQ()); }
    else if (a === 'rmimg') qs[qi].image_url = '';
    else if (a === 'rmcimg') qs[qi].images[+b.dataset.ci] = '';
    else if (a === 'pal') qs[qi].colors = [...PALETTES[+b.dataset.pi].c];
    else if (a === 'palall') { const c = qs[qi].colors; qs.forEach(q => q.colors = [...c]); toast('ใช้ชุดสีนี้กับทุกข้อแล้ว'); }
    else return;
    this.touch(); this.renderQs();
  },
  // ย่อรูปแล้วอัปโหลด คืนค่า URL (หรือ null ถ้าไม่สำเร็จ)
  async upload(file, input, max = 1280) {
    const lbl = input.closest('label');
    if (lbl) { lbl.style.opacity = .5; if (lbl.classList.contains('upl')) lbl.firstChild.textContent = 'กำลังอัปโหลด… '; else lbl.firstChild.textContent = '⏳'; }
    try {
      const blob = await shrinkImage(file, max, 0.82);
      const path = `${this.user.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
      const { error } = await sb.storage.from('quiz-images').upload(path, blob, { contentType: 'image/jpeg' });
      if (error) throw error;
      return sb.storage.from('quiz-images').getPublicUrl(path).data.publicUrl;
    } catch (e) { toast('อัปโหลดรูปไม่สำเร็จ: ' + errMsg(e), true); return null; }
  },
  collect() {
    const title = $('#f-title').value.trim();
    if (!title) throw new Error('กรุณาใส่ชื่อเกม');
    const out = this.qs.map((q, n) => {
      if (isText(q)) {
        if (!q.text.trim()) throw new Error(`ข้อ ${n + 1}: ยังไม่ได้พิมพ์คำถาม`);
        return { kind: 'text', text: q.text.trim(), image_url: q.image_url || '', choices: [], time_limit: +q.time_limit || 20 };
      }
      const pairs = q.choices.map((t, i) => ({ t: t.trim(), img: q.images[i] || '', c: colorAt(q.colors, i), i }))
                             .filter(p => p.t || p.img);
      if (!q.text.trim()) throw new Error(`ข้อ ${n + 1}: ยังไม่ได้พิมพ์คำถาม`);
      if (pairs.length < 2) throw new Error(`ข้อ ${n + 1}: ต้องมีอย่างน้อย 2 ตัวเลือก (ข้อความหรือรูป)`);
      const ci = pairs.findIndex(p => p.i === q.correct_index);
      if (ci < 0) throw new Error(`ข้อ ${n + 1}: คำตอบที่ถูกเป็นช่องว่าง เลือกใหม่อีกครั้ง`);
      const item = { text: q.text.trim(), image_url: q.image_url || '', choices: pairs.map(p => p.t),
                     colors: pairs.map(p => p.c), correct_index: ci, time_limit: +q.time_limit || 20 };
      if (pairs.some(p => p.img)) item.choice_images = pairs.map(p => p.img);
      return item;
    });
    if (!out.some(q => !isText(q))) throw new Error('ต้องมีข้อปรนัย (มีตัวเลือก) อย่างน้อย 1 ข้อ');
    return { title, dept: $('#f-dept').value.trim(), desc: $('#f-desc').value.trim(), qs: out };
  },
  async saveQuiz(andPlay) {
    let d;
    try { d = this.collect(); } catch (e) { return toast(e.message, true); }
    const btns = [$('#save'), $('#saveplay')]; btns.forEach(b => b.disabled = true);
    try {
      const id = await rpc('save_quiz', { p_id: this.quiz.id, p_title: d.title, p_department: d.dept,
                                         p_description: d.desc, p_questions: d.qs, p_cover: this.quiz.cover_url || '',
                                         p_shared: $('#f-shared').checked });
      const wasNew = !this.quiz.id;
      this.quiz.id = id; this.dirty = false; this.status();
      if (wasNew) { this.quiz.owner_email = this.quiz.owner_email || this.user.email; this.quiz.editors = []; this.bindEditors(); }
      history.replaceState(null, '', '#edit/' + id);
      if (andPlay) return this.play(id);
      toast('บันทึกแล้ว');
    } catch (e) { toast(errMsg(e), true); }
    btns.forEach(b => b.disabled = false);
  }
};

function shrinkImage(file, max, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('แปลงรูปไม่ได้')), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('ไฟล์นี้ไม่ใช่รูปภาพ')); };
    img.src = url;
  });
}

// =====================================================================
// จอใหญ่ของผู้จัด (เปิดบนโปรเจกเตอร์)
// =====================================================================
const Host = {
  async open(sid) {
    setBody('stage');
    const user = await requireStaff(); if (!user) return;
    setBody('stage');
    app.innerHTML = `<div class="center-msg"><div class="spinner"></div></div>`;
    const { data: s, error } = await sb.from('sessions').select('*').eq('id', sid).single();
    if (error || !s) {
      app.innerHTML = `<div class="center-msg"><div class="box"><h2>ไม่พบห้องเกมนี้</h2>
        <a class="btn sun" href="#admin">กลับหน้าผู้จัด</a></div></div>`;
      return;
    }
    Object.assign(this, { sid, s, pre: !!s.training_id, players: new Map(), answers: new Map(), phase: s.status,
                          deadline: s.question_ends_at ? Date.parse(s.question_ends_at) : 0,
                          revealing: false, prev: new Map() });
    await Promise.all([this.loadPlayers(), this.loadAnswers()]);

    const f = `session_id=eq.${sid}`;
    const ch = sb.channel('host-' + sid)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'players', filter: f }, p => {
        this.players.set(p.new.id, this.pick(p.new)); this.onPlayers(); })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'players', filter: f }, p => {
        this.players.set(p.new.id, this.pick(p.new)); })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'answers', filter: f }, p => {
        if (p.new.question_index === this.s.current_index) { this.answers.set(p.new.player_id, p.new.choice); this.onAnswers(); } })
      .subscribe();
    this.game = sb.channel('game-' + sid).subscribe();
    const poll = setInterval(() => this.sync(), 4000);
    const tick = setInterval(() => this.tick(), 200);
    const wake = () => { GameAudio.ensure(); this.music(); this.sndBtn(); };
    document.addEventListener('pointerdown', wake);
    onLeave(() => { clearInterval(poll); clearInterval(tick); sb.removeChannel(ch); sb.removeChannel(this.game);
      document.removeEventListener('pointerdown', wake); GameAudio.stop(); });
    this.render();
  },
  pick: r => ({ id: r.id, nickname: r.nickname, avatar: r.avatar, score: r.score, last_points: r.last_points }),
  async loadPlayers() {
    const { data } = await sb.from('players').select('id,nickname,avatar,score,last_points').eq('session_id', this.sid).order('joined_at');
    if (data) { this.players = new Map(data.map(p => [p.id, this.pick(p)])); }
  },
  async loadAnswers() {
    if (this.s.current_index < 0) return;
    const { data } = await sb.from('answers').select('player_id,choice')
      .eq('session_id', this.sid).eq('question_index', this.s.current_index);
    if (data) this.answers = new Map(data.map(a => [a.player_id, a.choice]));
  },
  async sync() {   // สำรองกรณี realtime สะดุด
    if (this.phase === 'lobby') { const n = this.players.size; await this.loadPlayers(); if (this.players.size !== n) this.onPlayers(); }
    else if (this.phase === 'question') { await Promise.all([this.loadPlayers(), this.loadAnswers()]); this.onAnswers(); }
  },
  broadcast() { this.game.send({ type: 'broadcast', event: 'state', payload: { status: this.s.status, index: this.s.current_index } }); },
  sorted(useScore = p => p.score) {
    return [...this.players.values()].sort((a, b) => useScore(b) - useScore(a) || a.nickname.localeCompare(b.nickname, 'th'));
  },
  q() { return this.s.questions[this.s.current_index]; },
  // ลิงก์เข้าร่วม: ใช้ JOIN_URL จาก config.js (ลิงก์สั้น) ถ้ามี ไม่งั้นใช้ลิงก์ที่เปิดอยู่
  joinBase() {
    let b = (CFG.JOIN_URL || '').trim() || (location.origin + location.pathname);
    if (!/^https?:\/\//.test(b)) b = 'https://' + b;
    return b.replace(/\/?$/, '/');
  },
  joinUrl() { return this.joinBase() + '?pin=' + this.s.pin; },
  topbar(extra = '') {
    return `<div class="stg-top"><span class="brand">${brandHTML()}</span>
      <span class="pill">${esc(this.s.title)}</span>${this.pre ? '<span class="pill">📝 Pre-test</span>' : ''}<span class="pill sun">PIN ${esc(this.s.pin)}</span>${extra}
      <div class="stg-actions"><button class="btn ghost sm" id="snd" title="เพลงและเสียงประกอบ"></button><button class="btn ghost sm" id="fs">⛶ เต็มจอ</button>
      ${this.phase !== 'ended' ? '<button class="btn ghost sm" id="endg">จบเกม</button>' : ''}</div></div>`;
  },
  sndBtn() { const b = $('#snd'); if (!b) return;
    b.textContent = !GameAudio.on ? '🔇 เสียงปิด' : GameAudio.ready() ? '🔊 เสียง' : '🔊 แตะเพื่อเปิดเสียง'; },
  // เพลงตามช่วงของเกม (หน้าคะแนน/จบเกม เล่นเสียงครั้งเดียวต่อข้อ)
  music() {
    const key = this.phase + ':' + this.s.current_index;
    if (this.phase === 'lobby') GameAudio.loop('lobby');
    else if (this.phase === 'question') {
      if (this.qKey !== key) { this.qKey = key; GameAudio.lastSec = null; GameAudio.clockOn = false; GameAudio.stopLoop(); }
      if (!GameAudio.clockOn) GameAudio.loop('question');
    }
    else if (this.sfxKey !== key && GameAudio.ready()) {
      this.sfxKey = key;
      if (this.phase === 'ended') GameAudio.fanfare(); else GameAudio.jingle();
    } else if (this.phase !== 'ended') GameAudio.stopLoop();
  },
  bindTop() {
    $('#snd').onclick = () => { GameAudio.setOn(!GameAudio.on); GameAudio.ensure(); this.music(); this.sndBtn(); };
    this.sndBtn(); this.music();
    $('#fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
    const e = $('#endg'); if (e) e.onclick = async () => {
      if (!confirm(this.pre ? 'จบเกมตอนนี้เลย?\nผลที่ตอบไปแล้วจะบันทึกเป็น Pre-test (ข้อที่ยังไม่ถึงนับเป็นตอบผิด)' : 'จบเกมตอนนี้เลย?')) return;
      try { await rpc('host_end', { p_session: this.sid }); this.s.status = 'ended'; this.phase = 'ended';
        await this.loadPlayers(); this.broadcast(); this.render(); } catch (err) { toast(errMsg(err), true); }

  render() {

          ${choiceBody(c, imgAt(q.images, i))}<span class="cnt">${counts[i]}</span></div>`).join('')}</div>
        <p class="sumline">ตอบถูก <b>${right}</b> จาก ${this.players.size} คน${total < this.players.size ? ` · ไม่ทันตอบ ${this.players.size - total} คน` : ''}</p>

// =====================================================================
// เสียงในเกม (จอใหญ่) — สังเคราะห์ด้วย Web Audio ทั้งหมด ไม่ใช้ไฟล์เพลง (ไม่มีลิขสิทธิ์)
// lobby = เพลงสบายๆ รอคนเข้า · question = เพลงจังหวะสนุก · 5 วินาทีสุดท้ายเร่งจังหวะ + เสียงนับถอยหลัง
// หมดเวลา = เสียงบัซเซอร์ · หน้าคะแนน = จิงเกิ้ลสั้น · จบเกม = แฟนแฟร์
// =====================================================================
const GameAudio = {
  on: (() => { try { return localStorage.getItem('quizlive.sound') !== 'off'; } catch (e) { return true; } })(),
  ctx: null, master: null, timer: null, mode: null, step: 0, nextT: 0, bpm: 120, lastSec: null, noiseBuf: null,
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.55;
      const comp = this.ctx.createDynamicsCompressor(); this.master.connect(comp); comp.connect(this.ctx.destination);
      const n = this.ctx.sampleRate, b = this.ctx.createBuffer(1, n, n), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = b;
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    return this.ctx;
  },
  ready() { return this.on && this.ctx && this.ctx.state === 'running'; },
  setOn(v) {
    this.on = v; try { localStorage.setItem('quizlive.sound', v ? 'on' : 'off'); } catch (e) {}
    if (!v) this.stopLoop(); else if (this.want) this.loop(this.want);
  },
  hz: m => 440 * Math.pow(2, (m - 69) / 12),
  tone(t, freq, dur, type = 'square', vol = 0.12, glideTo) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(t, dur, vol, hp, bp) {
    const c = this.ctx, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.noiseBuf; f.type = bp ? 'bandpass' : 'highpass'; f.frequency.value = bp || hp || 7000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t); src.stop(t + dur + 0.02);
  },
  kick(t, v = 0.5) { this.tone(t, 150, 0.22, 'sine', v, 45); },
  // C – G – Am – F (เพลงแต่งเอง ใช้คอร์ดพื้นฐาน)
  PROG: [[48, [60, 64, 67, 72]], [43, [59, 62, 67, 71]], [45, [60, 64, 69, 72]], [41, [60, 65, 69, 72]]],
  MELODY: [72, -1, 76, 74, 72, -1, 67, -1, 69, -1, 72, 74, 76, -1, 74, -1],
  playStep(t, i) {
    const bar = Math.floor(i / 16) % 4, k = i % 16, [root, ch] = this.PROG[bar], m = this.mode, dur = 60 / this.bpm / 4;
    if (m === 'clock') {
      // นาฬิกา: ติ๊ก-ต็อก ทุกครึ่งวินาที + เสียงพื้นเบามากต่อเนื่อง (กันลำโพง HDMI/บลูทูธตัดเสียงช่วงเงียบ)
      if (k % 4 === 0) this.tick(t, (i / 4) % 2 === 1);
      if (k % 8 === 0) this.tone(t, 55, dur * 8.2, 'sine', 0.006);
      return;
    }
    if (m === 'lobby') {
      if (k % 8 === 0) this.kick(t, 0.28);
      if (k % 4 === 2) this.noise(t, 0.05, 0.05);
      if (k % 4 === 0) this.tone(t, this.hz(root), dur * 3.5, 'triangle', 0.16);
      if (k % 2 === 0) this.tone(t, this.hz(ch[(k / 2) % 4]), dur * 1.8, 'triangle', 0.06);
      return;
    }
    // question / hurry
    const hurry = m === 'hurry';
    if (k % 4 === 0 || (hurry && k % 4 === 2)) this.kick(t, hurry && k % 4 === 2 ? 0.35 : 0.5);
    if (k % 2 === 1 || hurry) this.noise(t, 0.04, hurry ? 0.1 : 0.06);
    if (k === 4 || k === 12) this.noise(t, 0.12, 0.16, 0, 1800);
    if (k % 2 === 0) this.tone(t, this.hz(root + (k % 4 === 2 ? 12 : 0)), dur * 1.6, 'sawtooth', 0.07);
    this.tone(t, this.hz(ch[k % 4] + (hurry ? 12 : 0)), dur * 0.8, 'square', hurry ? 0.06 : 0.035);
    if (hurry && k % 4 === 0) this.tone(t, this.hz(84 + (bar % 2) * 2), dur * 0.9, 'square', 0.05);   // เสียงเตือนเร่ง
    const mel = this.MELODY[k]; if (mel > 0 && bar % 2 === 0 && !hurry) this.tone(t, this.hz(mel), dur * 1.8, 'triangle', 0.08);
  },
  loop(mode) {
    this.want = mode;
    if (!this.on || !this.ensure()) return;
    this.bpm = mode === 'lobby' ? 104 : mode === 'hurry' ? 168 : mode === 'clock' ? 120 : 128;
    if (this.mode === mode && this.timer) return;
    const fresh = !this.timer; this.mode = mode;
    if (!fresh) return;
    this.step = 0; this.nextT = this.ctx.currentTime + 0.06;
    this.timer = setInterval(() => {
      if (!this.ctx) return;
      while (this.nextT < this.ctx.currentTime + 0.12) { this.playStep(this.nextT, this.step++); this.nextT += 60 / this.bpm / 4; }
    }, 25);
  },
  stopLoop() { clearInterval(this.timer); this.timer = null; this.mode = null; },
  stop() { this.want = null; this.stopLoop(); this.lastSec = null; this.clockOn = false; },
  // เรียกทุก tick ระหว่างคำถาม: 5 วินาทีสุดท้าย เพลงหยุด เหลือแค่เสียงนาฬิกา ติ๊ก-ต็อก (เล่นต่อเนื่องจนหมดเวลา)
  countdown(left) {
    if (!this.ready()) return;
    const sec = Math.ceil(left);
    if (left > 0 && left <= 5) {
      this.clockOn = true;
      if (this.mode !== 'clock') { this.stopLoop(); this.loop('clock'); }
      this.lastSec = sec;
    }
  },
  // เสียงนาฬิกา: คลิกไม้สั้นๆ (ติ๊ก = สูง · ต็อก = ต่ำ)
  tick(t, tock) {
    this.noise(t, 0.05, 0.9, 0, tock ? 1400 : 2200);
    this.tone(t, tock ? 880 : 1320, 0.05, 'triangle', 0.22);
  },
  // หมดเวลา: นาฬิกาปลุกเบาๆ 2 ชุด (ติ๊ด-ติ๊ด ติ๊ด-ติ๊ด)
  buzzer() {
    // หยุดเพลง และกันเพลงกลับมาเล่นระหว่างรอเฉลย (คงสถานะ 'นาฬิกา' ไว้จนข้อถัดไป)
    this.want = null; this.stopLoop(); this.lastSec = null; this.clockOn = true;
    if (!this.on || !this.ensure()) return;
    const t = this.ctx.currentTime + 0.03;
    [0, 0.14, 0.42, 0.56].forEach(d => { this.tone(t + d, 1760, 0.11, 'sine', 0.24); this.tone(t + d, 3520, 0.09, 'sine', 0.05); });
  },
  jingle() {
    this.stop(); if (!this.on || !this.ensure()) return;
    const t = this.ctx.currentTime + 0.05;
    [72, 76, 79, 84].forEach((m, i) => this.tone(t + i * 0.09, this.hz(m), 0.22, 'triangle', 0.12));
    this.noise(t + 0.36, 0.25, 0.08);
  },
  fanfare() {
    this.stop(); if (!this.on || !this.ensure()) return;
    const t = this.ctx.currentTime + 0.05, seq = [[67, 0], [72, .15], [76, .3], [79, .45], [76, .7], [79, .85], [84, 1.05]];
    seq.forEach(([m, d]) => { this.tone(t + d, this.hz(m), 0.35, 'square', 0.08); this.tone(t + d, this.hz(m - 12), 0.35, 'triangle', 0.1); });
    this.kick(t + 1.05, 0.5); this.noise(t + 1.05, 0.6, 0.1);
  }
};

// QR เดียวตลอด: ระบบตรวจสถานะจากรหัสพนักงานแล้วพาไปขั้นที่ถูกต้อง

const PHASE_TH = { pre: 'Pre-test (ก่อนอบรม)', post: 'Post-test (หลังอบรม)' };

// สุ่มแบบกำหนดเมล็ดได้ — คนเดิมเห็นลำดับเดิมทุกครั้ง แต่ต่างจากคนอื่น
function seededRand(str) {
  let h = 1779033703 ^ str.length;
  for (const ch of str) { h = Math.imul(h ^ ch.charCodeAt(0), 3432918353); h = (h << 13) | (h >>> 19); }
  return () => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}
function shuffledIdx(n, rnd) {
  const a = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

    const other = $('#t-dept-other'), sel = $('#t-dept');

    this.hit = null;
    if (i.roster) {
      const emp = $('#t-emp'), rbox = $('#rbox'); let last = '', timer = null;

        let r = null; try { r = await rpc('roster_lookup', { p_code: this.code, p_emp: v }); } catch (e) { return; }

      ev.preventDefault();

  },
  async route() {
    const st = this.st = await rpc('test_status', { p_code: this.code, p_emp_id: this.who.emp_id });
    const qs = this.info.questions || [], seed = `${this.code}|${this.who.emp_id}|${this.phase}`;
    // สลับเฉพาะข้อปรนัย · ข้อเขียนไม่สลับ อยู่ท้ายทั้งหมดตามลำดับเดิม
    const mcq = qs.map((_, i) => i).filter(i => !isText(qs[i])), essay = qs.map((_, i) => i).filter(i => isText(qs[i]));
    this.order = (this.info.shuffle ? shuffledIdx(mcq.length, seededRand(seed)).map(k => mcq[k]) : mcq).concat(essay);
    this.corder = qs.map((q, i) => { const n = (q.choices || []).length;
      return this.info.shuffle ? shuffledIdx(n, seededRand(seed + '|' + i)) : Array.from({ length: n }, (_, k) => k); });
    if (this.phase === 'pre') return st.pre_done ? this.preDone() : this.questions();
    if (st.post_passed) return st.has_survey && !st.survey_done ? this.survey() : this.finished();
    if (st.post_attempts > 0) return this.info.retake ? this.questions(st.last_answers, st.wrong, st) : this.finished();
    return this.questions();
  },
  draftKey() { return `quizlive.draft.${this.code}.${this.phase}.${this.who.emp_id}`; },
  dispNo(qi) { return this.order.indexOf(qi) + 1; },
  questions(prev, wrong, st) {
    window.scrollTo(0, 0);
    const qs = this.info.questions || [];
    this.wrong = new Set(wrong || []);
    const draft = load(this.draftKey());
    this.ans = (draft && draft.length === qs.length) ? draft : (prev && prev.length === qs.length ? [...prev] : qs.map(() => null));
    const retry = !!(prev && wrong);
    app.innerHTML = `<main class="tst">
      <div class="row" style="justify-content:space-between"><span class="phase ${this.phase}">${PHASE_TH[this.phase]}</span>
        <span class="hint">${esc(this.who.name)} · ${esc(this.who.dept)}</span></div>
      ${retry ? `<div class="notice">สอบครั้งที่ ${st.post_attempts + 1} · ครั้งก่อนได้ <b>${st.score}/${st.total}</b> (เกณฑ์ผ่าน ${this.info.pass_percent}%)<br>
        ข้อที่ยังไม่ถูกมี<b class="down">กรอบสีแดง</b> ระบบจำคำตอบเดิมไว้ให้ แก้เฉพาะข้อที่ผิดได้เลย</div>` : ''}
      ${this.order.map((qi, k) => { const q = qs[qi];
        if (isText(q)) return `<section class="tq" id="tq${qi}"><div class="qn">ข้อ ${k + 1} / ${qs.length} · <span class="wtag">ข้อเขียน ไม่คิดคะแนน</span></div>
          <h3>${esc(q.text)}</h3>${q.image_url ? `<img class="qimg" src="${esc(q.image_url)}" alt="">` : ''}
          <textarea class="ans" data-w="${qi}" maxlength="2000" placeholder="พิมพ์คำตอบ…">${esc(typeof this.ans[qi] === 'string' ? this.ans[qi] : '')}</textarea></section>`;
        return `<section class="tq ${this.wrong.has(qi) ? 'wrongq' : ''}" id="tq${qi}"><div class="qn">ข้อ ${k + 1} / ${qs.length}${this.wrong.has(qi) ? ' · <span class="down">ครั้งก่อนข้อนี้ยังไม่ถูก</span>' : ''}</div>
        <h3>${esc(q.text)}</h3>${q.image_url ? `<img class="qimg" src="${esc(q.image_url)}" alt="">` : ''}
        <div class="opts2 ${hasImgs(q.images) ? 'imgs' : ''}">${this.corder[qi].map((ci, pos) =>
          `<button type="button" class="tch" data-q="${qi}" data-i="${ci}"><b style="${chipStyle(q.colors, pos)}">${LETTERS[pos]}</b>${choiceBody(q.choices[ci], imgAt(q.images, ci))}</button>`).join('')}</div>
      </section>`; }).join('')}</main>
      <div class="tbar2"><div class="in"><div class="prog" id="prog"></div><button class="btn sun" id="send">ส่งคำตอบ</button></div></div>`;
    app.onclick = e => {
      const b = e.target.closest('.tch[data-q]'); if (!b) return;
      this.ans[+b.dataset.q] = +b.dataset.i; save(this.draftKey(), this.ans); this.mark();
    };
    app.oninput = e => { const w = e.target.closest('textarea[data-w]'); if (!w) return;
      this.ans[+w.dataset.w] = w.value; save(this.draftKey(), this.ans); this.mark(); };
    $('#send').onclick = () => this.send();
    onLeave(() => { app.onclick = null; app.oninput = null; });
    this.mark();
  },
  mark() {
    $$('.tch[data-q]').forEach(b => b.classList.toggle('on', this.ans[+b.dataset.q] === +b.dataset.i));
    const done = this.ans.filter(a => this.answered(a)).length, n = this.ans.length;
    $('#prog').innerHTML = `ตอบแล้ว <b>${done}</b> / ${n}<i><span style="width:${100 * done / n}%"></span></i>`;
  },
  answered(a) { return typeof a === 'string' ? a.trim() !== '' : a !== null && a !== undefined; },
  async send() {
    const miss = this.order.find(qi => !this.answered(this.ans[qi]));
    if (miss !== undefined) { toast(`ยังไม่ได้ตอบข้อ ${this.dispNo(miss)}`, true); $('#tq' + miss).scrollIntoView({ behavior: 'smooth' }); return; }
    if (!confirm(`ส่งคำตอบ ${PHASE_TH[this.phase]}?`)) return;
    const b = $('#send'); b.disabled = true; b.textContent = 'กำลังส่ง…';
    try {
      const r = await rpc('submit_test', { p_code: this.code, p_phase: this.phase, p_emp_id: this.who.emp_id,
        p_name: this.who.name, p_hospital: this.who.hospital || '', p_dept: this.who.dept, p_answers: this.ans });
      save(this.draftKey());
      if (this.phase === 'pre') { save('quizlive.tester', { ...(load('quizlive.tester') || {}), lastPre: this.code }); return this.preDone(); }
      this.last = r;
      if (r.pass) { this.st = await rpc('test_status', { p_code: this.code, p_emp_id: this.who.emp_id }); return r.need_survey ? this.survey() : this.finished(); }
      this.failed(r);
    } catch (e) { toast(errMsg(e), true); b.disabled = false; b.textContent = 'ส่งคำตอบ'; }
  },
  preDone() {
    window.scrollTo(0, 0);
    app.innerHTML = `<main class="tst">${this.head()}<div class="tcard" style="text-align:center">
      <div style="font-size:56px">✅</div><h2 style="margin:0">ส่ง Pre-test เรียบร้อยแล้ว</h2>
      <p style="margin:0;color:var(--muted)">${esc(this.who.name)} · ขอบคุณครับ<br>หลังอบรมเสร็จ สแกน QR เดิม (หรือเปิดลิงก์เดิม) เพื่อทำ Post-test</p></div></main>`;
  },
  failed(r) {

        <p style="margin:0;text-align:center">ข้อที่ยังไม่ถูก: <b class="down">ข้อ ${nums.join(', ')}</b></p>
        ${r.retake ? `<button class="btn sun lg" id="again">สอบใหม่ (แก้เฉพาะข้อที่ผิด)</button>
          <p class="hint" style="text-align:center">ระบบไม่แสดงเฉลย ทบทวนเนื้อหาแล้วลองอีกครั้ง</p>`

    const a = $('#again'); if (a) a.onclick = () => this.questions(this.ans, r.wrong, { post_attempts: r.attempt, score: r.score, total: r.total });
  },
  survey() {
    window.scrollTo(0, 0);
    const sv = this.info.survey, key = `quizlive.svdraft.${this.code}`;
    const ans = load(key) || {};
    app.innerHTML = `<main class="tst">
      <div class="tcard" style="text-align:center;background:#dff3e8"><div style="font-size:40px">🎉</div>
        <h2 style="margin:0">สอบ Post-test ผ่านแล้ว!</h2><p style="margin:0">ขั้นตอนสุดท้าย: แบบประเมินความพึงพอใจ</p></div>
      <div class="tcard"><h2 style="margin:0;font-size:20px">${esc(sv.title)}</h2>
        ${sv.description ? `<p class="hint" style="margin:0;white-space:pre-line">${esc(sv.description)}</p>` : ''}${ANON_NOTE}</div>
      <div id="svf">${surveyFormHTML(sv)}</div></main>
      <div class="tbar2"><div class="in"><span class="prog">🔒 ไม่ระบุตัวตน</span><button class="btn sun" id="svsend">ส่งแบบประเมิน</button></div></div>`;
    bindSurveyForm($('#svf'), sv, ans, () => save(key, ans));
    $('#svsend').onclick = async () => {
      const m = surveyMissing(sv, ans); if (m) return flagMissing($('#svf'), m);
      const b = $('#svsend'); b.disabled = true; b.textContent = 'กำลังส่ง…';
      try {
        await rpc('submit_training_survey', { p_code: this.code, p_emp_id: this.who.emp_id, p_answers: surveyPayload(sv, ans) });
        save(key); this.st = { ...this.st, survey_done: true }; this.finished();

      <div class="tcard" style="text-align:center">

          <div class="score-big">${st.score}<small> / ${st.total}</small></div>

          <p class="hint">กรุณาติดต่อผู้คุมสอบ</p>`}</div></main>`;
  }

// ---------- สถิติแบบประเมิน ----------
function interpret(m) { return m == null ? '–' : m >= 4.51 ? 'มากที่สุด' : m >= 3.51 ? 'มาก' : m >= 2.51 ? 'ปานกลาง' : m >= 1.51 ? 'น้อย' : 'น้อยที่สุด'; }
function surveyStats(items, responses) {
  const rows = [], texts = [], sections = []; let cur = null;
  for (const it of items || []) {
    if (it.type === 'section') { cur = { title: it.text, vals: [] }; sections.push(cur); continue; }
    if (it.type === 'scale') {
      const v = responses.map(r => r.answers[it.id]).filter(x => x >= 1 && x <= 5), n = v.length;
      const mean = n ? v.reduce((a, b) => a + b, 0) / n : null;
      const sd = n > 1 ? Math.sqrt(v.reduce((a, b) => a + (b - mean) ** 2, 0) / (n - 1)) : n === 1 ? 0 : null;
      const dist = [1, 2, 3, 4, 5].map(k => v.filter(x => x === k).length);
      rows.push({ id: it.id, text: it.text, section: cur ? cur.title : '', n, mean, sd, sat: n ? Math.round(100 * (dist[3] + dist[4]) / n) : null, dist });
      if (cur) cur.vals.push(...v);
    } else if (it.type === 'text') texts.push({ text: it.text, list: responses.map(r => r.answers[it.id]).filter(Boolean) });
  }
  const all = rows.flatMap(r => responses.map(x => x.answers[r.id]).filter(x => x >= 1));
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  return { n: responses.length, rows, texts, overall: avg(all), sat: all.length ? Math.round(100 * all.filter(x => x >= 4).length / all.length) : null,
           sections: sections.filter(s => s.vals.length).map(s => ({ title: s.title, mean: avg(s.vals) })) };
}

// =====================================================================
// คำนวณรายงาน Pre/Post — ใช้ทั้งหน้ารอบเดียวและรายงานรวมหลายรอบ
// trs = รอบอบรม, subs = ผลส่งของทุกรอบ, done = Set ของ "training_id|emp_id" ที่ทำแบบประเมินแล้ว
// คนเดียวกันอยู่คนละรอบ นับเป็นคนละแถว (เทียบ Pre/Post ภายในรอบเดียวกันเท่านั้น)
// =====================================================================
function sameQuestions(trs) {
  const sig = t => JSON.stringify((t.questions || []).map(q => [q.text, q.choices, q.correct]));
  return trs.length > 0 && trs.every(t => sig(t) === sig(trs[0]));
}
// ข้อเขียน (ไม่คิดคะแนน) — แสดงคำตอบทั้งหมดใต้ตารางรายข้อ
function writesHTML(writes, showRound) {
  if (!writes || !writes.length) return '';
  return writes.map(w => `<h3 style="margin:18px 0 6px">✍ ข้อ ${w.n} (ข้อเขียน · ไม่คิดคะแนน)</h3><p style="margin:0 0 8px">${esc(w.text)}</p>
    <div class="wans">${w.ans.length ? w.ans.map(a => `<div class="wa"><small>${a.ph} · ${esc(a.r.name)} · ${esc(a.r.dept || '')}${showRound ? ' · ' + esc(roundName(a.r.t)) : ''}</small>${esc(a.text)}</div>`).join('')
      : '<p class="hint">ยังไม่มีคำตอบ</p>'}</div>`).join('');
}
function writesSheet(writes, add, showRound) {
  if (!writes || !writes.length) return;
  add('ข้อเขียน', [[...(showRound ? ['รอบ'] : []), 'ข้อ', 'คำถาม', 'ครั้ง', 'รหัสพนักงาน', 'ชื่อ-สกุล', 'โรงพยาบาล', 'แผนก', 'คำตอบ']]
    .concat(writes.flatMap(w => w.ans.map(a => [...(showRound ? [roundName(a.r.t)] : []), w.n, w.text, a.ph, a.r.emp_id, a.r.name, a.r.hosp || '', a.r.dept || '', a.text]))));
}
// ตัวเลือกที่ได้คะแนน: correct + also (กรณีแก้เฉลยหลังเริ่มอบรม ให้คะแนนได้มากกว่า 1 ตัวเลือก)
const rightSet = q => [q.correct, ...(Array.isArray(q.also) ? q.also : [])];
const isRight = (q, a) => a != null && rightSet(q).includes(a);
const keyText = q => rightSet(q).map(k => q.choices[k] || '(รูป)').join(' หรือ ');
const ansCell = (q, a) => isText(q) ? (typeof a === 'string' ? a : '') : a == null ? '(ไม่ทันตอบ)' : (q.choices[a] || '(รูป)') + (isRight(q, a) ? ' ✓' : '');
function prepostCalc(trs, subs, done) {
  const tmap = new Map(trs.map(t => [t.id, t])), pct = s => s ? Math.round(100 * s.score / s.total) : null;
  const people = new Map();
  for (const s of subs) {
    const t = tmap.get(s.training_id); if (!t) continue;
    const key = s.training_id + '|' + s.emp_id;
    const p = people.get(key) || { key, t, emp_id: s.emp_id, name: s.full_name, dept: s.department, hosp: s.hospital, posts: [] };
    if (s.phase === 'pre') { if (!p.pre || s.attempt < p.pre.attempt) p.pre = s; }
    else { p.posts.push(s); p.name = s.full_name; p.dept = s.department; p.hosp = s.hospital || p.hosp; }
    people.set(key, p);
  }
  const rows = [...people.values()].map(p => {
    p.posts.sort((a, b) => a.attempt - b.attempt);
    const pass = p.t.pass_percent, post1 = p.posts[0] || null, postL = p.posts[p.posts.length - 1] || null;
    return { ...p, post1, postL, attempts: p.posts.length, prePct: pct(p.pre), post1Pct: pct(post1), postLPct: pct(postL),
             passed: postL ? pct(postL) >= pass : null, passedFirst: post1 ? pct(post1) >= pass : null, survey: done.has(p.key) };
  }).sort((a, b) => (a.t.round_no || 0) - (b.t.round_no || 0) || (a.hosp || '').localeCompare(b.hosp || '', 'th')
                 || (a.dept || '').localeCompare(b.dept || '', 'th') || a.name.localeCompare(b.name, 'th'));
  const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : null;
  const sumUp = rs => {
    const pres = rs.filter(r => r.pre), posts = rs.filter(r => r.post1), both = rs.filter(r => r.pre && r.post1), passed = posts.filter(r => r.passed);
    return { n: rs.length, pres, posts, both, preAvg: avg(pres.map(r => r.prePct)), postAvg: avg(posts.map(r => r.post1Pct)),
      gain: both.length ? avg(both.map(r => r.post1Pct - r.prePct)) : null, passN: passed.length, passFirstN: posts.filter(r => r.passedFirst).length,
      avgAttempts: passed.length ? (passed.reduce((a, r) => a + r.attempts, 0) / passed.length).toFixed(1) : null,
      surveyN: rs.filter(r => r.survey).length };
  };
  const group = keyFn => [...new Set(rows.map(keyFn))].map(k => {
    const rs = rows.filter(r => keyFn(r) === k), po = rs.filter(r => r.post1);
    return { key: k, hosp: rs[0].hosp || '', dept: rs[0].dept || '(ไม่ระบุ)', n: rs.length, pre: avg(rs.filter(r => r.pre).map(r => r.prePct)),
             post: avg(po.map(r => r.post1Pct)), passN: po.filter(r => r.passed).length, postN: po.length };
  });
  // รายข้อ: รวมได้เมื่อทุกรอบใช้คำถามชุดเดียวกัน
  const same = sameQuestions(trs), first = sub => sub.attempt === 1 && tmap.has(sub.training_id);
  const firstPost = subs.filter(x => x.phase === 'post' && first(x)), firstPre = subs.filter(x => x.phase === 'pre' && first(x));
  const items = !same ? null : trs[0].questions.map((q, i) => isText(q) ? null : (() => {
    const f = ss => { if (!ss.length) return { pct: null, wrong: -1, wrongN: 0, n: 0, cnt: q.choices.map(() => 0) };
      const cnt = q.choices.map(() => 0); ss.forEach(x => { const a = x.answers[i]; if (cnt[a] !== undefined) cnt[a]++; });
      let wrong = -1; cnt.forEach((c, k) => { if (!isRight(q, k) && c > 0 && (wrong < 0 || c > cnt[wrong])) wrong = k; });
      // ถูก/ผิด ตามเฉลยของรอบที่คนนั้นสอบ (รอบเก่าอาจให้คะแนนเพิ่มบางตัวเลือก)
      const right = ss.filter(x => isRight((tmap.get(x.training_id) || trs[0]).questions[i] || q, x.answers[i])).length;
      return { pct: Math.round(100 * right / ss.length), right, wrong, wrongN: wrong >= 0 ? cnt[wrong] : 0, n: ss.length, cnt }; };
    return { n: i + 1, q, text: q.text, correct: q.correct, choices: q.choices, pre: f(firstPre), post: f(firstPost) };
  })()).filter(Boolean);
  // ข้อเขียน: คำตอบ Pre ครั้งแรก และ Post ครั้งล่าสุดของแต่ละคน
  const writes = !same ? null : trs[0].questions.map((q, i) => {
    if (!isText(q)) return null;
    const ans = rows.flatMap(r => [['Pre', r.pre], ['Post', r.postL]].filter(([, x]) => x && typeof x.answers[i] === 'string' && x.answers[i].trim())
      .map(([ph, x]) => ({ ph, r, text: x.answers[i] })));
    return { n: i + 1, text: q.text, ans };
  }).filter(Boolean);
  const rounds = trs.map(t => ({ t, ...sumUp(rows.filter(r => r.t.id === t.id)) }));
  return { rows, items, writes, avg, rounds, depts: group(r => (r.hosp || '') + '|' + r.dept), hosps: group(r => r.hosp || ''), ...sumUp(rows) };
}

async function fetchAll(build) {
  const out = []; let from = 0;
  for (;;) {
    const { data, error } = await build().range(from, from + 999);
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < 1000) return out;
    from += 1000;
  }
}

  async saveSettings() {
    const c = this.c, title = $('#c-title').value.trim();
    if (!title) return toast('กรุณาใส่ชื่องาน', true);
    const steps = {}; $$('[data-step]').forEach(b => steps[b.dataset.step] = b.checked);
    const hs = $$('[data-hosp]').filter(b => b.checked).map(b => b.dataset.hosp);
    const dlist = [...new Set($('#c-depts').value.split('\n').map(x => x.trim()).filter(Boolean))];
    const val = {
      title, cert_title: $('#c-cert').value.trim(), location: $('#c-loc').value.trim(),
      seats: Math.max(0, +$('#c-seat').value || 0), steps,
      booking_open: $('#c-bopen').checked, booking_close_days: Math.max(0, Math.min(60, +$('#c-bclose').value || 0)),
      quiz_id: $('#c-quiz').value || null, survey_id: $('#c-sv').value || null,
      pass_percent: Math.max(0, Math.min(100, +$('#c-pass').value || 0)),
      hospitals: hs.length === this.hospitals.length ? null : hs,
      departments: dlist.length ? dlist : null,
      finish_pin_enabled: $('#c-pinon').checked, finish_pin: $('#c-pin').value.trim()
    };
    if ($('#c-co') && !$('#c-co').disabled) val.cohosts = $('#c-co').value.split(/[\s,;]+/).map(x => x.trim().toLowerCase()).filter(Boolean);
    const dom = (CFG.ALLOWED_DOMAIN || '').toLowerCase();
    if (val.cohosts && dom && val.cohosts.some(e => !e.endsWith('@' + dom))) return toast(`ผู้จัดร่วมต้องเป็นอีเมล @${dom}`, true);
    const btn = $('#c-save'); btn.disabled = true;
    try {
      if (!c.id) {
        const { data, error } = await sb.from('courses').insert(val).select('*').single();
        if (error) throw error;
        toast('สร้างงานอบรมแล้ว · เพิ่มรุ่นได้ที่แท็บรุ่น'); location.hash = '#course/' + data.id; return;
      }
      const { data, error } = await sb.from('courses').update(val).eq('id', c.id).select('*').single();
      if (error) throw error;
      this.c = data;
      if ($('#c-apply').checked && this.rows.length) {
        const upd = { pass_percent: data.pass_percent, survey_id: data.survey_id, departments: data.departments, roster: data.roster_source };
        if (val.cohosts) upd.cohosts = data.cohosts;
        const r = await sb.from('trainings').update(upd).eq('course_id', c.id);
        if (r.error) throw r.error;
      }
      toast('บันทึกแล้ว'); btn.disabled = false; this.render();
    } catch (e) { toast(errMsg(e), true); btn.disabled = false; }
  },
  async remove() {
    const c = this.c;
    if (!confirm(`ลบงานอบรม “${c.title}”?\nรุ่นและผลสอบยังอยู่ (ย้ายไปอยู่ในหัวข้อ “รอบที่ยังไม่อยู่ในงานอบรม”) · ข้อมูลการจองและลงทะเบียนของงานนี้จะถูกลบ`)) return;
    const { error } = await sb.from('courses').delete().eq('id', c.id);
    if (error) return toast(errMsg(error), true);
    toast('ลบงานอบรมแล้ว'); location.hash = '#admin';
  }
};

// v14.2: หน้าผู้เข้าร่วม ?c=<รหัสงาน> — ลงชื่อเข้า (เซ็นชื่อ) / จองรอบ
// =====================================================================
function sigPad(canvas) {
  // กันฝ่ามือ: วาดตามนิ้ว/ปากกาเพียง 1 จุด · จุดสัมผัสใหญ่ (ฝ่ามือ) ไม่นับ · ถ้ามีปากกา ไม่นับนิ้ว
  // ถ้าจุดที่จับไว้ไม่ขยับ (เช่น ฝ่ามือที่ระบบวัดขนาดไม่ได้) แล้วมีอีกจุดลากอยู่ → เปลี่ยนไปวาดตามจุดที่ลาก
  const g = canvas.getContext('2d'); let strokes = 0, active = null, last = null, lastMove = 0, pen = false;
  const pts = new Map();
  const fit = () => { const r = canvas.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * d); canvas.height = Math.round(r.height * d);
    g.setTransform(d, 0, 0, d, 0, 0); g.lineWidth = 2.4; g.lineCap = g.lineJoin = 'round'; g.strokeStyle = '#0b1f4d'; g.fillStyle = '#0b1f4d'; strokes = 0; };
  const pos = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const palm = e => e.pointerType === 'touch' && (e.width > 44 || e.height > 44);
  const ignore = e => palm(e) || (pen && e.pointerType === 'touch');
  const dot = p => { g.beginPath(); g.arc(p[0], p[1], 1.1, 0, 7); g.fill(); };
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    // iOS: แป้นพิมพ์ค้างจากช่องชื่อ → ปิดก่อน หน้าจะได้ไม่ขยับระหว่างเซ็น
    if (document.activeElement && document.activeElement !== document.body && document.activeElement.blur) document.activeElement.blur();
    if (e.pointerType === 'pen') { pen = true; if (active !== null && pts.get(active) && pts.get(active).type === 'touch') active = null; }
    if (ignore(e)) return;
    try { canvas.setPointerCapture(e.pointerId); } catch (er) {}
    pts.set(e.pointerId, { p: pos(e), type: e.pointerType, moved: 0 });
    if (active === null) { active = e.pointerId; last = pos(e); lastMove = performance.now(); dot(last); strokes++; }
  });
  canvas.addEventListener('pointermove', e => {
    const t = pts.get(e.pointerId); if (!t || ignore(e)) return;
    e.preventDefault();
    const p = pos(e), d = Math.hypot(p[0] - t.p[0], p[1] - t.p[1]);
    if (e.pointerId !== active) {
      t.moved += d; t.p = p;
      // จุดที่วาดอยู่นิ่งเกิน 250ms แต่อีกจุดลากไปแล้ว > 6px → จุดที่นิ่งน่าจะเป็นฝ่ามือ
      if (active === null || (performance.now() - lastMove > 250 && t.moved > 6)) { active = e.pointerId; last = p; lastMove = performance.now(); }
      return;
    }
    if (d < 0.5) return;
    g.beginPath(); g.moveTo(last[0], last[1]); g.lineTo(p[0], p[1]); g.stroke();
    last = p; t.p = p; lastMove = performance.now(); strokes++;
  });
  const end = e => { pts.delete(e.pointerId); if (e.pointerId === active) active = null; };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => canvas.addEventListener(n, end));
  // กัน iOS เลื่อนหน้า/ซูม/แว่นขยาย/เมนูคัดลอกระหว่างเซ็น
  ['touchstart', 'touchmove', 'touchend', 'gesturestart'].forEach(n => canvas.addEventListener(n, e => e.preventDefault(), { passive: false }));
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  // หมุนจอ / แป้นพิมพ์เปลี่ยนขนาด → ปรับขนาดกรอบโดยไม่ลบลายเซ็นที่เซ็นไว้
  let rw = 0;
  const refit = () => {
    const r = canvas.getBoundingClientRect(); if (!r.width || Math.abs(r.width - rw) < 2) return; rw = r.width;
    if (!strokes) return fit();
    const tmp = document.createElement('canvas'); tmp.width = canvas.width; tmp.height = canvas.height; tmp.getContext('2d').drawImage(canvas, 0, 0);
    const keep = strokes; fit(); const d = window.devicePixelRatio || 1;
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(tmp, 0, 0, canvas.width, canvas.height); g.restore(); g.setTransform(d, 0, 0, d, 0, 0); strokes = keep;
  };
  const onRs = () => setTimeout(refit, 120);
  window.addEventListener('resize', onRs);
  onLeave(() => window.removeEventListener('resize', onRs));
  fit(); rw = canvas.getBoundingClientRect().width;
  return {
    clear: fit, empty: () => strokes < 8,
    blob: () => new Promise((res, rej) => {
      // พื้นขาว + ย่อขนาดไม่เกิน 600px กว้าง (ไฟล์ราว 5–20 KB)
      const w = Math.min(600, canvas.width), h = Math.round(canvas.height * w / canvas.width);
      const c2 = document.createElement('canvas'); c2.width = w; c2.height = h;
      const g2 = c2.getContext('2d'); g2.fillStyle = '#fff'; g2.fillRect(0, 0, w, h); g2.drawImage(canvas, 0, 0, w, h);
      c2.toBlob(b => b ? res(b) : rej(new Error('บันทึกลายเซ็นไม่ได้')), 'image/png');
    })
  };
}

const Entry = {

    app.innerHTML = `<div class="center-msg"><div class="spinner"></div></div>`;
    try { this.info = late ? await rpc('late_info', { p_token: late }) : await rpc('course_info', { p_code: code }); if (late) this.code = this.info.code; }
    catch (e) { app.innerHTML = `<div class="center-msg"><div class="box"><h2>${esc(errMsg(e))}</h2><a class="btn" href="./">กลับหน้าแรก</a></div></div>`; return; }
    const i = this.info, ci = (i.rounds || []).filter(r => r.checkin_open);
    if (i.closed) { app.innerHTML = `<main class="tst">${this.head('<span class="phase">ปิดแล้ว</span>')}<div class="tcard" style="text-align:center">
        <div style="font-size:44px">🔒</div><h2 style="margin:0">งานอบรมนี้ปิดแล้ว</h2><p class="hint" style="margin:0">ขอบคุณที่เข้าร่วม · หากต้องการลงชื่อย้อนหลัง ติดต่อผู้จัด</p></div></main>`; return; }

// ---------- v14.6 ส่งอีเมลจาก Gmail ของผู้ใช้ (Google Identity Services) — ใช้เมื่อตั้ง GOOGLE_CLIENT_ID ใน config.js ----------
const Mailer = {
  gmailOn() { return !!CFG.GOOGLE_CLIENT_ID; },
  async token(hint) {
    if (this.tok && this.tokExp > Date.now() + 60e3) return this.tok;
    await loadScript('https://accounts.google.com/gsi/client');
    return new Promise((res, rej) => {
      const tc = google.accounts.oauth2.initTokenClient({ client_id: CFG.GOOGLE_CLIENT_ID, scope: 'https://www.googleapis.com/auth/gmail.send', hint,
        callback: r => { if (r.error || !r.access_token) return rej(new Error(r.error_description || r.error || 'ไม่ได้รับอนุญาต'));
          this.tok = r.access_token; this.tokExp = Date.now() + (r.expires_in || 3000) * 1000; res(r.access_token); },
        error_callback: e => rej(new Error(e && e.type === 'popup_closed' ? 'ปิดหน้าขออนุญาตก่อน' : 'เบราว์เซอร์บล็อกหน้าต่างขออนุญาต')) });
      tc.requestAccessToken({ prompt: '' });
    });
  },
  async gmail(to, subject, html, text, from) {
    const tok = await this.token(from);
    const b64 = str => { const u = new TextEncoder().encode(str); let bin = ''; u.forEach(x => bin += String.fromCharCode(x)); return btoa(bin); };
    const wrap = x => x.replace(/.{1,76}/g, '$&\r\n');
    const bd = 'ql' + Date.now().toString(36);
    const mime = [`To: ${to}`, `Subject: =?UTF-8?B?${b64(subject)}?=`, 'MIME-Version: 1.0', `Content-Type: multipart/alternative; boundary="${bd}"`, '',
      `--${bd}`, 'Content-Type: text/plain; charset=UTF-8', 'Content-Transfer-Encoding: base64', '', wrap(b64(text)),
      `--${bd}`, 'Content-Type: text/html; charset=UTF-8', 'Content-Transfer-Encoding: base64', '', wrap(b64(html)), `--${bd}--`, ''].join('\r\n');
    const raw = b64(mime).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    const r = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', { method: 'POST',
      headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' }, body: JSON.stringify({ raw }) });
    if (!r.ok) { const j = await r.json().catch(() => ({})); if (r.status === 401) this.tok = null; throw new Error((j.error && j.error.message) || 'Gmail ' + r.status); }
    return true;
  }
};

  async render(C, box) {

    box.innerHTML = '<div class="center-msg" style="min-height:20vh"><div class="spinner"></div></div>';

    catch (e) { box.innerHTML = `<div class="empty">${esc(errMsg(e))}</div>`; return; }

  },
  calc(C) {
    const rows = C.rows, now = Date.now(), lab = Object.fromEntries(rows.map(r => [r.id, r]));
    const finAt = {}; this.att.forEach(a => { if (a.finish_at) (finAt[a.emp_key] = finAt[a.emp_key] || new Set()).add(a.training_id); });
    const P = this.people.map(p => ({ ...p, bk: p.booking ? p.booking.training_id : null, in: new Set(p.attended.map(a => a.training_id)),
      fin: p.attended.some(a => a.finish), late: p.attended.some(a => a.late) }));
    const hasRoster = P.some(p => p.in_roster), walk = p => hasRoster ? !p.in_roster : false;
    const started = r => r && r.starts_at ? new Date(r.starts_at).getTime() <= now : false;
    const per = r => { const b = P.filter(p => p.bk === r.id), came = P.filter(p => p.in.has(r.id));
      return { r, booked: b.length, bookedCame: b.filter(p => p.in.size).length, absent: b.filter(p => !p.in.size && started(r)).length,
        notBooked: came.filter(p => !p.bk).length, walkin: came.filter(walk).length, total: came.length }; };
    const f = this.f, R = rows.filter(r => (!f.day || this.day(r.starts_at) === f.day) && (!f.round || r.id === f.round)), RS = new Set(R.map(r => r.id));
    const scoped = !!(f.day || f.round), inR = p => [...p.in].some(id => RS.has(id)), bkR = p => p.bk && RS.has(p.bk);
    const came = P.filter(p => p.in.size), roster = P.filter(p => p.in_roster);
    const absentAll = P.filter(p => p.bk && !p.in.size).map(p => { const r = lab[p.bk], d = this.day(r && r.starts_at), t = this.day(new Date());
      return { p, r, state: !r || !r.starts_at ? 'ยังไม่มา' : started(r) ? (d === t ? 'วันนี้ ยังไม่มา' : 'ไม่มา') : 'ยังไม่ถึงเวลา' }; });
    const D = {}, dr = k => D[k] || (D[k] = { dept: k, target: 0, booked: 0, attended: 0 });
    roster.forEach(p => dr(p.dept || 'ไม่ระบุ').target++); P.filter(p => p.bk).forEach(p => dr(p.dept || 'ไม่ระบุ').booked++); came.forEach(p => dr(p.dept || 'ไม่ระบุ').attended++);

    const finOn = stepOn(C.c, 'finish') || this.att.some(a => a.finish_at);

             bookedCame: came.filter(p => p.bk).length, notBooked: came.filter(p => !p.bk).length, walkin: came.filter(walk).length, fin: came.filter(p => p.fin).length,
             late: came.filter(p => p.late).length, booked: P.filter(p => p.bk).length, absentPast: absentAll.filter(a => a.state === 'ไม่มา').length,
             absentToday: absentAll.filter(a => a.state === 'วันนี้ ยังไม่มา').length, upcoming: absentAll.filter(a => a.state === 'ยังไม่ถึงเวลา').length },
      scope: { booked: P.filter(bkR).length, bookedCame: P.filter(p => bkR(p) && p.in.size).length,
               absent: absentAll.filter(a => !scoped || RS.has(a.p.bk)).filter(a => a.state === 'ไม่มา' || a.state === 'วันนี้ ยังไม่มา').length,

      lists: { absent: absentAll.filter(a => !scoped || RS.has(a.p.bk)),

// ---------- v14.7 ส่งสรุปทางอีเมล (ผู้จัดกดเอง): สรุปทั้งงาน + รายงาน PDF + ใบลงชื่อพร้อมลายเซ็น PDF ----------
const SendReport = {
  bkkDay(s) { return s ? new Date(new Date(s).getTime() + 7 * 3600e3).toISOString().slice(0, 10) : ''; },
  async build(c, rows, scope) {
    const [people, att] = await Promise.all([rpc('course_people', { p_course: c.id }), Attend.load(c, rows)]);
    const today = this.bkkDay(new Date()), lab = Object.fromEntries(rows.map(r => [r.id, r]));
    const roster = people.filter(p => p.in_roster), came = people.filter(p => p.attended.length);
    const booked = people.filter(p => p.booking), hasRoster = roster.length > 0;
    const absent = booked.filter(p => !p.attended.length).map(p => { const r = lab[p.booking.training_id] || {}, d = this.bkkDay(r.starts_at);
      return { emp_id: p.emp_id, name: p.name, dept: p.dept, round: r.label || '', d,
        state: !d ? 'ยังไม่มา' : d < today ? 'ไม่มา' : d === today ? 'วันนี้ ยังไม่มา' : 'ยังไม่ถึงวันจอง' }; })
      .sort((a, b) => (a.d || '').localeCompare(b.d || '') || a.round.localeCompare(b.round, 'th'));
    const fin = stepOn(c, 'finish') || att.some(a => a.finish_at);
    const summary = { total: roster.length, attended: came.length, percent: roster.length ? Math.round(came.filter(p => p.in_roster).length / roster.length * 1000) / 10 : 0,
      booked: booked.length, bookedAttended: booked.filter(p => p.attended.length).length, notBooked: came.filter(p => !p.booking).length,
      walkin: hasRoster ? came.filter(p => !p.in_roster).length : att.filter(a => a.walk_in).length,
      finish: fin ? came.filter(p => p.attended.some(a => a.finish)).length : null, late: came.filter(p => p.attended.some(a => a.late)).length,
      absentPast: absent.filter(a => a.state === 'ไม่มา').length, absentToday: absent.filter(a => a.state === 'วันนี้ ยังไม่มา').length,
      upcoming: absent.filter(a => a.state === 'ยังไม่ถึงวันจอง').length };
    const D = {}, dr = k => D[k] || (D[k] = { dept: k, target: 0, booked: 0, attended: 0 });
    roster.forEach(p => dr(p.dept || 'ไม่ระบุ').target++);
    booked.forEach(p => dr(p.dept || 'ไม่ระบุ').booked++);
    came.forEach(p => dr(p.dept || 'ไม่ระบุ').attended++);
    const depts = Object.values(D).map(x => ({ ...x, percent: x.target ? Math.round(x.attended / x.target * 1000) / 10 : 0 }))
      .sort((a, b) => hasRoster ? (a.percent - b.percent || b.target - a.target) : (b.attended - a.attended || a.dept.localeCompare(b.dept, 'th')));
    // ใบลงชื่อตามขอบเขต: '' = ทั้งงาน · d:YYYY-MM-DD = วันนั้น · r:<id> = รอบนั้น
    const inScope = a => !scope ? true : scope.startsWith('d:') ? this.bkkDay((lab[a.training_id] || {}).starts_at || a.checkin_at) === scope.slice(2) : a.training_id === scope.slice(2);
    const list = att.filter(a => (a.checkin_at || a.finish_at) && inScope(a))
      .sort((a, b) => ((lab[a.training_id] || {}).round_no || 0) - ((lab[b.training_id] || {}).round_no || 0) || String(a.checkin_at || '').localeCompare(String(b.checkin_at || '')));
    const paths = [...new Set(list.flatMap(a => [a.checkin_sig, a.finish_sig]).filter(x => x && !/^gdrive:/.test(x)))], urls = {};
    for (let i = 0; i < paths.length; i += 100) {
      const { data } = await sb.storage.from('signatures').createSignedUrls(paths.slice(i, i + 100), 4 * 3600);
      (data || []).forEach(d => { if (d.signedUrl) urls[d.path] = d.signedUrl; });
    }
    const sig = (p, k) => !p ? {} : /^gdrive:/.test(p) ? { [k + '_drive']: p.slice(7) } : { [k + '_url']: urls[p] || '' };
    const sheetRows = list.map(a => { const r = lab[a.training_id] || {};
      return { emp_id: a.emp_id, name: a.full_name, dept: a.department, round: r.label || '', when: r.starts_at ? thDate(r.starts_at, { year: 'numeric' }) : a.checkin_at ? thDate(a.checkin_at, { year: 'numeric' }) : '',
               late: a.late, ...sig(a.checkin_sig, 'sig'), ...sig(a.finish_sig, 'fin') }; });
    const sopt = this.scopes(rows).find(x => x[0] === (scope || ''));
    return { asof: new Date().toISOString(), summary, depts, absent: absent.map(({ d, ...x }) => x),
      rounds: rows.map(r => ({ label: r.label, starts_at: r.starts_at, booked: r.booked || 0, attended: r.checkin || 0 })),
      sheet: { label: sopt ? sopt[1] : '', finish: fin, rows: sheetRows } };
  },
  scopes(rows) {
    const days = [...new Set(rows.map(r => this.bkkDay(r.starts_at)).filter(Boolean))].sort();
    return [['', 'ทั้งงาน (ทุกรอบ)']].concat(days.length > 1 ? days.map(d => ['d:' + d, 'วันที่ ' + thDate(d + 'T05:00:00Z', { year: 'numeric', weekday: 'short' })]) : [])
      .concat(rows.map(r => ['r:' + r.id, r.label + (r.starts_at ? ' · ' + thDate(r.starts_at) : '')]));
  },
  dialog(C) {
    const c = C.c, me = (C.user.email || '').toLowerCase(), team = [...new Set([c.owner_email, ...(c.cohosts || [])].filter(Boolean).map(x => x.toLowerCase()))];
    const d = document.createElement('div'); d.className = 'pmodal';
    d.innerHTML = `<form class="box" style="max-width:520px;width:100%;text-align:left;display:grid;gap:12px" autocomplete="off">
      <h3 style="margin:0">✉ ส่งสรุปทางอีเมล</h3>

        <label class="switch"><input type="checkbox" checked disabled> สรุปการเข้าอบรมทั้งงาน (ในเนื้ออีเมล) — อบรมแล้ว/ทั้งหมด/% · เทียบจองกับมาจริง · รายรอบ · รายแผนก · คนที่จองแต่ยังไม่มา</label>
        <label class="switch"><input type="checkbox" id="rp-sum" checked> แนบรายงานสรุป (PDF สำหรับพิมพ์)</label>
        <label class="switch"><input type="checkbox" id="rp-sheet" checked> แนบใบลงชื่อพร้อมลายเซ็น (PDF)</label>
        <select class="inp" id="rp-scope" aria-label="ขอบเขตใบลงชื่อ">${this.scopes(C.rows).map(([v, t]) => `<option value="${esc(v)}">ใบลงชื่อ: ${esc(t)}</option>`).join('')}</select></div>
      <div style="display:grid;gap:4px"><b style="font-size:14px">ส่งถึง</b>
        ${team.map(e => `<label class="switch"><input type="checkbox" data-rpto="${esc(e)}" ${e === me ? 'checked' : ''}> ${esc(e)}${e === me ? ' (คุณ)' : e === (c.owner_email || '').toLowerCase() ? ' (เจ้าของงาน)' : ''}</label>`).join('')}
        <input class="inp" id="rp-more" placeholder="อีเมลอื่น @${esc(CFG.ALLOWED_DOMAIN || '')} (คั่นด้วย , )"></div>
      <p class="hint" style="margin:0" id="rp-msg"></p>
      <div class="row" style="justify-content:flex-end"><button type="button" class="btn light" data-x>ยกเลิก</button><button class="btn sun" id="rp-go">ส่งอีเมล</button></div></form>`;
    document.body.appendChild(d);
    const close = () => d.remove(); d.querySelector('[data-x]').onclick = close; d.onclick = e => { if (e.target === d) close(); };
    const q = s => d.querySelector(s);
    q('#rp-sheet').onchange = () => { q('#rp-scope').disabled = !q('#rp-sheet').checked; };
    q('form').onsubmit = async e => {
      e.preventDefault();
      const dom = (CFG.ALLOWED_DOMAIN || '').toLowerCase();
      const more = q('#rp-more').value.split(/[\s,;]+/).map(x => x.trim().toLowerCase()).filter(Boolean).map(x => x.includes('@') || !dom ? x : x + '@' + dom);
      const to = [...new Set([...[...d.querySelectorAll('[data-rpto]:checked')].map(x => x.dataset.rpto), ...more])];

  roundRow(r, k) {

    if (rounds.some(r => !r.date)) return toast('มีรอบที่ยังไม่มีวันที่', true);

    d.people.forEach(p => { const k = p.emp_id.replace(/^0+/, ''); if (!seen.has(k)) { seen.add(k); people.push(p); } });

    } catch (e) { toast(errMsg(e), true); b.disabled = false; this.goLabel(); }

const Report = {
  async open(arg) {
    setBody('admin');
    const user = await requireStaff(); if (!user) return;
    this.user = user;
    app.innerHTML = adminShell(user, `<div class="center-msg" style="min-height:40vh"><div class="spinner"></div></div>`); bindShell();
    const adm = await sb.rpc('is_admin'); this.isAdmin = adm.data === true;
    const { data, error } = await sb.from('trainings')
      .select('id,title,code,series,series_id,course_id,round_label,round_no,pass_percent,pre_open,post_open,questions,total,survey_id,created_at,owner_id,owner_email')
      .order('created_at', { ascending: false }).limit(300);
    if (error) { toast(errMsg(error), true); return; }
    this.all = data || [];
    arg = decodeURIComponent(arg || '');
    let ids = [];
    if (arg.startsWith('s=')) ids = this.all.filter(t => t.series_id === arg.slice(2)).map(t => t.id);
    else if (arg.startsWith('c=')) ids = this.all.filter(t => t.course_id === arg.slice(2)).map(t => t.id);
    this.course = null;
    if (arg.startsWith('c=')) { const cr = await sb.from('courses').select('id,title').eq('id', arg.slice(2)).maybeSingle(); this.course = cr.data || null; }
    else if (arg.startsWith('ids=')) ids = arg.slice(4).split(',');
    this.sel = new Set(ids.filter(id => this.all.some(t => t.id === id)));
    this.view = ''; this.tab = 'sum'; this.q = '';
    await this.load(); this.render();
    const poll = setInterval(async () => { const n = this.subs.length + this.resp.length; await this.load(); if (this.subs.length + this.resp.length !== n) this.renderBody(); }, 15000);
    onLeave(() => clearInterval(poll));
  },
  chosen() { return sortRounds(this.all.filter(t => this.sel.has(t.id))); },
  // ย้อนกลับ: ทุกรุ่นที่เลือกอยู่ในงานอบรมเดียวกัน → หน้างานอบรม (แท็บรุ่น) · ไม่งั้นหน้าหลัก
  backHref() { const c = this.chosen(), cid = c[0] && c[0].course_id;
    return cid && c.every(t => t.course_id === cid) ? '#course/' + cid : '#admin'; },

  wholeSeries() { const c = this.chosen(), sid = c[0] && c[0].series_id;
    return sid && c.every(t => t.series_id === sid) && this.all.filter(t => t.series_id === sid).length === c.length ? sid : null; },
  async deleteSeries() {
    const sid = this.wholeSeries(); if (!sid) return;

    const nSub = this.subs.filter(s => ids.has(s.training_id)).length, nResp = this.resp.length;

    if (nSub || nResp) {
      const typed = prompt(msg + `\n\nพิมพ์ชื่อชุดให้ตรงเพื่อยืนยัน:\n${name}`);

        fetchAll(() => sb.from('survey_done').select('training_id,emp_id').in('training_id', ids))]);

    const svId = this.commonSurvey(this.chosen());

  pickerHTML() {

         <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 12px;padding-left:24px">${ts.map(item).join('')}</div></div>`).join('')

  renderBody() {
    const box = $('#tbody'); if (!box) return;
    const trs = this.inView(), ids = new Set(trs.map(t => t.id)), many = trs.length > 1;
    const c = prepostCalc(trs, this.subs.filter(s => ids.has(s.training_id)), this.done);

    const tabs = [['sum', 'ภาพรวม'], ['people', 'รายคน'], ['dept', 'รายแผนก'], ['items', 'รายข้อ']].concat(svId ? [['survey', 'แบบประเมิน']] : []);

          <span class="hint">${esc(this.view ? roundName(trs[0]) : (many ? trs.length + ' รอบ' : roundName(trs[0])))} · เกณฑ์ผ่าน ${esc(passTxt)}</span></div></div>
        <div class="dk"><div><span>ทำ Pre-test</span><b>${c.pres.length}</b><small>คน</small></div><div><span>ทำ Post-test</span><b>${c.posts.length}</b><small>คน</small></div>
          <div class="g"><span>ผ่านเกณฑ์แล้ว</span><b>${c.passN}${c.posts.length ? ' / ' + c.posts.length : ''}</b><small>${pPct == null ? 'ยังไม่มีคนทำ Post' : pPct + '% ของคนที่ทำ Post'}</small></div></div>
        <p class="line">ทำครบทั้ง 2 ครั้ง <b>${c.both.length}</b> คน · ผ่านในครั้งแรก <b>${c.passFirstN}</b> คน${svId ? ` · ทำแบบประเมินแล้ว <b>${c.surveyN}</b> / ${c.passN} คน` : ''}</p></div>
        <section class="dsec"><h3><span class="ic">🎯</span> คะแนน</h3>
          <div class="dk"><div class="n"><span>คะแนนเฉลี่ย Pre</span><b>${dash(c.preAvg)}${c.preAvg == null ? '' : '%'}</b></div>
            <div class="b"><span>คะแนนเฉลี่ย Post (ครั้งแรก)</span><b>${dash(c.postAvg)}${c.postAvg == null ? '' : '%'}</b></div>
            <div class="${c.gain == null || c.gain >= 0 ? 'g' : 'r'}"><span>เพิ่มขึ้นเฉลี่ย</span><b>${c.gain == null ? '–' : (c.gain >= 0 ? '+' : '') + c.gain + '%'}</b><small>เฉพาะคนที่ทำครบ</small></div>
            <div class="g"><span>ผ่านเกณฑ์แล้ว</span><b>${c.passN}</b><small>จาก ${c.posts.length} คนที่ทำ Post</small></div>
            <div class="v"><span>ผ่านในครั้งแรก</span><b>${c.passFirstN}</b><small>${c.posts.length ? Math.round(100 * c.passFirstN / c.posts.length) + '%' : ''}</small></div>
            ${svId ? `<div class="y"><span>ทำแบบประเมินแล้ว</span><b>${c.surveyN}</b><small>จาก ${c.passN} คนที่ผ่าน</small></div>` : `<div class="y"><span>ยังไม่ผ่าน</span><b>${Math.max(0, c.posts.length - c.passN)}</b><small>คน</small></div>`}</div></section>
        <section class="dsec alt"><h3><span class="ic">📋</span> เปรียบเทียบรายรอบ</h3>
        <div class="tblwrap"><table class="rep"><tr><th>รอบ</th><th>รหัส</th><th>สถานะ</th><th class="num">Pre (คน)</th><th class="num">Post (คน)</th>
          <th class="num">เฉลี่ย Pre %</th><th class="num">เฉลี่ย Post %</th><th class="num">เพิ่มขึ้น</th><th class="num">ผ่านแล้ว</th><th></th></tr>
          ${c.rounds.map(r => `<tr><td><a href="#" data-view="${r.t.id}">${esc(roundName(r.t))}</a></td><td>${esc(r.t.code)}</td>
            <td>${r.t.pre_open ? '<span class="phase open">Pre</span> ' : ''}${r.t.post_open ? '<span class="phase open">Post</span>' : ''}</td>
            <td class="num">${r.pres.length}</td><td class="num">${r.posts.length}</td><td class="num">${dash(r.preAvg)}</td><td class="num">${dash(r.postAvg)}</td>
            <td class="num">${sgn(r.gain)}</td><td class="num">${r.posts.length ? `${r.passN}/${r.posts.length} (${Math.round(100 * r.passN / r.posts.length)}%)` : '–'}</td>
            <td><a class="btn light sm" href="#training/${r.t.id}">จัดการ</a></td></tr>`).join('')}
          ${many ? `<tr style="font-weight:700"><td>รวม</td><td></td><td></td><td class="num">${c.pres.length}</td><td class="num">${c.posts.length}</td>
            <td class="num">${dash(c.preAvg)}</td><td class="num">${dash(c.postAvg)}</td><td class="num">${sgn(c.gain)}</td>
            <td class="num">${c.posts.length ? `${c.passN}/${c.posts.length} (${Math.round(100 * c.passN / c.posts.length)}%)` : '–'}</td><td></td></tr>` : ''}
        </table></div><p class="hint">แตะชื่อรอบเพื่อดูเฉพาะรอบนั้น · Post ใช้ผลครั้งแรก · “ผ่านแล้ว” ใช้ผลล่าสุด</p></section>`;
      $$('[data-view]', box).forEach(a => a.onclick = e => { e.preventDefault(); this.view = a.dataset.view; $('#view').value = this.view; this.renderBody(); });
    } else if (this.tab === 'people') {
      const k = this.q.toLowerCase(), list = c.rows.filter(r => !k || (r.emp_id + r.name + r.dept + (r.hosp || '') + roundName(r.t)).toLowerCase().includes(k));
      const pre = s => s ? `${s.source === 'game' ? '🎮 ' : ''}${s.score}/${s.total}` : '–';
      box.innerHTML = `<input class="search" id="pq" placeholder="ค้นหารหัส / ชื่อ / แผนก${many ? ' / รอบ' : ''}" value="${esc(this.q)}" style="margin-bottom:10px">
        <div class="tblwrap"><table class="rep"><tr>${many ? '<th>รอบ</th>' : ''}<th>รหัส</th><th>ชื่อ-สกุล</th>${multiH ? '<th>รพ.</th>' : ''}<th>แผนก</th><th class="num">Pre</th>
          <th class="num">Post ครั้งแรก</th><th class="num">Post ล่าสุด</th><th class="num">ครั้ง</th><th class="num">เปลี่ยนแปลง*</th><th>ผล</th>${svId ? '<th>ประเมิน</th>' : ''}</tr>
        ${list.map(r => `<tr>${many ? `<td>${esc(roundName(r.t))}</td>` : ''}<td>${esc(r.emp_id)}</td><td>${esc(r.name)}</td>${multiH ? `<td>${esc(r.hosp || '')}</td>` : ''}<td>${esc(r.dept)}</td>
          <td class="num">${pre(r.pre)}</td><td class="num">${r.post1 ? `${r.post1.score}/${r.post1.total}` : '–'}</td>
          <td class="num">${r.postL ? `${r.postL.score}/${r.postL.total}` : '–'}</td><td class="num">${r.attempts || '–'}</td>
          <td class="num">${r.pre && r.post1 ? sgn(r.post1.score - r.pre.score) : '–'}</td>
          <td>${r.passed == null ? '<span class="hint">ยังไม่ทำ Post</span>' : r.passed ? '<span class="up">ผ่าน</span>' : '<span class="down">ยังไม่ผ่าน</span>'}</td>
          ${svId ? `<td>${r.survey ? '✓' : ''}</td>` : ''}</tr>`).join('')}
        </table></div>${list.length ? `<p class="hint">${list.length} แถว · * เปลี่ยนแปลง = Post ครั้งแรก − Pre · 🎮 = Pre-test จากเกม · ลบ/แก้ผลได้ที่หน้าจัดการของแต่ละรอบ</p>` : '<div class="empty">ไม่มีข้อมูล</div>'}`;
      $('#pq').oninput = e => { this.q = e.target.value; const pos = e.target.selectionStart; this.renderBody(); const el = $('#pq'); el.focus(); el.setSelectionRange(pos, pos); };
    } else if (this.tab === 'dept') {
      const tbl = (list, hospCol, deptCol) => `<div class="tblwrap" style="margin-bottom:12px"><table class="rep"><tr>${hospCol ? '<th>โรงพยาบาล</th>' : ''}${deptCol ? '<th>แผนก</th>' : ''}
        <th class="num">คน</th><th class="num">เฉลี่ย Pre %</th><th class="num">เฉลี่ย Post ครั้งแรก %</th><th class="num">ผ่านแล้ว</th></tr>
        ${list.map(d => `<tr>${hospCol ? `<td>${esc(d.hosp || '(ไม่ระบุ)')}</td>` : ''}${deptCol ? `<td>${esc(d.dept)}</td>` : ''}<td class="num">${d.n}</td><td class="num">${dash(d.pre)}</td>
          <td class="num">${dash(d.post)}</td><td class="num">${d.postN ? `${d.passN}/${d.postN} (${Math.round(100 * d.passN / d.postN)}%)` : '–'}</td></tr>`).join('')}</table></div>`;
      const sorted = [...c.depts].sort((a, b) => a.hosp.localeCompare(b.hosp, 'th') || a.dept.localeCompare(b.dept, 'th'));
      box.innerHTML = c.rows.length ? (multiH ? `<b>รายโรงพยาบาล</b>${tbl(c.hosps, true, false)}<b>รายแผนก</b>` : '') + tbl(sorted, multiH, true) : '<div class="empty">ไม่มีข้อมูล</div>';
    } else if (this.tab === 'items') {
      box.innerHTML = !c.items ? '<div class="empty">รอบที่เลือกใช้ชุดคำถามต่างกัน จึงรวมรายข้อไม่ได้<br>เลือกดูทีละรอบจากช่องด้านบน</div>'
        : `<p class="hint">ใช้ผล Pre และ Post <b>ครั้งแรก</b> · แถวสีแดง = Post ตอบถูกน้อยกว่า 60% ควรทบทวน</p>
        <div class="tblwrap"><table class="rep"><tr><th>ข้อ</th><th>คำถาม</th><th class="num">ถูก Pre %</th><th class="num">ถูก Post %</th><th>ตอบผิดมากสุด (Post)</th></tr>
        ${c.items.map(it => `<tr class="${it.post.pct != null && it.post.pct < 60 ? 'low' : ''}"><td>${it.n}</td>
          <td style="white-space:normal;min-width:220px">${esc(it.text)}</td><td class="num">${dash(it.pre.pct)}</td><td class="num">${dash(it.post.pct)}</td>
          <td style="white-space:normal">${it.post.wrong >= 0 ? `${esc(it.choices[it.post.wrong] || '(รูป)')} (${it.post.wrongN} คน)` : '–'}</td></tr>`).join('')}
        </table></div>` + writesHTML(c.writes, trs.length > 1);
    } else {
      box.innerHTML = `<p class="hint">🔒 ไม่ระบุตัวตน · ผลรวมของ${many ? `ทั้ง ${trs.length} รอบ` : 'รอบนี้'}</p>` + surveyReportHTML(this.svItems || [], this.resp.filter(r => ids.has(r.training_id)));
    }
  },
  async excel() {
    try { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); }
    catch (e) { return toast('โหลดตัวสร้าง Excel ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต', true); }
    const trs = this.inView(), ids = new Set(trs.map(t => t.id)), subs = this.subs.filter(s => ids.has(s.training_id));
    const c = prepostCalc(trs, subs, this.done), X = window.XLSX, wb = X.utils.book_new(), svId = this.commonSurvey(trs);
    const tmap = new Map(trs.map(t => [t.id, t])), dt = v => v ? new Date(v).toLocaleString('th-TH') : '';
    const add = (name, rows) => { const ws = X.utils.aoa_to_sheet(rows); ws['!cols'] = (rows[0] || []).map(() => ({ wch: 16 })); X.utils.book_append_sheet(wb, ws, name); };
    add('สรุป', [['หัวข้อ', 'ค่า'], ['รอบที่รวม', trs.map(roundName).join(', ')], ['จำนวนรอบ', trs.length],
      ['ทำ Pre-test (คน)', c.pres.length], ['ทำ Post-test (คน)', c.posts.length], ['ทำครบ 2 ครั้ง (คน)', c.both.length],
      ['คะแนนเฉลี่ย Pre (%)', c.preAvg ?? ''], ['คะแนนเฉลี่ย Post ครั้งแรก (%)', c.postAvg ?? ''], ['เพิ่มขึ้นเฉลี่ย (%)', c.gain ?? ''],
      ['ผ่านเกณฑ์แล้ว (คน)', c.passN], ['ผ่านในครั้งแรก (คน)', c.passFirstN], ['จำนวนครั้งเฉลี่ยจนผ่าน', c.avgAttempts ?? ''],
      ...(svId ? [['ทำแบบประเมิน (คน)', c.surveyN]] : [])]);
    add('รายรอบ', [['รอบ', 'รหัส', 'เกณฑ์ผ่าน %', 'Pre (คน)', 'Post (คน)', 'ทำครบ (คน)', 'เฉลี่ย Pre %', 'เฉลี่ย Post ครั้งแรก %', 'เพิ่มขึ้น %', 'ผ่าน (คน)', 'ผ่าน %', 'ผ่านครั้งแรก (คน)']]
      .concat(c.rounds.map(r => [roundName(r.t), r.t.code, r.t.pass_percent, r.pres.length, r.posts.length, r.both.length, r.preAvg ?? '', r.postAvg ?? '', r.gain ?? '',
        r.passN, r.posts.length ? Math.round(100 * r.passN / r.posts.length) : '', r.passFirstN])));
    add('รายคน', [['รอบ', 'รหัสพนักงาน', 'ชื่อ-สกุล', 'โรงพยาบาล', 'แผนก', 'Pre คะแนน', 'Pre %', 'Pre ทำแบบ', 'Post ครั้งแรก', 'Post ครั้งแรก %', 'Post ล่าสุด',
      'จำนวนครั้ง', 'เปลี่ยนแปลง (Post1−Pre)', 'ผล', 'ทำแบบประเมิน', 'เวลาส่ง Pre', 'เวลาส่ง Post ล่าสุด']]
      .concat(c.rows.map(r => [roundName(r.t), r.emp_id, r.name, r.hosp || '', r.dept, r.pre ? r.pre.score : '', r.prePct ?? '',
        r.pre ? (r.pre.source === 'game' ? 'เกม' : 'ทำเอง') : '', r.post1 ? r.post1.score : '', r.post1Pct ?? '', r.postL ? r.postL.score : '', r.attempts || '',
        r.pre && r.post1 ? r.post1.score - r.pre.score : '', r.passed == null ? 'ยังไม่ทำ Post' : r.passed ? 'ผ่าน' : 'ยังไม่ผ่าน',
        svId ? (r.survey ? 'ทำแล้ว' : '') : '', dt(r.pre && r.pre.submitted_at), dt(r.postL && r.postL.submitted_at)])));
    add('รายแผนก', [['โรงพยาบาล', 'แผนก', 'จำนวนคน', 'เฉลี่ย Pre %', 'เฉลี่ย Post ครั้งแรก %', 'ผ่าน (คน)', 'ทำ Post (คน)', 'ผ่าน %']]
      .concat(c.depts.map(d => [d.hosp, d.dept, d.n, d.pre ?? '', d.post ?? '', d.passN, d.postN, d.postN ? Math.round(100 * d.passN / d.postN) : ''])));
    if (c.items) add('รายข้อ', [['ข้อ', 'คำถาม', 'คำตอบที่ถูก', 'ถูก Pre %', 'ถูก Post ครั้งแรก %', 'ตอบผิดมากสุด (Post)', 'จำนวน']]
      .concat(c.items.map(it => [it.n, it.text, keyText(it.q), it.pre.pct ?? '', it.post.pct ?? '',
        it.post.wrong >= 0 ? (it.choices[it.post.wrong] || '(รูป)') : '', it.post.wrongN || ''])));
    const maxQ = Math.max(0, ...trs.map(t => (t.questions || []).length));
    add('คำตอบดิบ', [['รอบ', 'ครั้ง', 'สอบครั้งที่', 'รหัสพนักงาน', 'ชื่อ-สกุล', 'โรงพยาบาล', 'แผนก', 'คะแนน', 'เต็ม', ...Array.from({ length: maxQ }, (_, i) => `ข้อ ${i + 1}`)]]
      .concat(subs.map(s => { const t = tmap.get(s.training_id);
        return [roundName(t), s.phase === 'pre' ? (s.source === 'game' ? 'Pre (เกม)' : 'Pre') : 'Post', s.attempt, s.emp_id, s.full_name, s.hospital || '', s.department, s.score, s.total,
          ...s.answers.map((a, i) => ansCell(t.questions[i], a))]; })));
    writesSheet(c.writes, add, trs.length > 1);
    if (svId) surveySheets(X, wb, this.svItems || [], this.resp.filter(r => ids.has(r.training_id)), add);
    const name = trs.length === 1 ? trs[0].title : (trs[0].series || 'รวม ' + trs.length + ' รอบ');
    X.writeFile(wb, `PrePost-${name}-${new Date().toISOString().slice(0, 10)}.xlsx`.replace(/[\\/:*?"<>|]/g, '_'));
  }

// qrDesign: สุ่มแบบใหม่ (หรือใช้แบบเดิมที่ส่งมา) แล้ววาดลงกล่อง el · ใช้ทั้งหน้าจอนี้และหน้าต่างพิมพ์ (ส่งต่อเป็นข้อความโค้ด)
function qrDesign(el, o, keep) {
  var P = [
    { bg: ['#0a4f8c', '#185d9b', '#2b86c9'], ink: '#fff', sub: '#cfe8fb', acc: '#f7bb1a', deco: ['#63bff5', '#f7bb1a', '#ffffff'] },
    { bg: ['#e8f5fe', '#d4ecfd', '#ffffff'], ink: '#0f4f86', sub: '#3b6f9e', acc: '#f7bb1a', deco: ['#63bff5', '#185d9b', '#f7bb1a'] },
    { bg: ['#f7bb1a', '#ffd25a', '#fff1c2'], ink: '#0a3a66', sub: '#5b4a10', acc: '#185d9b', deco: ['#ffffff', '#185d9b', '#63bff5'] },
    { bg: ['#0b2f55', '#0f4f86', '#185d9b'], ink: '#fff', sub: '#bfe0f8', acc: '#63bff5', deco: ['#f7bb1a', '#63bff5', '#ffffff'] },
    { bg: ['#ffffff', '#f3f9fe', '#e6f3fd'], ink: '#10263f', sub: '#4a6178', acc: '#185d9b', deco: ['#f7bb1a', '#63bff5', '#185d9b'] },
    { bg: ['#63bff5', '#3aa6e8', '#185d9b'], ink: '#fff', sub: '#e6f5fe', acc: '#f7bb1a', deco: ['#ffffff', '#f7bb1a', '#0f4f86'] }

    if (kind === 'plus') for (i = 0; i < 10; i++) { x = rnd(0, 200); y = rnd(0, 290); z = rnd(8, 26);
      s += '<g fill="' + c[i % 3] + '" opacity="' + rnd(.1, .3).toFixed(2) + '" transform="rotate(' + rnd(-15, 15).toFixed(1) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1) + ')"><rect x="' + (x - z / 6).toFixed(1) + '" y="' + (y - z / 2).toFixed(1) + '" width="' + (z / 3).toFixed(1) + '" height="' + z.toFixed(1) + '" rx="' + (z / 8).toFixed(1) + '"/><rect x="' + (x - z / 2).toFixed(1) + '" y="' + (y - z / 6).toFixed(1) + '" width="' + z.toFixed(1) + '" height="' + (z / 3).toFixed(1) + '" rx="' + (z / 8).toFixed(1) + '"/></g>'; }
    if (kind === 'waves') for (i = 0; i < 4; i++) { y = rnd(200, 290); z = rnd(6, 16);
      s += '<path d="M0 ' + y.toFixed(1) + ' Q 52 ' + (y - z).toFixed(1) + ' 105 ' + y.toFixed(1) + ' T 210 ' + y.toFixed(1) + ' V 297 H 0 Z" fill="' + c[i % 3] + '" opacity="' + (0.12 + i * 0.05).toFixed(2) + '"/>'; }
    if (kind === 'dots') { var g = rnd(9, 14), col = c[Math.floor(rnd(0, 3))]; for (y = 4; y < 297; y += g) for (x = 4; x < 210; x += g) s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="0.9" fill="' + col + '" opacity=".35"/>'; }
    if (kind === 'stripes') { var ang = rnd(20, 60).toFixed(0); for (i = -300; i < 520; i += rnd(14, 26)) s += '<rect x="' + i.toFixed(1) + '" y="-200" width="' + rnd(3, 9).toFixed(1) + '" height="700" fill="' + c[Math.floor(rnd(0, 3))] + '" opacity="' + rnd(.08, .2).toFixed(2) + '" transform="rotate(' + ang + ' 105 148)"/>'; }
    if (kind === 'rings') for (i = 0; i < 7; i++) s += '<circle cx="' + rnd(-20, 230).toFixed(1) + '" cy="' + rnd(-20, 320).toFixed(1) + '" r="' + rnd(20, 70).toFixed(1) + '" fill="none" stroke="' + c[i % 3] + '" stroke-width="' + rnd(1.5, 5).toFixed(1) + '" opacity="' + rnd(.12, .3).toFixed(2) + '"/>';

  }

    var pi = pick(P.length, last.p), li = pick(LAY.length, last.l), di = pick(DECO.length, last.d);
    try { sessionStorage.setItem('qrposter.last', JSON.stringify({ p: pi, l: li, d: di })); } catch (e) {}
    d = { p: pi, l: li, d: di, ang: Math.floor(rnd(100, 200)), svg: deco(DECO[di], P[pi].deco) };
  }
  var p = P[d.p], lay = LAY[d.l];

  var inner = (o.logo ? '<div class="lg"><img src="' + o.logo + '" alt=""></div>' : '') +
    '<div class="tag" style="background:' + p.acc + ';color:' + tagInk + '">สแกน QR Code</div>' +
    '<h1 style="color:' + p.ink + '">' + esc(o.title) + '</h1>' +
    '<div class="qr">' + (o.qr ? '<img src="' + o.qr + '" alt="QR Code">' : '') + '</div>' +
    '<div class="url" style="color:' + p.ink + '">' + esc(o.short) + '</div>' +
    '<div class="ft" style="color:' + p.sub + '">' + (o.foot || 'Quiz Live PLPN · ใช้กล้องมือถือสแกนได้ทันที') + '</div>';
  var ex = lay === 'band' ? '<div class="band" style="background:' + p.acc + '"></div>' : lay === 'side' ? '<div class="side" style="background:' + p.acc + '"></div>'
    : lay === 'frame' ? '<div class="frame" style="border-color:' + p.acc + '"></div>' : '';
  el.style.background = 'linear-gradient(' + d.ang + 'deg,' + p.bg[0] + ' 0%,' + p.bg[1] + ' 55%,' + p.bg[2] + ' 100%)';
  el.innerHTML = d.svg + ex + '<div class="col' + (lay === 'side' ? ' sd' : '') + '">' + inner + '</div>';

}
function qrImage(link, size) {
  const box = document.createElement('div'); box.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(box);
  try { new QRCode(box, { text: link, width: size, height: size, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
  const cv = box.querySelector('canvas'), im = box.querySelector('img');
  const url = cv ? cv.toDataURL('image/png') : im ? im.src : '';
  box.remove(); return url;
}
