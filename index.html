      <div class="chips" id="chips"></div></div>`;
    this.bindTop();
    try { new QRCode($('#qr'), { text: url, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M }); }
    catch (e) { $('#qr').textContent = url; }
    $('#start').onclick = () => this.next();
    $('#chips').onclick = async e => {
      const c = e.target.closest('[data-pid]'); if (!c) return;
      if (!confirm(`นำ “${c.dataset.name}” ออกจากห้อง?`)) return;
      try { await rpc('host_kick', { p_player: c.dataset.pid }); this.players.delete(c.dataset.pid); this.onPlayers(); }
      catch (err) { toast(errMsg(err), true); }
    };
    this.onPlayers();
  },
  onPlayers() {
    if (this.phase !== 'lobby') return this.onAnswers();
    const box = $('#chips'); if (!box) return;
    const have = new Set($$('[data-pid]', box).map(c => c.dataset.pid));
    $$('[data-pid]', box).forEach(c => { if (!this.players.has(c.dataset.pid)) c.remove(); });
    for (const p of this.players.values()) if (!have.has(p.id))
      box.insertAdjacentHTML('beforeend', `<button class="chip" data-pid="${p.id}" data-name="${esc(p.nickname)}">${avatarHTML(p.avatar, p.nickname)}${esc(p.nickname)}</button>`);
    $('#pc').textContent = this.players.size;
    $('#start').disabled = this.players.size === 0;
  },

  async next() {
    $$('.stg button').forEach(b => b.disabled = true);
    try {
      const r = await rpc('host_next', { p_session: this.sid });
      if (r.status === 'ended') { this.s.status = 'ended'; this.phase = 'ended'; await this.loadPlayers(); }
      else {
        Object.assign(this.s, { status: 'question', current_index: r.index });
        this.deadline = Date.now() + r.remaining * 1000; this.answers = new Map(); this.revealing = false; this.phase = 'question';
      }
      this.broadcast(); this.render();
    } catch (e) { toast(errMsg(e), true); this.render(); }
  },
  rQuestion() {
    const q = this.q();
    app.innerHTML = `<div class="stg">${this.topbar(`<span class="pill">ข้อ ${this.s.current_index + 1} / ${this.s.total_questions}</span>
        <span class="pill" id="ac">ตอบแล้ว 0/${this.players.size}</span>`)}
      <div class="qwrap"><div class="qline"><div class="timer" id="tm"><span>${q.time}</span></div>
        <h1 class="qtext">${esc(q.text)}</h1></div>
        ${q.image_url ? `<img class="qimgbig" src="${esc(q.image_url)}" alt="">` : ''}
        <div class="tiles ${hasImgs(q.images) ? 'imgs' : ''}">${q.choices.map((c, i) => `<div class="tile" style="${chipStyle(q.colors, i)}"><b><span>${LETTERS[i]}</span></b>${choiceBody(c, imgAt(q.images, i))}</div>`).join('')}</div>
        <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="rv">เฉลยเลย (ไม่รอเวลา)</button></div></div></div>`;
    this.bindTop();
    $('#rv').onclick = () => this.reveal();
    this.onAnswers(); this.tick();
  },
  onAnswers() {
    // ไม่เฉลยก่อนหมดเวลา แม้ทุกคนตอบครบแล้ว (ผู้จัดกด "เฉลยเลย" เองได้)
    const el = $('#ac'); if (!el) return;
    const all = this.players.size > 0 && this.answers.size >= this.players.size;
    el.textContent = all ? `✓ ตอบครบทุกคนแล้ว (${this.answers.size})` : `ตอบแล้ว ${this.answers.size}/${this.players.size}`;
    el.classList.toggle('sun', all);
  },
  tick() {
    if (this.phase !== 'question') return;
    const q = this.q(), left = Math.max(0, (this.deadline - Date.now()) / 1000), tm = $('#tm');
    if (tm) { tm.style.setProperty('--p', (100 * left / q.time) + '%'); tm.firstChild.textContent = Math.ceil(left);
      tm.classList.toggle('low', left > 0 && left <= 5); }
    if (left <= 0 && !this.revealing) { this.revealing = true; setTimeout(() => this.reveal(), 1300); }
  },
  async reveal() {
    if (this.phase !== 'question') return;
    this.revealing = true;
    const b = $('#rv'); if (b) b.disabled = true;
    this.prev = new Map([...this.players.values()].map(p => [p.id, p.score]));
    try {
      await rpc('host_reveal', { p_session: this.sid });
      await Promise.all([this.loadAnswers(), this.loadPlayers()]);
      this.s.status = 'reveal'; this.phase = 'board'; this.broadcast(); this.render();
    } catch (e) { toast(errMsg(e), true); this.revealing = false; if (b) b.disabled = false; }
  },
  rReveal() {
    const q = this.q(), counts = q.choices.map(() => 0);
    for (const c of this.answers.values()) if (counts[c] !== undefined) counts[c]++;
    const total = this.answers.size, right = counts[q.correct] || 0, max = Math.max(1, ...counts);
    app.innerHTML = `<div class="stg">${this.topbar(`<span class="pill">ข้อ ${this.s.current_index + 1} / ${this.s.total_questions}</span>`)}
      <div class="qwrap"><h1 class="qtext">${esc(q.text)}</h1>
        <div class="tiles ${hasImgs(q.images) ? 'imgs' : ''}">${q.choices.map((c, i) => `<div class="tile ${i === q.correct ? 'correct' : 'dim'}" style="${chipStyle(q.colors, i)}">
          <i class="fill" data-w="${100 * counts[i] / max}"></i><b><span>${LETTERS[i]}</span></b>
          ${choiceBody(c, imgAt(q.images, i))}<span class="cnt">${counts[i]}</span></div>`).join('')}</div>
        <p class="sumline">ตอบถูก <b>${right}</b> จาก ${this.players.size} คน${total < this.players.size ? ` · ไม่ทันตอบ ${this.players.size - total} คน` : ''}</p>
        <div class="row" style="justify-content:flex-end"><button class="btn sun lg" id="tb">ดูอันดับคะแนน →</button></div></div></div>`;
    this.bindTop();
    requestAnimationFrame(() => requestAnimationFrame(() => $$('.fill').forEach(f => f.style.width = f.dataset.w + '%')));
    $('#tb').onclick = () => { this.phase = 'board'; this.render(); };
  },
  // แถบเฉลยบนหน้าสรุปคะแนน: คำตอบที่ถูก + จำนวนคนตอบถูก
  answerBar() {
    const q = this.q(); if (!q) return '';
    let right = 0; for (const c of this.answers.values()) if (c === q.correct) right++;
    const img = imgAt(q.images, q.correct);
    return `<div class="ansbar"><span class="lbl">เฉลยข้อ ${this.s.current_index + 1}</span>
      <span class="anschip" style="${chipStyle(q.colors, q.correct)}"><b>${LETTERS[q.correct]}</b>
        ${img ? `<img src="${esc(img)}" alt="">` : ''}${q.choices[q.correct] ? `<span>${esc(q.choices[q.correct])}</span>` : ''}</span>
      <span class="lbl">ตอบถูก <b>${right}</b> จาก ${this.players.size} คน</span></div>`;
  },
  rBoard() {
    const last = this.s.current_index + 1 >= this.s.total_questions;
    const now = this.sorted(), before = this.sorted(p => this.prev.has(p.id) ? this.prev.get(p.id) : p.score - p.last_points);
    const prevRank = new Map(before.map((p, i) => [p.id, i]));
    const show = now.slice(0, 10), max = Math.max(1, now[0] ? now[0].score : 1);
    app.innerHTML = `<div class="stg">${this.topbar(`<span class="pill">หลังข้อ ${this.s.current_index + 1} / ${this.s.total_questions}</span>`)}
      <div class="board">${this.answerBar()}<h1>อันดับคะแนน</h1>
        <div class="lb" id="lb" style="height:calc(var(--row) * ${Math.max(1, show.length)})">${show.map(p => {
          const from = Math.min(prevRank.get(p.id) ?? 10, 10), old = p.score - p.last_points;
          return `<div class="lbrow" data-id="${p.id}" style="transform:translateY(calc(var(--row) * ${from}));opacity:${from >= 10 ? 0 : 1}">
            <span class="rk">${from + 1}</span>
            <div class="bar"><i style="width:${Math.max(4, 100 * old / max)}%"></i>
              <span class="nm">${avatarHTML(p.avatar, p.nickname)}<span>${esc(p.nickname)}</span></span>
              <span class="sc">${p.last_points ? `<span class="plus">+${fmt(p.last_points)}</span>` : ''}<span class="num" data-from="${old}" data-to="${p.score}">${fmt(old)}</span></span></div></div>`; }).join('')}</div>
        ${now.length > 10 ? `<p class="sumline" style="opacity:.7">และอีก ${now.length - 10} คน · ทุกคนดูอันดับตัวเองได้บนมือถือ</p>` : ''}
        <div class="row" style="justify-content:flex-end;margin-top:auto">
          <button class="btn sun lg" id="nx">${last ? 'ดูผลสุดท้าย 🏆' : 'ข้อถัดไป →'}</button></div></div></div>`;
    this.bindTop();
    $('#nx').onclick = () => this.next();
    setTimeout(() => {
      show.forEach((p, i) => {
        const row = $(`.lbrow[data-id="${p.id}"]`); if (!row) return;
        row.style.transform = `translateY(calc(var(--row) * ${i}))`; row.style.opacity = 1;
        row.className = 'lbrow go' + (i < 3 ? ' top' + (i + 1) : '');
        $('.rk', row).textContent = i + 1;
        $('.bar i', row).style.width = Math.max(4, 100 * p.score / max) + '%';
        countUp($('.num', row));
      });
    }, 500);
  },
  async rEnded() {
    const list = this.sorted(), pods = [list[1], list[0], list[2]], cls = ['p2', 'p1', 'p3'], rank = [2, 1, 3];
    app.innerHTML = `<div class="stg">${this.topbar()}
      <div class="board"><h1>🏆 สรุปผล</h1>
        <div class="podium">${pods.map((p, i) => p ? `<div class="pod ${cls[i]}">${avatarHTML(p.avatar, p.nickname, 'xl')}<div class="nm">${esc(p.nickname)}</div>
          <div class="sc">${fmt(p.score)} คะแนน</div><div class="block">${rank[i]}</div></div>` : '').join('')}</div>
        ${list.length > 3 ? `<div class="rest">${list.slice(3, 30).map((p, i) => `<span>${avatarHTML(p.avatar, p.nickname, 'sm')}${i + 4}. ${esc(p.nickname)} · ${fmt(p.score)}</span>`).join('')}</div>` : ''}
        <div class="row" style="justify-content:flex-end;margin-top:12px">
          <button class="btn ghost" id="csv">⬇ ดาวน์โหลดผล (CSV)</button>
          <a class="btn sun" href="#admin">กลับหน้าผู้จัด</a></div></div></div>`;
    this.bindTop();
    $('#csv').onclick = () => this.csv();
  },
  async csv() {
    const { data } = await sb.from('answers').select('player_id,is_correct').eq('session_id', this.sid);
    const right = new Map(); (data || []).forEach(a => { if (a.is_correct) right.set(a.player_id, (right.get(a.player_id) || 0) + 1); });
    const q = v => `"${String(v).replace(/"/g, '""')}"`;
    const rows = [['อันดับ', 'ชื่อ', 'คะแนน', 'ตอบถูก', 'จำนวนข้อ'].map(q).join(',')]
      .concat(this.sorted().map((p, i) => [i + 1, p.nickname, p.score, right.get(p.id) || 0, this.s.total_questions].map(q).join(',')));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + rows.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
    a.download = `ผลเกม-${this.s.title}-${new Date().toISOString().slice(0, 10)}.csv`.replace(/[\\/:*?"<>|]/g, '_');
    document.body.appendChild(a); a.click(); a.remove();
  }
};

// =====================================================================
// แบบทดสอบ Pre-test / Post-test — ฝั่งผู้ทำ (มือถือ ไม่ต้องล็อกอิน)  ลิงก์: ?t=รหัส 6 หลัก
// =====================================================================
const PHASE_TH = { pre: 'Pre-test (ก่อนอบรม)', post: 'Post-test (หลังอบรม)' };
const Test = {
  async start(code) {
    setBody('player test');
    this.code = code;
    app.innerHTML = `<div class="center-msg"><div class="spinner"></div></div>`;
    try { this.info = await rpc('test_info', { p_code: code }); }
    catch (e) {
      app.innerHTML = `<div class="center-msg"><div class="box"><h2>${esc(errMsg(e))}</h2>
        <a class="btn" href="./">กลับหน้าแรก</a></div></div>`;
      return;
    }
    this.intro();
  },
  head() {
    const i = this.info;
    return `<header class="tst-head"><div class="brand">${brandHTML()}</div>
      ${i.cover_url ? `<img src="${esc(i.cover_url)}" alt="">` : ''}
      <h1>${esc(i.title)}</h1>
      <div class="row" style="gap:6px"><span class="phase ${i.pre_open ? 'open' : ''}">${i.pre_open ? '●' : '○'} Pre-test ${i.pre_open ? 'เปิดรับ' : 'ปิด'}</span>
        <span class="phase ${i.post_open ? 'open' : ''}">${i.post_open ? '●' : '○'} Post-test ${i.post_open ? 'เปิดรับ' : 'ปิด'}</span>
        <span class="phase">${i.total} ข้อ</span></div></header>`;
  },
  intro() {
    const i = this.info, me = load('quizlive.tester') || {};
    if (!i.pre_open && !i.post_open) {
      app.innerHTML = `<main class="tst">${this.head()}<div class="tcard" style="text-align:center">
        <p style="margin:0">ยังไม่เปิดรับแบบทดสอบ<br>รอผู้จัดเปิดแล้วกดรีเฟรช</p>
        <button class="btn" id="rf">รีเฟรช</button></div></main>`;
      $('#rf').onclick = () => this.start(this.code);
      return;
    }
    const phase = i.pre_open && !i.post_open ? 'pre' : !i.pre_open && i.post_open ? 'post' : (me.lastPre === this.code ? 'post' : 'pre');
    const depts = i.departments || [];
    app.innerHTML = `<main class="tst">${this.head()}
      <form class="tcard" id="tf" autocomplete="off">
        <div class="seg">${['pre', 'post'].map(ph => `<label><input type="radio" name="ph" value="${ph}" ${ph === phase ? 'checked' : ''}
          ${i[ph + '_open'] ? '' : 'disabled'}>${ph === 'pre' ? 'Pre-test<br><small>ก่อนอบรม</small>' : 'Post-test<br><small>หลังอบรม</small>'}</label>`).join('')}</div>
        <div class="fld"><label for="t-emp">รหัสพนักงาน *</label><input class="inp" id="t-emp" maxlength="30" value="${esc(me.emp_id || '')}" autocapitalize="characters"></div>
        <div class="fld"><label for="t-name">ชื่อ-นามสกุล *</label><input class="inp" id="t-name" maxlength="120" value="${esc(me.name || '')}"></div>
        <div class="fld"><label for="t-dept">แผนก *</label>${depts.length
          ? `<select class="inp" id="t-dept"><option value="">— เลือกแผนก —</option>${depts.map(d => `<option ${d === me.dept ? 'selected' : ''}>${esc(d)}</option>`).join('')}</select>`
          : `<input class="inp" id="t-dept" maxlength="120" value="${esc(me.dept || '')}">`}</div>
        <button class="btn sun lg">เริ่มทำแบบทดสอบ</button>
        <p class="hint" style="text-align:center">ตอบให้ครบทุกข้อแล้วกดส่ง · ส่งได้ครั้งเดียวต่อรอบ</p>
      </form></main>`;
    $('#tf').onsubmit = ev => {
      ev.preventDefault();
      const who = { emp_id: $('#t-emp').value.trim().toUpperCase(), name: $('#t-name').value.trim(), dept: $('#t-dept').value.trim() };
      if (!who.emp_id || !who.name || !who.dept) return toast('กรุณากรอกรหัสพนักงาน ชื่อ และแผนกให้ครบ', true);
      save('quizlive.tester', { ...me, ...who });
      this.who = who; this.phase = $('input[name=ph]:checked').value;
      this.questions();
    };
  },
  draftKey() { return `quizlive.draft.${this.code}.${this.phase}.${this.who.emp_id}`; },
  questions() {
    const qs = this.info.questions || [];
    this.ans = load(this.draftKey()) || qs.map(() => null);
    if (this.ans.length !== qs.length) this.ans = qs.map(() => null);
    app.innerHTML = `<main class="tst">
      <div class="row" style="justify-content:space-between"><span class="phase ${this.phase}">${PHASE_TH[this.phase]}</span>
        <span class="hint">${esc(this.who.name)} · ${esc(this.who.dept)}</span></div>
      ${qs.map((q, n) => `<section class="tq" id="tq${n}"><div class="qn">ข้อ ${n + 1} / ${qs.length}</div>
        <h3>${esc(q.text)}</h3>${q.image_url ? `<img class="qimg" src="${esc(q.image_url)}" alt="">` : ''}
        <div class="opts2 ${hasImgs(q.images) ? 'imgs' : ''}">${q.choices.map((c, i) =>
          `<button type="button" class="tch" data-q="${n}" data-i="${i}"><b style="${chipStyle(q.colors, i)}">${LETTERS[i]}</b>${choiceBody(c, imgAt(q.images, i))}</button>`).join('')}</div>
      </section>`).join('')}</main>
      <div class="tbar2"><div class="in"><div class="prog" id="prog"></div><button class="btn sun" id="send">ส่งคำตอบ</button></div></div>`;
    app.onclick = e => {
      const b = e.target.closest('.tch[data-q]'); if (!b) return;
      this.ans[+b.dataset.q] = +b.dataset.i; save(this.draftKey(), this.ans); this.mark();
    };
    $('#send').onclick = () => this.send();
    onLeave(() => { app.onclick = null; });
    this.mark();
  },
  mark() {
    $$('.tch[data-q]').forEach(b => b.classList.toggle('on', this.ans[+b.dataset.q] === +b.dataset.i));
    const done = this.ans.filter(a => a !== null).length, n = this.ans.length;
    $('#prog').innerHTML = `ตอบแล้ว <b>${done}</b> / ${n}<i><span style="width:${100 * done / n}%"></span></i>`;
  },
  async send() {
    const miss = this.ans.findIndex(a => a === null);
    if (miss >= 0) { toast(`ยังไม่ได้ตอบข้อ ${miss + 1}`, true); $('#tq' + miss).scrollIntoView({ behavior: 'smooth' }); return; }
    if (!confirm(`ส่งคำตอบ ${PHASE_TH[this.phase]}? ส่งแล้วแก้ไขไม่ได้`)) return;
    const b = $('#send'); b.disabled = true; b.textContent = 'กำลังส่ง…';
    try {
      const r = await rpc('submit_test', { p_code: this.code, p_phase: this.phase, p_emp_id: this.who.emp_id,
        p_name: this.who.name, p_dept: this.who.dept, p_answers: this.ans });
      save(this.draftKey());
      if (this.phase === 'pre') save('quizlive.tester', { ...(load('quizlive.tester') || {}), lastPre: this.code });
      this.result(r);
    } catch (e) { toast(errMsg(e), true); b.disabled = false; b.textContent = 'ส่งคำตอบ'; }
  },
  result(r) {
    window.scrollTo(0, 0);
    if (r.phase === 'pre') {
      app.innerHTML = `<main class="tst">${this.head()}<div class="tcard" style="text-align:center">
        <div style="font-size:56px">✅</div><h2 style="margin:0">ส่ง Pre-test เรียบร้อย</h2>
        <p style="margin:0;color:var(--muted)">ขอบคุณครับ หลังอบรมเสร็จ สแกน QR เดิม (หรือเปิดลิงก์เดิม) เพื่อทำ Post-test</p></div></main>`;
      return;
    }
    const qs = this.info.questions, diff = r.pre_score == null ? null : r.score - r.pre_score;
    app.innerHTML = `<main class="tst">${this.head()}
      <div class="tcard"><div class="score-big">${r.score}<small> / ${r.total}</small></div>
        <div style="text-align:center;font-size:20px;font-weight:600">${r.percent}%</div>
        <span class="passbadge ${r.pass ? 'ok' : 'no'}">${r.pass ? '🎉 ผ่านเกณฑ์' : 'ยังไม่ผ่านเกณฑ์'} (${r.pass_percent}%)</span>
        ${diff == null ? '' : `<p style="margin:0;text-align:center">ก่อนอบรม ${r.pre_score} → หลังอบรม ${r.score}
          <span class="${diff >= 0 ? 'up' : 'down'}">(${diff >= 0 ? '+' : ''}${diff})</span></p>`}</div>
      <h3 style="margin:18px 4px 0">เฉลย</h3>
      ${qs.map((q, n) => { const my = this.ans[n], ok = r.correct[n];
        return `<section class="tq"><div class="qn">ข้อ ${n + 1} ${my === ok ? '<span class="up">✓ ถูก</span>' : '<span class="down">✗ ผิด</span>'}</div>
        <h3>${esc(q.text)}</h3>
        <div class="opts2 ${hasImgs(q.images) ? 'imgs' : ''}">${q.choices.map((c, i) => (i === ok || i === my) ?
          `<div class="tch ${i === ok ? 'right' : 'wrong'}"><b style="${chipStyle(q.colors, i)}">${LETTERS[i]}</b>${choiceBody(c, imgAt(q.images, i))}
            <span class="mk">${i === ok ? '✓ เฉลย' : 'คุณตอบ'}</span></div>` : '').join('')}</div></section>`; }).join('')}
      </main>`;
  }
};

// =====================================================================
// จัดการรอบ Pre/Post + รายงาน (ผู้จัด)
// =====================================================================
const Training = {
  async open(id) {
    setBody('admin');
    const user = await requireStaff(); if (!user) return;
    this.user = user; this.id = id; this.tab = this.tab || 'sum'; this.q = '';
    app.innerHTML = adminShell(user, `<div class="center-msg" style="min-height:40vh"><div class="spinner"></div></div>`); bindShell();
    const { data: t, error } = await sb.from('trainings').select('*').eq('id', id).single();
    if (error || !t) { toast('ไม่พบรอบนี้ หรือไม่มีสิทธิ์', true); location.hash = '#admin'; return; }
    this.t = t;
    await this.loadSubs();
    this.render();
    const poll = setInterval(async () => { const n = this.subs.length; await this.loadSubs(); if (this.subs.length !== n) this.renderBody(); }, 8000);
    onLeave(() => clearInterval(poll));
  },
  async loadSubs() {
    const { data } = await sb.from('test_submissions').select('*').eq('training_id', this.id).order('submitted_at');
    if (data) this.subs = data;
  },
  link() { return Host.joinBase() + '?t=' + this.t.code; },
  render() {
    const t = this.t;
    app.innerHTML = adminShell(this.user, `
      <div class="row"><a class="btn light sm" href="#admin">← กลับ</a><h2 class="sec grow">${esc(t.title)}</h2></div>
      <div class="tcard">
        <div class="trow"><span class="phase">รหัส ${esc(t.code)}</span><span class="hint">${t.total} ข้อ · เกณฑ์ผ่าน</span>
          <input class="inp" id="pass" type="number" min="0" max="100" value="${t.pass_percent}" style="width:80px;padding:6px 8px"> %</div>
        <div class="linkbox"><span class="grow">${esc(this.link().replace(/^https?:\/\//, ''))}</span>
          <button class="btn light sm" id="copy">คัดลอก</button><button class="btn sm" id="bigqr">แสดง QR เต็มจอ</button></div>
        <label class="switch"><input type="checkbox" id="sw-pre" ${t.pre_open ? 'checked' : ''}> <span>รับคำตอบ <b>Pre-test</b> (ก่อนอบรม)</span></label>
        <label class="switch"><input type="checkbox" id="sw-post" ${t.post_open ? 'checked' : ''}> <span>รับคำตอบ <b>Post-test</b> (หลังอบรม)</span></label>
        <p class="hint">ใช้ลิงก์/QR เดียวกันทั้งก่อนและหลังอบรม ระบบเลือก Pre หรือ Post ให้ตามที่เปิดไว้</p>
      </div>
      <div class="row" style="margin-top:16px">
        <div class="tabs">${[['sum', 'ภาพรวม'], ['people', 'รายคน'], ['dept', 'รายแผนก'], ['items', 'รายข้อ']].map(([k, v]) =>
          `<button data-tab="${k}" class="${this.tab === k ? 'on' : ''}">${v}</button>`).join('')}</div>
        <span class="grow"></span><button class="btn light sm" id="xls">⬇ ส่งออก Excel</button></div>
      <div id="tbody" style="margin-top:12px"></div>
      <div style="margin-top:28px;text-align:right"><button class="btn danger sm" id="deltr">ลบรอบนี้</button></div>`);
    bindShell();
    $('#copy').onclick = async () => { try { await navigator.clipboard.writeText(this.link()); toast('คัดลอกลิงก์แล้ว'); } catch (e) { toast(this.link()); } };
    $('#bigqr').onclick = () => this.bigQR();
    const upd = async (patch, el) => {
      const { error } = await sb.from('trainings').update(patch).eq('id', this.id);
      if (error) { toast(errMsg(error), true); if (el) el.checked = !el.checked; return; }
      Object.assign(this.t, patch); toast('บันทึกแล้ว');
    };
    $('#sw-pre').onchange = e => upd({ pre_open: e.target.checked }, e.target);
    $('#sw-post').onchange = e => upd({ post_open: e.target.checked }, e.target);
    $('#pass').onchange = e => { const v = Math.max(0, Math.min(100, +e.target.value || 0)); e.target.value = v; upd({ pass_percent: v }).then(() => this.renderBody()); };
    $$('[data-tab]').forEach(b => b.onclick = () => { this.tab = b.dataset.tab; $$('[data-tab]').forEach(x => x.classList.toggle('on', x === b)); this.renderBody(); });
    $('#xls').onclick = () => this.excel();
    $('#deltr').onclick = async () => {
      if (!confirm(`ลบรอบ “${t.title}” และผลแบบทดสอบทั้งหมด? กู้คืนไม่ได้`)) return;
      const { error } = await sb.from('trainings').delete().eq('id', this.id);
      if (error) return toast(errMsg(error), true);
      location.hash = '#admin';
    };
    this.renderBody();
  },
  // ---------- คำนวณรายงาน ----------
  calc() {
    const t = this.t, pass = t.pass_percent, pct = s => s ? Math.round(100 * s.score / s.total) : null;
    const people = new Map();
    for (const s of this.subs) {
      const p = people.get(s.emp_id) || { emp_id: s.emp_id, name: s.full_name, dept: s.department };
      p[s.phase] = s; if (s.phase === 'post' || !p.name) { p.name = s.full_name; p.dept = s.department; }
      people.set(s.emp_id, p);
    }
    const rows = [...people.values()].map(p => ({ ...p, prePct: pct(p.pre), postPct: pct(p.post),
      passed: p.post ? pct(p.post) >= pass : null }))
      .sort((a, b) => a.dept.localeCompare(b.dept, 'th') || a.name.localeCompare(b.name, 'th'));
    const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : null;
    const pres = rows.filter(r => r.pre), posts = rows.filter(r => r.post), both = rows.filter(r => r.pre && r.post);
    const depts = [...new Set(rows.map(r => r.dept))].map(d => {
      const rs = rows.filter(r => r.dept === d), po = rs.filter(r => r.post);
      return { dept: d || '(ไม่ระบุ)', n: rs.length, pre: avg(rs.filter(r => r.pre).map(r => r.prePct)),
               post: avg(po.map(r => r.postPct)), passN: po.filter(r => r.passed).length, postN: po.length };
    });
    const items = t.questions.map((q, i) => {
      const f = ph => { const ss = this.subs.filter(s => s.phase === ph); if (!ss.length) return { pct: null, top: null };
        const cnt = q.choices.map(() => 0); ss.forEach(s => { const a = s.answers[i]; if (cnt[a] !== undefined) cnt[a]++; });
        let wrong = -1; cnt.forEach((c, k) => { if (k !== q.correct && c > 0 && (wrong < 0 || c > cnt[wrong])) wrong = k; });
        return { pct: Math.round(100 * cnt[q.correct] / ss.length), wrong, wrongN: wrong >= 0 ? cnt[wrong] : 0 }; };
      return { n: i + 1, text: q.text, correct: q.correct, choices: q.choices, pre: f('pre'), post: f('post') };
    });
    return { rows, pres, posts, both, depts, items, avg,
      preAvg: avg(pres.map(r => r.prePct)), postAvg: avg(posts.map(r => r.postPct)),
      gain: both.length ? avg(both.map(r => r.postPct - r.prePct)) : null,
      passN: posts.filter(r => r.passed).length };
  },
  renderBody() {
    const box = $('#tbody'); if (!box) return;
    const c = this.calc(), dash = v => v == null ? '–' : v, sgn = v => v == null ? '–' : `<span class="${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '+' : ''}${v}</span>`;
    if (this.tab === 'sum') {
      box.innerHTML = `<div class="tiles4">
        <div class="stile"><small>ทำ Pre-test</small><strong>${c.pres.length}</strong> <em>คน</em></div>
        <div class="stile"><small>ทำ Post-test</small><strong>${c.posts.length}</strong> <em>คน</em></div>
        <div class="stile"><small>ทำครบทั้ง 2 ครั้ง</small><strong>${c.both.length}</strong> <em>คน</em></div>
        <div class="stile"><small>คะแนนเฉลี่ย Pre</small><strong>${dash(c.preAvg)}</strong><em>%</em></div>
        <div class="stile"><small>คะแนนเฉลี่ย Post</small><strong>${dash(c.postAvg)}</strong><em>%</em></div>
        <div class="stile"><small>เพิ่มขึ้นเฉลี่ย (คนที่ทำครบ)</small><strong>${sgn(c.gain)}</strong><em>%</em></div>
        <div class="stile"><small>ผ่านเกณฑ์ ${this.t.pass_percent}% (Post)</small><strong>${c.passN}</strong> <em>/ ${c.posts.length} คน${c.posts.length ? ` · ${Math.round(100 * c.passN / c.posts.length)}%` : ''}</em></div>
      </div>${c.rows.length ? '' : '<div class="empty">ยังไม่มีผู้ส่งแบบทดสอบ</div>'}`;
    } else if (this.tab === 'people') {
      const k = this.q.toLowerCase(), list = c.rows.filter(r => !k || (r.emp_id + r.name + r.dept).toLowerCase().includes(k));
      const cell = (r, ph) => r[ph] ? `${r[ph].score}/${r[ph].total} <button class="xbtn" data-del="${r[ph].id}" title="ลบผลนี้ให้ทำใหม่">✕</button>` : '–';
      box.innerHTML = `<input class="search" id="pq" placeholder="ค้นหารหัส / ชื่อ / แผนก" value="${esc(this.q)}" style="margin-bottom:10px">
        <div class="tblwrap"><table class="rep"><tr><th>รหัส</th><th>ชื่อ-สกุล</th><th>แผนก</th><th class="num">Pre</th><th class="num">Post</th><th class="num">เปลี่ยนแปลง</th><th>ผล</th></tr>
        ${list.map(r => `<tr><td>${esc(r.emp_id)}</td><td>${esc(r.name)}</td><td>${esc(r.dept)}</td>
          <td class="num">${cell(r, 'pre')}</td><td class="num">${cell(r, 'post')}</td>
          <td class="num">${r.pre && r.post ? sgn(r.post.score - r.pre.score) : '–'}</td>
          <td>${r.passed == null ? '<span class="hint">ยังไม่ทำ Post</span>' : r.passed ? '<span class="up">ผ่าน</span>' : '<span class="down">ไม่ผ่าน</span>'}</td></tr>`).join('')}
        </table></div>${list.length ? '' : '<div class="empty">ไม่มีข้อมูล</div>'}`;
      $('#pq').oninput = e => { this.q = e.target.value; const pos = e.target.selectionStart; this.renderBody(); const el = $('#pq'); el.focus(); el.setSelectionRange(pos, pos); };
      $$('[data-del]', box).forEach(b => b.onclick = async () => {
        if (!confirm('ลบผลนี้? ผู้ทำจะส่งใหม่ได้')) return;
        const { error } = await sb.from('test_submissions').delete().eq('id', b.dataset.del);
        if (error) return toast(errMsg(error), true);
        await this.loadSubs(); this.renderBody(); toast('ลบแล้ว');
      });
    } else if (this.tab === 'dept') {
      box.innerHTML = `<div class="tblwrap"><table class="rep"><tr><th>แผนก</th><th class="num">คน</th><th class="num">เฉลี่ย Pre %</th><th class="num">เฉลี่ย Post %</th><th class="num">ผ่าน (Post)</th></tr>
        ${c.depts.map(d => `<tr><td>${esc(d.dept)}</td><td class="num">${d.n}</td><td class="num">${dash(d.pre)}</td><td class="num">${dash(d.post)}</td>
          <td class="num">${d.postN ? `${d.passN}/${d.postN} (${Math.round(100 * d.passN / d.postN)}%)` : '–'}</td></tr>`).join('')}
        </table></div>${c.depts.length ? '' : '<div class="empty">ไม่มีข้อมูล</div>'}`;
    } else {
      box.innerHTML = `<p class="hint">แถวสีแดง = Post-test ตอบถูกน้อยกว่า 60% ควรทบทวนเนื้อหาข้อนี้</p>
        <div class="tblwrap"><table class="rep"><tr><th>ข้อ</th><th>คำถาม</th><th class="num">ถูก Pre %</th><th class="num">ถูก Post %</th><th>ตอบผิดมากสุด (Post)</th></tr>
        ${c.items.map(it => `<tr class="${it.post.pct != null && it.post.pct < 60 ? 'low' : ''}"><td>${it.n}</td>
          <td style="white-space:normal;min-width:220px">${esc(it.text)}</td><td class="num">${dash(it.pre.pct)}</td><td class="num">${dash(it.post.pct)}</td>
          <td style="white-space:normal">${it.post.wrong >= 0 ? `${LETTERS[it.post.wrong]}. ${esc(it.choices[it.post.wrong] || '(รูป)')} (${it.post.wrongN} คน)` : '–'}</td></tr>`).join('')}
        </table></div>`;
    }
  },
  bigQR() {
    const el = document.createElement('div'); el.className = 'qroverlay';
    el.innerHTML = `<h1>${esc(this.t.title)}</h1><div class="qrbox" id="bq"></div>
      <div class="url">${esc(this.link().replace(/^https?:\/\//, ''))}</div><div class="code">แตะที่ใดก็ได้เพื่อปิด</div>`;
    document.body.appendChild(el);
    try { new QRCode($('#bq'), { text: this.link(), width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
    el.onclick = () => { el.remove(); try { document.exitFullscreen(); } catch (e) {} };
    try { el.requestFullscreen?.(); } catch (e) {}
    onLeave(() => el.remove());
  },
  async excel() {
    try { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); }
    catch (e) { return toast('โหลดตัวสร้าง Excel ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต', true); }
    const c = this.calc(), t = this.t, X = window.XLSX, wb = X.utils.book_new();
    const add = (name, rows) => { const ws = X.utils.aoa_to_sheet(rows); ws['!cols'] = rows[0].map(() => ({ wch: 16 })); X.utils.book_append_sheet(wb, ws, name); };
    add('สรุป', [['หัวข้อ', 'ค่า'], ['รอบอบรม', t.title], ['รหัส', t.code], ['จำนวนข้อ', t.total], ['เกณฑ์ผ่าน (%)', t.pass_percent],
      ['ทำ Pre-test (คน)', c.pres.length], ['ทำ Post-test (คน)', c.posts.length], ['ทำครบ 2 ครั้ง (คน)', c.both.length],
      ['คะแนนเฉลี่ย Pre (%)', c.preAvg ?? ''], ['คะแนนเฉลี่ย Post (%)', c.postAvg ?? ''], ['เพิ่มขึ้นเฉลี่ย (%)', c.gain ?? ''],
      ['ผ่านเกณฑ์ (คน)', c.passN], ['ผ่านเกณฑ์ (%)', c.posts.length ? Math.round(100 * c.passN / c.posts.length) : '']]);
    add('รายคน', [['รหัสพนักงาน', 'ชื่อ-สกุล', 'แผนก', 'Pre คะแนน', 'Pre %', 'Post คะแนน', 'Post %', 'เปลี่ยนแปลง', 'ผล', 'เวลาส่ง Pre', 'เวลาส่ง Post']]
      .concat(c.rows.map(r => [r.emp_id, r.name, r.dept, r.pre ? r.pre.score : '', r.prePct ?? '', r.post ? r.post.score : '', r.postPct ?? '',
        r.pre && r.post ? r.post.score - r.pre.score : '', r.passed == null ? 'ยังไม่ทำ Post' : r.passed ? 'ผ่าน' : 'ไม่ผ่าน',
        r.pre ? new Date(r.pre.submitted_at).toLocaleString('th-TH') : '', r.post ? new Date(r.post.submitted_at).toLocaleString('th-TH') : ''])));
    add('รายแผนก', [['แผนก', 'จำนวนคน', 'เฉลี่ย Pre %', 'เฉลี่ย Post %', 'ผ่าน (คน)', 'ทำ Post (คน)', 'ผ่าน %']]
      .concat(c.depts.map(d => [d.dept, d.n, d.pre ?? '', d.post ?? '', d.passN, d.postN, d.postN ? Math.round(100 * d.passN / d.postN) : ''])));
    add('รายข้อ', [['ข้อ', 'คำถาม', 'คำตอบที่ถูก', 'ถูก Pre %', 'ถูก Post %', 'ตอบผิดมากสุด (Post)', 'จำนวน']]
      .concat(c.items.map(it => [it.n, it.text, `${LETTERS[it.correct]}. ${it.choices[it.correct] || '(รูป)'}`, it.pre.pct ?? '', it.post.pct ?? '',
        it.post.wrong >= 0 ? `${LETTERS[it.post.wrong]}. ${it.choices[it.post.wrong] || '(รูป)'}` : '', it.post.wrongN || ''])));
    add('คำตอบดิบ', [['ครั้ง', 'รหัสพนักงาน', 'ชื่อ-สกุล', 'แผนก', 'คะแนน', ...t.questions.map((q, i) => `ข้อ ${i + 1}`)]]
      .concat(this.subs.map(s => [s.phase === 'pre' ? 'Pre' : 'Post', s.emp_id, s.full_name, s.department, s.score,
        ...s.answers.map((a, i) => LETTERS[a] + (a === t.questions[i].correct ? ' ✓' : ''))])));
    X.writeFile(wb, `PrePost-${t.title}-${new Date().toISOString().slice(0, 10)}.xlsx`.replace(/[\\/:*?"<>|]/g, '_'));
  }
};
function loadScript(src) {
  return new Promise((res, rej) => {
    if ([...document.scripts].some(s => s.src === src)) return res();
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
}

function countUp(el) {
  if (!el) return;
  const from = +el.dataset.from, to = +el.dataset.to, t0 = performance.now(), dur = 900;
  const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(Math.round(from + (to - from) * e)); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

// =====================================================================
// เริ่มต้น
// =====================================================================
(async function init() {
  if (!CFG.SUPABASE_URL || /x{6}/.test(CFG.SUPABASE_URL) || !window.supabase) {
    setBody('player');
    app.innerHTML = `<div class="center-msg"><div class="box"><div class="brand" style="font-size:40px">${brandHTML()}</div>
      <p>${window.supabase ? 'ยังไม่ได้ตั้งค่า — แก้ไฟล์ <b>config.js</b> ใส่ SUPABASE_URL และ SUPABASE_ANON_KEY'
                           : 'โหลดไลบรารีไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรช'}</p></div></div>`;
    return;
  }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY,
    { auth: { persistSession: true, detectSessionInUrl: true, flowType: 'pkce' } });
  const { data: { session } } = await sb.auth.getSession();
  let back = null; try { back = sessionStorage.getItem('quizlive.returnTo'); } catch (e) {}
  if (session && back) {
    try { sessionStorage.removeItem('quizlive.returnTo'); } catch (e) {}
    history.replaceState(null, '', location.pathname + back);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
