<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10283a">
<title>Quiz Live</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="avatars.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --paper:#f6f3ec; --card:#fff; --ink:#18222d; --muted:#5f6c78; --line:#e2dccf;
  --navy:#10283a; --navy2:#183b54; --navy3:#22506f; --sun:#ffc63d; --sun2:#ffdb7d;
  --c0:#e44d57; --c1:#2c7bd6; --c2:#ec9a26; --c3:#2a9d63;
  --good:#1f8a54; --bad:#b4373e;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Prompt',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;min-height:100dvh;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}
.c0{background:var(--c0)} .c1{background:var(--c1)} .c2{background:var(--c2)} .c3{background:var(--c3)}

.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:600;background:var(--navy);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;
  transition:transform .1s, opacity .2s}
.btn:active{transform:translateY(1px)}
.btn.sun{background:var(--sun);color:var(--navy)}
.btn.ghost{background:transparent;border:1.5px solid currentColor;color:inherit}
.btn.light{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid #e8c3c3}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.lg{padding:16px 26px;font-size:20px;border-radius:14px}
.btn:disabled{opacity:.4;cursor:default;transform:none}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,150%);
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;transition:transform .3s;z-index:99;
  max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:15px}
#toast.show{transform:translate(-50%,0)}
#toast.err{background:var(--bad)}
.center-msg{min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center}
.center-msg .box{max-width:460px}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid rgba(127,127,127,.25);border-top-color:currentColor;
  animation:spin .8s linear infinite;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- ผู้เล่น ---------- */
body.player{background:var(--navy);color:#fff}
body.player.good{background:var(--good)} body.player.bad{background:var(--bad)}
.brand{font-weight:800;letter-spacing:-.5px;line-height:1}
.brand span{color:var(--sun)}
.join{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:22px;
  padding:24px 16px calc(24px + env(safe-area-inset-bottom));max-width:440px;margin:auto}
.join .brand{font-size:44px;text-align:center}
.join .tag{text-align:center;margin:-12px 0 0;opacity:.75}
.jcard{background:#fff;color:var(--ink);border-radius:20px;padding:20px;display:grid;gap:12px;
  box-shadow:0 12px 40px rgba(0,0,0,.25)}
.jcard label{font-size:14px;color:var(--muted);margin-bottom:-6px}
.jcard input{width:100%;padding:13px;border:2px solid var(--line);border-radius:12px;font-size:20px;text-align:center;outline:none}
.jcard input:focus{border-color:var(--navy3)}
#pin{font-size:32px;letter-spacing:10px;font-weight:700}
.jcard .btn{padding:15px;font-size:19px}
.host-link{text-align:center;opacity:.7;font-size:14px}

.pscreen{min-height:100dvh;display:flex;flex-direction:column;gap:14px;max-width:560px;margin:auto;
  padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.pbar{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:8px}
.pbar .me{background:rgba(255,255,255,.14);padding:4px 12px;border-radius:99px;max-width:50%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbar{height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--sun);width:100%;transition:width .2s linear}
.pq{font-size:21px;font-weight:600;margin:0}
.pimg{max-width:100%;max-height:28vh;object-fit:contain;border-radius:12px;align-self:center;background:#fff}
.pchoices{display:grid;gap:10px}
.pc{display:flex;align-items:center;gap:12px;border:0;border-radius:16px;padding:14px;color:#fff;font-size:18px;
  text-align:left;min-height:66px;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .08s,opacity .2s}
.pc b{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.24);display:grid;place-items:center;
  font-size:22px;flex:none}
.pc:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.pc:disabled{cursor:default}
.pc.dim{opacity:.3}
.pmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.pmid h1{font-size:34px;margin:0;line-height:1.15}
.pmid p{margin:0;opacity:.85;font-size:17px}
.bignum{font-size:56px;font-weight:800;line-height:1}
.chosen{display:flex;align-items:center;gap:12px;padding:16px 20px;border-radius:16px;font-size:20px;max-width:100%}
.chosen b{font-size:26px}
.stat{display:flex;gap:10px;width:100%}
.stat div{flex:1;background:rgba(0,0,0,.18);border-radius:14px;padding:12px}
.stat small{display:block;opacity:.8;font-size:13px}
.stat strong{font-size:26px}
.dots span{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--sun);margin:0 4px;
  animation:bounce 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s} .dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-10px);opacity:1}}
.namechip{font-size:26px;font-weight:700;background:#fff;color:var(--navy);padding:8px 22px;border-radius:99px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis}
.linkbtn{background:none;border:0;opacity:.7;text-decoration:underline;font-size:14px;padding:8px}

/* ---------- ผู้จัด ---------- */
.topbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
.topbar .in{max-width:980px;margin:auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.topbar .brand{font-size:24px;text-decoration:none}
.topbar .who{margin-left:auto;font-size:13px;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
.wrap{max-width:980px;margin:auto;padding:20px 16px 120px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
h2.sec{font-size:22px;margin:0}
.tabs{display:flex;gap:6px;background:#ebe5d8;padding:4px;border-radius:12px;width:max-content;max-width:100%}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:500;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.search{padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;min-width:0;width:100%;max-width:280px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:16px}
.qz{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.qz h3{margin:0;font-size:18px;line-height:1.3}
.qz .meta{font-size:13px;color:var(--muted)}
.qz .acts{display:flex;gap:8px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.dept{display:inline-block;font-size:12px;background:#fff4d4;color:#7a5600;padding:2px 9px;border-radius:99px;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:40px 16px;border:2px dashed var(--line);border-radius:16px;margin-top:16px}
.live{background:#fff8e3;border:1px solid #f3dc9a;border-radius:14px;padding:12px 14px;margin-top:16px}
.live .it{display:flex;align-items:center;gap:10px;padding:6px 0;flex-wrap:wrap}
.live .it + .it{border-top:1px dashed #ecd9a4}

.fld{display:grid;gap:6px}
.fld label{font-size:14px;color:var(--muted);font-weight:500}
.inp{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;background:#fff;outline:none}
.inp:focus{border-color:var(--navy3)}
textarea.inp{resize:vertical;min-height:62px}
.meta-grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:16px;margin-top:14px}
.meta-grid .full{grid-column:1/-1}
.qcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px;display:grid;gap:10px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qnum{font-weight:700;background:var(--navy);color:#fff;border-radius:9px;padding:3px 11px}
.qhead select{padding:6px 8px;border:1.5px solid var(--line);border-radius:9px;background:#fff}
.icon-btn{border:1.5px solid var(--line);background:#fff;border-radius:9px;width:34px;height:34px;display:grid;place-items:center;font-size:15px}
.icon-btn:disabled{opacity:.35}
.qimg{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qimg img{max-height:120px;max-width:220px;border-radius:10px;border:1px solid var(--line)}
.upl{font-size:14px;color:var(--navy3);border:1.5px dashed #b8c7d3;border-radius:10px;padding:7px 12px;cursor:pointer}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:5px 6px 5px 5px;background:#fff}
.opt.on{border-color:var(--good);background:#eefaf3}
.opt .mark{position:relative;flex:none;cursor:pointer}
.opt .mark input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt .mark b{width:36px;height:36px;border-radius:9px;color:#fff;display:grid;place-items:center;font-size:18px}
.opt.on .mark b::after{content:'✓';position:absolute;right:-5px;top:-6px;background:var(--good);color:#fff;
  width:18px;height:18px;border-radius:50%;font-size:11px;display:grid;place-items:center;border:2px solid #fff}
.opt input[type=text]{border:0;outline:none;flex:1;min-width:0;padding:6px;background:transparent}
.hint{font-size:13px;color:var(--muted);margin:0}
.savebar{position:fixed;left:0;right:0;bottom:0;background:rgba(246,243,236,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);z-index:6}
.savebar .in{max-width:980px;margin:auto;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));align-items:center}
.savebar .st{font-size:13px;color:var(--muted)}
/* v6: Pre/Post Test */
body.test{background:#eef2f6;color:var(--ink)}
.tst{max-width:640px;margin:auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom))}
.tst-head{background:var(--navy);color:#fff;border-radius:18px;padding:18px;display:grid;gap:8px}
.tst-head .brand{font-size:22px}
.tst-head h1{margin:0;font-size:22px;line-height:1.3}
.tst-head img{width:100%;max-height:180px;object-fit:cover;border-radius:12px}
.phase{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:#e9eef3;color:var(--muted)}
.phase.open{background:#dff3e8;color:#1b6b42}
.phase.pre{background:#e3efff;color:#1f5ea8} .phase.post{background:#fff1d6;color:#8a5a00}
.tcard{background:#fff;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:grid;gap:10px}
.tcard .fld label{color:var(--muted)}
.seg{display:flex;gap:8px}
.seg label{flex:1;border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-weight:600;cursor:pointer}
.seg input{display:none}
.seg label:has(input:checked){border-color:var(--navy3);background:#eef4f9}
.seg label:has(input:disabled){opacity:.4;cursor:default}
.tq{background:#fff;border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:grid;gap:10px;scroll-margin-top:70px}
.tq .qn{font-size:13px;color:var(--muted);font-weight:600}
.tq h3{margin:0;font-size:18px;line-height:1.4}
.tq .qimg{max-width:100%;max-height:240px;border-radius:10px;justify-self:center;object-fit:contain}
.tq .opts2{display:grid;gap:8px}
.tq .opts2.imgs{grid-template-columns:1fr 1fr}
.tch{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;padding:8px;background:#fff;text-align:left;font-size:16px;width:100%}
.tch b{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:17px}
.tch .cbody{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.tch .cimg{max-height:120px;border-radius:8px;align-self:flex-start}
.tch.on{border-color:var(--navy3);background:#eaf2fa;box-shadow:inset 0 0 0 1px var(--navy3)}
.tch.right{border-color:var(--good);background:#eaf8f0}
.tch.wrong{border-color:var(--bad);background:#fdecec}
.tch .mk{margin-left:auto;font-weight:700}
.tbar2{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:6}
.tbar2 .in{max-width:640px;margin:auto;display:flex;gap:10px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.tbar2 .prog{flex:1;font-size:14px;color:var(--muted)}
.tbar2 .prog i{display:block;height:6px;border-radius:99px;background:#e3e8ee;margin-top:5px;overflow:hidden}
.tbar2 .prog i span{display:block;height:100%;background:var(--good);transition:width .2s}
.score-big{font-size:64px;font-weight:800;line-height:1;text-align:center}
.score-big small{font-size:24px;color:var(--muted);font-weight:600}
.passbadge{justify-self:center;padding:6px 18px;border-radius:99px;font-weight:700}
.passbadge.ok{background:#dff3e8;color:#1b6b42} .passbadge.no{background:#fde4e4;color:#9b2c2c}
/* จัดการรอบ + รายงาน */
.trow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.linkbox{display:flex;align-items:center;gap:8px;background:#f3f6f9;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:600;word-break:break-all}
.tiles4{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.stile small{display:block;color:var(--muted);font-size:13px}
.stile strong{font-size:26px}
.stile em{font-style:normal;font-size:13px;color:var(--muted)}
.tblwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
table.rep{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
table.rep th,table.rep td{padding:8px 10px;border-bottom:1px solid #eef0f3;text-align:left;white-space:nowrap}
table.rep th{background:#f6f8fa;font-weight:600;position:sticky;top:0}
table.rep td.num,table.rep th.num{text-align:right}
table.rep tr.low td{background:#fff5f5}
.up{color:var(--good);font-weight:700} .down{color:var(--bad);font-weight:700}
.xbtn{border:0;background:none;color:#b9c1ca;padding:0 4px;font-size:13px}
.xbtn:hover{color:var(--bad)}
.qroverlay{position:fixed;inset:0;background:var(--navy);color:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:3vh}
.qroverlay .qrbox{width:min(70vh,90vw)}
.qroverlay h1{margin:0;font-size:clamp(24px,3.4vw,52px);text-align:center}
.qroverlay .url{font-size:clamp(22px,3vw,44px);font-weight:700;color:var(--sun2)}
.qroverlay .code{font-size:clamp(18px,2vw,30px);opacity:.85}
/* v5: รูปประจำตัว */
.avwrap{position:relative;display:inline-block;line-height:0}
.avwrap .av.xl{width:132px;height:132px}
.avwrap .medal{position:absolute;right:-10px;bottom:-8px;font-size:48px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.av{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;line-height:0;
  background:var(--navy3);color:#fff;font-weight:700;font-size:16px;vertical-align:middle}
.av svg{width:100%;height:100%;display:block}
.av.lg{width:96px;height:96px;font-size:36px;box-shadow:0 0 0 4px #fff}
.av.xl{width:clamp(72px,9vw,130px);height:clamp(72px,9vw,130px);font-size:40px;box-shadow:0 0 0 5px #fff}
.av.sm{width:26px;height:26px;font-size:12px}
.avpick{display:flex;align-items:center;gap:10px}
.avpick .av{width:52px;height:52px;box-shadow:0 0 0 3px var(--sun)}
.avpick input{flex:1;min-width:0}
.avtabs{display:flex;gap:6px}
.avtabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px;font-size:14px;color:var(--muted)}
.avtabs button.on{border-color:var(--navy3);color:var(--ink);font-weight:600;background:#eef4f9}
.avgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:236px;overflow-y:auto;padding:4px}
.avgrid button{border:0;background:none;padding:0;border-radius:50%;aspect-ratio:1;transition:transform .1s}
.avgrid button .av{width:100%;height:100%}
.avgrid button.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--good);transform:scale(.92)}
.pbar .me{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 3px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 16px 5px 5px}
.chip .av{width:clamp(30px,2.6vw,40px);height:clamp(30px,2.6vw,40px)}
.lbrow .nm{display:flex;align-items:center;gap:10px;left:8px}
.lbrow .nm .av{width:calc(var(--row) - 18px);height:calc(var(--row) - 18px)}
.lbrow .nm span{overflow:hidden;text-overflow:ellipsis}
.rest span{display:inline-flex;align-items:center;gap:6px;padding:3px 14px 3px 3px}
/* v4: แถบเฉลยบนหน้าสรุปคะแนน */
.ansbar{display:flex;align-items:center;justify-content:center;gap:clamp(10px,1.4vw,20px);flex-wrap:wrap;
  font-size:clamp(16px,1.6vw,24px);animation:pop .4s ease-out}
.ansbar .lbl{opacity:.85} .ansbar .lbl b{color:var(--sun);font-size:1.2em}
.anschip{display:inline-flex;align-items:center;gap:12px;border-radius:14px;padding:8px 18px 8px 8px;font-weight:700;
  font-size:clamp(18px,2vw,30px);box-shadow:0 0 0 4px #fff}
.anschip b{width:1.6em;height:1.6em;border-radius:10px;background:rgba(255,255,255,.25);display:grid;place-items:center}
.anschip img{height:clamp(44px,7vh,80px);border-radius:8px;background:#fff}
/* v3: แชร์ / ผู้ดูแล */
.vis{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;font-weight:600;background:#eef1f4;color:var(--muted)}
.vis.shared{background:#e3f4ea;color:#1b6b42}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:500}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:99px;background:#cfd6dc;position:relative;
  transition:background .2s;flex:none;cursor:pointer;margin:0}
.switch input::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
  transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked{background:var(--good)}
.switch input:checked::after{transform:translateX(20px)}

<body>
<div id="app"><div class="center-msg"><div class="spinner"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const CFG = window.QUIZ_CONFIG || {};
const APP = CFG.APP_NAME || 'Quiz Live';
const LETTERS = ['ก', 'ข', 'ค', 'ง'];
const TIMES = [10, 15, 20, 30, 45, 60, 90, 120];
const DEF_COLORS = ['#e44d57', '#2c7bd6', '#ec9a26', '#2a9d63'];
const PALETTES = [
  { name: 'มาตรฐาน', c: DEF_COLORS },
  { name: 'พาสเทล', c: ['#f4a3a8', '#9cc5ee', '#f7d08a', '#9fd8b8'] },
  { name: 'ฟ้า-เขียว', c: ['#0e7490', '#0891b2', '#14b8a6', '#65a30d'] },
  { name: 'สดใส', c: ['#d946ef', '#f43f5e', '#f97316', '#eab308'] },
  { name: 'เข้ม', c: ['#7f1d1d', '#1e3a8a', '#78350f', '#14532d'] },
  { name: 'ธรรมชาติ', c: ['#b45309', '#4d7c0f', '#0f766e', '#9a3412'] }
];
const HEX = /^#[0-9a-f]{6}$/i;
const colorAt = (colors, i) => (colors && HEX.test(colors[i] || '')) ? colors[i] : DEF_COLORS[i];
const inkFor = hex => { const n = parseInt(hex.slice(1), 16);
  return (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) > 170 ? '#18222d' : '#fff'; };
const chipStyle = (colors, i) => { const c = colorAt(colors, i); return `background:${c};color:${inkFor(c)}`; };
const imgAt = (images, i) => (images && typeof images[i] === 'string' && images[i]) || '';
const hasImgs = images => !!(images && images.some(Boolean));
const choiceBody = (text, img) =>
  `<span class="cbody">${img ? `<img class="cimg" src="${esc(img)}" alt="">` : ''}${text ? `<span>${esc(text)}</span>` : ''}</span>`;
const chosenHTML = (s, i) => `<div class="chosen" style="${chipStyle(s.colors, i)}">
  <div class="cb"><b>${LETTERS[i]}</b>${s.choices[i] ? `<span>${esc(s.choices[i])}</span>` : ''}</div>
  ${imgAt(s.images, i) ? `<img class="cimg" src="${esc(imgAt(s.images, i))}" alt="">` : ''}</div>`;
const app = document.getElementById('app');
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Number(n || 0).toLocaleString('th-TH');
const brandHTML = () => { const p = APP.split(' '); return p.length > 1 ? `${esc(p[0])} <span>${esc(p.slice(1).join(' '))}</span>` : esc(APP); };
const avatarHTML = (id, name, cls = '') => {
  const a = window.AVATARS && id ? window.AVATARS.byId(id) : null;
  return a ? `<span class="av ${cls}" role="img" aria-label="${esc(a.name)}">${a.svg}</span>`
           : `<span class="av ${cls}">${esc([...(name || '?')][0])}</span>`;
};
let sb = null;

function toast(msg, isErr) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = isErr ? 'err' : ''; }, 3200);
}
const errMsg = e => (e && (e.message || e.error_description)) || 'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง';
function save(k, v) { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
async function rpc(name, args) { const { data, error } = await sb.rpc(name, args || {}); if (error) throw error; return data; }
function setBody(cls) { document.body.className = cls; }

// ---- ล้างสิ่งที่หน้าเดิมเปิดไว้ (timer / realtime) เมื่อเปลี่ยนหน้า ----
let cleanups = [];
const onLeave = fn => cleanups.push(fn);
function resetView() { cleanups.forEach(f => { try { f(); } catch (e) {} }); cleanups = []; }

function route() {
  resetView();
  const [page, arg] = location.hash.replace(/^#\/?/, '').split('/');
  if (page === 'admin') return Admin.list();
  if (page === 'edit') return Admin.edit(arg);
  if (page === 'host') return Host.open(arg);
  if (page === 'training') return Training.open(arg);
  return Player.start();
}

// =====================================================================
// การเข้าสู่ระบบ (ผู้จัดเท่านั้น)
// =====================================================================
async function requireStaff() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { renderLogin(); return null; }
  const email = (session.user.email || '').toLowerCase();
  const dom = (CFG.ALLOWED_DOMAIN || '').toLowerCase();
  if (dom && !email.endsWith('@' + dom)) { renderWrongAccount(email); return null; }
  return session.user;
}
function renderLogin() {
  setBody('player');
  app.innerHTML = `<main class="join">
    <div class="brand">${brandHTML()}</div>
    <p class="tag">สำหรับผู้จัด: สร้างชุดคำถามและเปิดห้องเกม</p>
    <div class="jcard">
      <button class="btn" id="gbtn">เข้าสู่ระบบด้วย Google</button>
      <p class="hint" style="text-align:center">ใช้อีเมล @${esc(CFG.ALLOWED_DOMAIN || '')} เท่านั้น</p>
    </div>
    <a class="host-link" href="./">← กลับหน้าเข้าร่วมเกม</a></main>`;
  $('#gbtn').onclick = login;
}
function renderWrongAccount(email) {
  setBody('player');
  app.innerHTML = `<main class="join"><div class="brand">${brandHTML()}</div>
    <div class="jcard"><p style="margin:0;text-align:center">บัญชี <b>${esc(email)}</b><br>ไม่ใช่อีเมล @${esc(CFG.ALLOWED_DOMAIN)}</p>
    <button class="btn" id="out">ออกจากระบบ แล้วเข้าใหม่</button></div></main>`;
  $('#out').onclick = async () => { await sb.auth.signOut(); login(); };
}
async function login() {
  try { sessionStorage.setItem('quizlive.returnTo', location.hash || '#admin'); } catch (e) {}
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: location.origin + location.pathname,
               queryParams: { hd: CFG.ALLOWED_DOMAIN || '', prompt: 'select_account' } }
  });
  if (error) toast(errMsg(error), true);
}
function adminShell(user, inner) {
  return `<header class="topbar"><div class="in">
      <a class="brand" href="#admin">${brandHTML()}</a>
      <span class="who">${esc(user.email)}</span>
      <button class="btn ghost sm" id="logout">ออกจากระบบ</button></div></header>
    <main class="wrap">${inner}</main>`;
}
function bindShell() {
  const b = $('#logout'); if (b) b.onclick = async () => { await sb.auth.signOut(); if (location.hash === '#admin') route(); else location.hash = '#admin'; };
}

// =====================================================================
// ผู้เล่น (มือถือ ไม่ต้องล็อกอิน)
// =====================================================================
const Player = {
  KEY: 'quizlive.player',
  start() {
    setBody('player');
    const tcode = (new URLSearchParams(location.search).get('t') || '').replace(/\D/g, '').slice(0, 6);
    if (tcode) return Test.start(tcode);
    const pin = (new URLSearchParams(location.search).get('pin') || '').replace(/\D/g, '').slice(0, 6);
    const saved = load(this.KEY);
    if (saved && saved.player_id && (!pin || pin === saved.pin)) return this.enter(saved);
    if (saved && pin && pin !== saved.pin) save(this.KEY);
    this.joinForm(pin);
  },
  joinForm(pin) {
    setBody('player');
    app.innerHTML = `<main class="join">
      <div class="brand">${brandHTML()}</div>
      <p class="tag">เกมตอบคำถาม เล่นพร้อมกันทั้งห้อง</p>
      <form class="jcard" id="jf" autocomplete="off">
        <label for="pin">รหัสห้อง (PIN)</label>
        <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" value="${esc(pin || '')}">
        <label for="nick">ชื่อที่จะแสดงบนจอ</label>
        <div class="avpick"><span id="avprev"></span><input id="nick" maxlength="30" placeholder="เช่น อ๊อฟ IT"></div>
        <label>เลือกรูปประจำตัว</label>
        <div class="avtabs"><button type="button" data-g="สัตว์น่ารัก">🐾 สัตว์น่ารัก</button><button type="button" data-g="บุคลากร รพ.">🏥 บุคลากร รพ.</button></div>
        <div class="avgrid" id="avgrid"></div>
        <button class="btn sun" id="jbtn">เข้าร่วมเกม</button>
      </form>
      <a class="host-link" href="#admin">สำหรับผู้จัด: สร้างและเปิดเกม →</a></main>`;
    const pinEl = $('#pin'), nickEl = $('#nick');
    try { nickEl.value = localStorage.getItem('quizlive.nick') || ''; } catch (e) {}
    (pin ? nickEl : pinEl).focus();
    // รูปประจำตัว: ใช้รูปเดิมที่เคยเลือก หรือสุ่มให้ 1 รูป
    const AVL = (window.AVATARS && window.AVATARS.list) || [];
    let avatar = null; try { avatar = localStorage.getItem('quizlive.avatar'); } catch (e) {}
    if (!AVL.some(a => a.id === avatar)) avatar = AVL.length ? AVL[Math.floor(Math.random() * AVL.length)].id : null;
    let group = (AVL.find(a => a.id === avatar) || {}).group || 'สัตว์น่ารัก';
    const drawAv = () => {
      $('#avprev').innerHTML = avatarHTML(avatar, nickEl.value);
      $$('.avtabs button').forEach(b => b.classList.toggle('on', b.dataset.g === group));
      $('#avgrid').innerHTML = AVL.filter(a => a.group === group).map(a =>
        `<button type="button" data-av="${a.id}" class="${a.id === avatar ? 'on' : ''}" title="${esc(a.name)}">${avatarHTML(a.id)}</button>`).join('');
    };
    $$('.avtabs button').forEach(b => b.onclick = () => { group = b.dataset.g; drawAv(); });
    $('#avgrid').onclick = e => { const b = e.target.closest('[data-av]'); if (b) { avatar = b.dataset.av; drawAv(); } };
    if (!AVL.length) $$('.avtabs, #avgrid').forEach(el => el.hidden = true);
    drawAv();
    pinEl.oninput = () => { pinEl.value = pinEl.value.replace(/\D/g, '').slice(0, 6); };
    $('#jf').onsubmit = async ev => {
      ev.preventDefault();
      const p = pinEl.value.trim(), n = nickEl.value.trim();
      if (p.length !== 6) return toast('รหัสห้องต้องเป็นตัวเลข 6 หลัก', true);
      if (!n) return toast('กรุณาใส่ชื่อ', true);
      const btn = $('#jbtn'); btn.disabled = true; btn.textContent = 'กำลังเข้าห้อง…';
      try {
        const r = await rpc('join_game', { p_pin: p, p_nickname: n, p_avatar: avatar });
        try { localStorage.setItem('quizlive.nick', n); if (avatar) localStorage.setItem('quizlive.avatar', avatar); } catch (e) {}
        const st = { ...r, pin: p }; save(this.KEY, st); this.enter(st);
      } catch (e) { toast(errMsg(e), true); btn.disabled = false; btn.textContent = 'เข้าร่วมเกม'; }
    };
  },
  enter(st) {
    resetView();
    this.st = st; this.key = ''; this.busy = false; this.s = null;
    app.innerHTML = `<div class="center-msg"><div class="spinner"></div></div>`;
    const ch = sb.channel('game-' + st.session_id)
      .on('broadcast', { event: 'state' }, () => setTimeout(() => this.refresh(), Math.random() * 500))
      .subscribe();
    const poll = setInterval(() => this.refresh(), 4000);
    const tick = setInterval(() => this.tick(), 200);
    const vis = () => { if (!document.hidden) this.refresh(); };
    document.addEventListener('visibilitychange', vis);
    onLeave(() => { clearInterval(poll); clearInterval(tick); sb.removeChannel(ch); document.removeEventListener('visibilitychange', vis); });
    this.refresh();
  },
  async refresh() {
    if (this.busy || !this.st) return;
    this.busy = true;
    try { this.render(await rpc('player_state', { p_player: this.st.player_id, p_token: this.st.token })); }
    catch (e) { /* เน็ตสะดุด รอรอบถัดไป */ }
    finally { this.busy = false; }
  },
  leave() { save(this.KEY); resetView(); this.joinForm(''); },
  render(s) {
    this.s = s;
    if (s.status === 'question') this.deadline = Date.now() + Number(s.remaining) * 1000;
    const key = [s.status, s.index, s.answered ? 1 : 0].join('|');
    if (key === this.key) return;
    this.key = key;
    setBody('player');
    const bar = `<div class="pbar"><span>${s.index >= 0 ? `ข้อ ${s.index + 1}/${s.total}` : esc(s.title || '')}</span>
      <span class="me">${avatarHTML(s.avatar, s.nickname, 'sm')}${esc(s.nickname || '')}</span></div>`;

    if (s.status === 'kicked') {
      save(this.KEY);
      app.innerHTML = `<main class="pscreen"><div class="pmid"><h1>ออกจากห้องแล้ว</h1>
        <p>ผู้จัดนำชื่อนี้ออกจากห้อง หรือห้องถูกลบ</p>
        <button class="btn sun lg" id="again">เข้าร่วมใหม่</button></div></main>`;
      $('#again').onclick = () => this.leave();
      resetView();
      return;
    }
    if (s.status === 'lobby') {
      app.innerHTML = `<main class="pscreen">${bar}<div class="pmid">
        ${s.cover_url ? `<img class="pcover" src="${esc(s.cover_url)}" alt="">` : ''}
        <p>เข้าห้องเรียบร้อย ✓</p>${avatarHTML(s.avatar, s.nickname, 'lg')}<div class="namechip">${esc(s.nickname)}</div>
        <h1 style="font-size:24px">${esc(s.title)}</h1>
        <div class="dots"><span></span><span></span><span></span></div>
        <p>ดูชื่อตัวเองบนจอ แล้วรอผู้จัดเริ่มเกม</p></div>
        <button class="linkbtn" id="quit">ออกจากห้อง</button></main>`;
      $('#quit').onclick = () => { if (confirm('ออกจากห้องนี้?')) this.leave(); };
      return;
    }
    if (s.status === 'question' && !s.answered) {
      const img = s.image_url ? `<img class="pimg" src="${esc(s.image_url)}" alt="">` : '';
      app.innerHTML = `<main class="pscreen">${bar}<div class="tbar"><i id="tfill"></i></div>
        <h2 class="pq">${esc(s.question)}</h2>${img}
        <div class="pchoices ${hasImgs(s.images) ? 'imgs' : ''}">${s.choices.map((c, i) =>
          `<button class="pc" style="${chipStyle(s.colors, i)}" data-i="${i}"><b>${LETTERS[i]}</b>${choiceBody(c, imgAt(s.images, i))}</button>`).join('')}</div>
        <p class="hint" id="tleft" style="color:inherit;opacity:.8;text-align:center"></p></main>`;
      $$('.pc').forEach(b => b.onclick = () => this.answer(+b.dataset.i));
      this.tick();
      return;
    }
    if (s.status === 'question' && s.answered) {
      const i = s.my_choice;
      app.innerHTML = `<main class="pscreen">${bar}<div class="pmid">
        <p>ส่งคำตอบแล้ว</p>${chosenHTML(s, i)}
        <div class="dots"><span></span><span></span><span></span></div><p>รอดูเฉลยบนจอ</p></div></main>`;
      return;
    }
    if (s.status === 'reveal') {
      const ok = s.is_correct;
      setBody('player ' + (ok ? 'good' : 'bad'));
      const head = ok ? `<h1>ถูกต้อง! 🎉</h1><div class="bignum">+${fmt(s.points)}</div>`
                      : `<h1>${s.answered ? 'ยังไม่ถูก' : 'ไม่ทันตอบ'}</h1><p>คำตอบที่ถูกคือ</p>${chosenHTML(s, s.correct)}`;
      app.innerHTML = `<main class="pscreen">${bar}<div class="pmid">${avatarHTML(s.avatar, s.nickname, 'lg')}${head}
        <div class="stat"><div><small>คะแนนรวม</small><strong>${fmt(s.score)}</strong></div>
        <div><small>อันดับ</small><strong>${s.rank}</strong> / ${s.players}</div></div>
        <p>รอข้อถัดไป…</p></div></main>`;
      return;
    }
    if (s.status === 'ended') {
      const medal = ['🥇', '🥈', '🥉'][s.rank - 1] || '🎯';
      app.innerHTML = `<main class="pscreen">${bar}<div class="pmid">
        <p>จบเกมแล้ว</p><div class="avwrap">${avatarHTML(s.avatar, s.nickname, 'xl')}<span class="medal">${medal}</span></div>
        <h1>อันดับ ${s.rank} จาก ${s.players} คน</h1>
        <div class="stat"><div><small>คะแนนรวม</small><strong>${fmt(s.score)}</strong></div></div>
        <p>ขอบคุณที่ร่วมสนุกครับ</p>
        <button class="btn sun lg" id="again">เข้าเกมใหม่</button></div></main>`;
      $('#again').onclick = () => this.leave();
    }
  },
  tick() {
    const s = this.s; if (!s || s.status !== 'question' || s.answered) return;
    const left = Math.max(0, (this.deadline - Date.now()) / 1000);
    const f = $('#tfill'); if (f) f.style.width = (100 * left / s.time) + '%';
    const t = $('#tleft');
    if (left <= 0) {
      $$('.pc').forEach(b => { b.disabled = true; b.classList.add('dim'); });
      if (t) t.textContent = 'หมดเวลา รอดูเฉลย';
    } else if (t) t.textContent = `เหลือ ${Math.ceil(left)} วินาที`;
  },
  async answer(i) {
    $$('.pc').forEach(b => { b.disabled = true; if (+b.dataset.i !== i) b.classList.add('dim'); });
    try {
      await rpc('submit_answer', { p_player: this.st.player_id, p_token: this.st.token, p_choice: i });
      this.render({ ...this.s, answered: true, my_choice: i });
    } catch (e) { toast(errMsg(e), true); this.key = ''; this.refresh(); }
  }
};

        <div class="qimg">${q.image_url
          ? `<img src="${esc(q.image_url)}" alt=""><button class="btn danger sm" data-act="rmimg">ลบรูป</button>`
          : `<label class="upl">🖼 ใส่รูปประกอบ<input type="file" accept="image/*" data-act="img" hidden></label>`}</div>

        <div class="opts">${[0, 1, 2, 3].map(i => `
          <div class="opt ${q.correct_index === i ? 'on' : ''}">

                placeholder="${q.images[i] ? 'คำบรรยายใต้รูป (ไม่บังคับ)' : `ตัวเลือก ${LETTERS[i]}${i >= 2 ? ' (ไม่บังคับ)' : ''}`}">
              ${q.images[i] ? `<div class="othumb"><img src="${esc(q.images[i])}" alt=""><button data-act="rmcimg" data-ci="${i}" title="ลบรูป">✕</button></div>` : ''}
            </div>
            ${q.images[i] ? '' : `<label class="obtn" title="ใช้รูปเป็นคำตอบ">🖼<input type="file" accept="image/*" data-act="cimg" data-ci="${i}" hidden></label>`}
            <label class="obtn swatch" title="เปลี่ยนสี" style="background:${colorAt(q.colors, i)}"><input type="color" data-f="color" data-ci="${i}" value="${colorAt(q.colors, i)}"></label>
          </div>`).join('')}</div>
        <p class="hint">แตะตัวอักษรสีเพื่อเลือกคำตอบที่ถูก · 🖼 ใช้รูปเป็นคำตอบ · วงกลมสีขวาสุดใช้เปลี่ยนสี</p>
      </section>`).join('');
  },
  onInput(e) {
    const el = e.target, card = el.closest('.qcard'); if (!card) return;
    const q = this.qs[+card.dataset.qi];
    if (el.dataset.act === 'img' || el.dataset.act === 'cimg') {
      if (e.type === 'change' && el.files[0]) this.upload(el.files[0], el).then(url => {
        if (url) { if (el.dataset.act === 'img') q.image_url = url; else q.images[+el.dataset.ci] = url; this.touch(); }
        this.renderQs();
      });
      return;
    }
    if (!el.dataset.f) return;
    const f = el.dataset.f;
    if (f === 'color') {
      const i = +el.dataset.ci, c = HEX.test(el.value) ? el.value : DEF_COLORS[i];
      q.colors[i] = c;
      const opt = $$('.opt', card)[i];
      $('.mark b', opt).style.cssText = chipStyle(q.colors, i);
      el.parentElement.style.background = c;
    }
    else if (f === 'text') q.text = el.value;
    else if (f === 'time_limit') q.time_limit = +el.value;
    else if (f === 'choice') q.choices[+el.dataset.ci] = el.value;
    else if (f === 'correct') {
      q.correct_index = +el.value;
      $$('.opt', card).forEach((o, i) => o.classList.toggle('on', i === q.correct_index));
    }
    this.touch();
  },
  onClick(e) {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const qi = +b.closest('.qcard').dataset.qi, a = b.dataset.act, qs = this.qs;
    if (a === 'up' && qi > 0) [qs[qi - 1], qs[qi]] = [qs[qi], qs[qi - 1]];
    else if (a === 'down' && qi < qs.length - 1) [qs[qi + 1], qs[qi]] = [qs[qi], qs[qi + 1]];
    else if (a === 'del') { if ((qs[qi].text || qs[qi].choices.some(Boolean)) && !confirm(`ลบข้อ ${qi + 1}?`)) return;
      qs.splice(qi, 1); if (!qs.length) qs.push(this.blankQ()); }
    else if (a === 'rmimg') qs[qi].image_url = '';
    else if (a === 'rmcimg') qs[qi].images[+b.dataset.ci] = '';
    else if (a === 'pal') qs[qi].colors = [...PALETTES[+b.dataset.pi].c];
    else if (a === 'palall') { const c = qs[qi].colors; qs.forEach(q => q.colors = [...c]); toast('ใช้ชุดสีนี้กับทุกข้อแล้ว'); }
    else return;
    this.touch(); this.renderQs();
  },
  // ย่อรูปแล้วอัปโหลด คืนค่า URL (หรือ null ถ้าไม่สำเร็จ)
  async upload(file, input, max = 1280) {
    const lbl = input.closest('label');
    if (lbl) { lbl.style.opacity = .5; if (lbl.classList.contains('upl')) lbl.firstChild.textContent = 'กำลังอัปโหลด… '; else lbl.firstChild.textContent = '⏳'; }
    try {
      const blob = await shrinkImage(file, max, 0.82);
      const path = `${this.user.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
      const { error } = await sb.storage.from('quiz-images').upload(path, blob, { contentType: 'image/jpeg' });
      if (error) throw error;
      return sb.storage.from('quiz-images').getPublicUrl(path).data.publicUrl;
    } catch (e) { toast('อัปโหลดรูปไม่สำเร็จ: ' + errMsg(e), true); return null; }
  },
  collect() {
    const title = $('#f-title').value.trim();
    if (!title) throw new Error('กรุณาใส่ชื่อเกม');
    const out = this.qs.map((q, n) => {
      const pairs = q.choices.map((t, i) => ({ t: t.trim(), img: q.images[i] || '', c: colorAt(q.colors, i), i }))
                             .filter(p => p.t || p.img);
      if (!q.text.trim()) throw new Error(`ข้อ ${n + 1}: ยังไม่ได้พิมพ์คำถาม`);
      if (pairs.length < 2) throw new Error(`ข้อ ${n + 1}: ต้องมีอย่างน้อย 2 ตัวเลือก (ข้อความหรือรูป)`);
      const ci = pairs.findIndex(p => p.i === q.correct_index);
      if (ci < 0) throw new Error(`ข้อ ${n + 1}: คำตอบที่ถูกเป็นช่องว่าง เลือกใหม่อีกครั้ง`);
      const item = { text: q.text.trim(), image_url: q.image_url || '', choices: pairs.map(p => p.t),
                     colors: pairs.map(p => p.c), correct_index: ci, time_limit: +q.time_limit || 20 };
      if (pairs.some(p => p.img)) item.choice_images = pairs.map(p => p.img);
      return item;
    });
    return { title, dept: $('#f-dept').value.trim(), desc: $('#f-desc').value.trim(), qs: out };
  },
  async saveQuiz(andPlay) {
    let d;
    try { d = this.collect(); } catch (e) { return toast(e.message, true); }
    const btns = [$('#save'), $('#saveplay')]; btns.forEach(b => b.disabled = true);
    try {
      const id = await rpc('save_quiz', { p_id: this.quiz.id, p_title: d.title, p_department: d.dept,
                                         p_description: d.desc, p_questions: d.qs, p_cover: this.quiz.cover_url || '',
                                         p_shared: $('#f-shared').checked });
      this.quiz.id = id; this.dirty = false; this.status();
      history.replaceState(null, '', '#edit/' + id);
      if (andPlay) return this.play(id);
      toast('บันทึกแล้ว');
    } catch (e) { toast(errMsg(e), true); }
    btns.forEach(b => b.disabled = false);
  }
};

function shrinkImage(file, max, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('แปลงรูปไม่ได้')), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('ไฟล์นี้ไม่ใช่รูปภาพ')); };
    img.src = url;
  });
}

// จอใหญ่ของผู้จัด (เปิดบนโปรเจกเตอร์)

const Host = {
  async open(sid) {
    setBody('stage');
    const user = await requireStaff(); if (!user) return;
    setBody('stage');
    app.innerHTML = `<div class="center-msg"><div class="spinner"></div></div>`;
    const { data: s, error } = await sb.from('sessions').select('*').eq('id', sid).single();
    if (error || !s) {
      app.innerHTML = `<div class="center-msg"><div class="box"><h2>ไม่พบห้องเกมนี้</h2>
        <a class="btn sun" href="#admin">กลับหน้าผู้จัด</a></div></div>`;
      return;
    }
    Object.assign(this, { sid, s, players: new Map(), answers: new Map(), phase: s.status,
                          deadline: s.question_ends_at ? Date.parse(s.question_ends_at) : 0,
                          revealing: false, prev: new Map() });
    await Promise.all([this.loadPlayers(), this.loadAnswers()]);

    const f = `session_id=eq.${sid}`;
    const ch = sb.channel('host-' + sid)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'players', filter: f }, p => {
        this.players.set(p.new.id, this.pick(p.new)); this.onPlayers(); })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'players', filter: f }, p => {
        this.players.set(p.new.id, this.pick(p.new)); })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'answers', filter: f }, p => {
        if (p.new.question_index === this.s.current_index) { this.answers.set(p.new.player_id, p.new.choice); this.onAnswers(); } })
      .subscribe();
    this.game = sb.channel('game-' + sid).subscribe();
    const poll = setInterval(() => this.sync(), 4000);
    const tick = setInterval(() => this.tick(), 200);
    onLeave(() => { clearInterval(poll); clearInterval(tick); sb.removeChannel(ch); sb.removeChannel(this.game); });
    this.render();
  },
  pick: r => ({ id: r.id, nickname: r.nickname, avatar: r.avatar, score: r.score, last_points: r.last_points }),
  async loadPlayers() {
    const { data } = await sb.from('players').select('id,nickname,avatar,score,last_points').eq('session_id', this.sid).order('joined_at');
    if (data) { this.players = new Map(data.map(p => [p.id, this.pick(p)])); }
  },
  async loadAnswers() {
    if (this.s.current_index < 0) return;
    const { data } = await sb.from('answers').select('player_id,choice')
      .eq('session_id', this.sid).eq('question_index', this.s.current_index);
    if (data) this.answers = new Map(data.map(a => [a.player_id, a.choice]));
  },
  async sync() {   // สำรองกรณี realtime สะดุด
    if (this.phase === 'lobby') { const n = this.players.size; await this.loadPlayers(); if (this.players.size !== n) this.onPlayers(); }
    else if (this.phase === 'question') { await Promise.all([this.loadPlayers(), this.loadAnswers()]); this.onAnswers(); }
  },
  broadcast() { this.game.send({ type: 'broadcast', event: 'state', payload: { status: this.s.status, index: this.s.current_index } }); },
  sorted(useScore = p => p.score) {
    return [...this.players.values()].sort((a, b) => useScore(b) - useScore(a) || a.nickname.localeCompare(b.nickname, 'th'));
  },
  q() { return this.s.questions[this.s.current_index]; },
  // ลิงก์เข้าร่วม: ใช้ JOIN_URL จาก config.js (ลิงก์สั้น) ถ้ามี ไม่งั้นใช้ลิงก์ที่เปิดอยู่
  joinBase() {
    let b = (CFG.JOIN_URL || '').trim() || (location.origin + location.pathname);
    if (!/^https?:\/\//.test(b)) b = 'https://' + b;
    return b.replace(/\/?$/, '/');
  },
  joinUrl() { return this.joinBase() + '?pin=' + this.s.pin; },
  topbar(extra = '') {
    return `<div class="stg-top"><span class="brand">${brandHTML()}</span>
      <span class="pill">${esc(this.s.title)}</span><span class="pill sun">PIN ${esc(this.s.pin)}</span>${extra}
      <div class="stg-actions"><button class="btn ghost sm" id="fs">⛶ เต็มจอ</button>
      ${this.phase !== 'ended' ? '<button class="btn ghost sm" id="endg">จบเกม</button>' : ''}</div></div>`;
  },
  bindTop() {
    $('#fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();

      <div class="lobby-bar"><span class="count"><b id="pc">0</b> คนเข้าห้องแล้ว</span><span class="grow"></span>
